    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const lv = m[1].length <= 2 ? 3 : 4; out.push(`<h${lv}>${inl(m[2])}</h${lv}>`); i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      const sep = r => r.every(c => /^:?-{2,}:?$/.test(c));
      let head = null; if (rows.length > 1 && sep(rows[1])) { head = rows[0]; rows.splice(0, 2); }
      const body = rows.filter(r => !sep(r));
      out.push('<div class="tbl"><table>' + (head ? '<thead><tr>' + head.map(c => `<th>${inl(c)}</th>`).join('') + '</tr></thead>' : '') +
        '<tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${inl(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*[-*•]\s+/.test(l)) { const it = []; while (i < L.length && /^\s*[-*•]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/, '')); out.push('<ul>' + it.map(x => `<li>${inl(x)}</li>`).join('') + '</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { const it = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/, '')); out.push('<ol>' + it.map(x => `<li>${inl(x)}</li>`).join('') + '</ol>'); continue; }
    const para = []; while (i < L.length && L[i].trim() && !(para.length && isBlockStart(L[i]))) para.push(L[i++]);
    out.push(`<p>${inl(para.join(' '))}</p>`);
  }
  return out.join('');
}

/* ---------- State and storage ---------- */
const S = { progress: {}, tests: {}, checkins: {}, meta: {}, activity: {}, mode: 'connecting', loaded: new Set() };
let db = null, sample = null, downloads = null;
const settings = () => S.meta.settings || {};
const prog = id => S.progress['q' + id] || {};

const writers = new Map();
let inflight = 0; const waiters = [];
async function slot() { if (inflight < 4) { inflight++; return; } await new Promise(r => waiters.push(r)); inflight++; }
function unslot() { inflight--; const w = waiters.shift(); if (w) w(); }
function busy() { for (const w of writers.values()) if (w.busy || w.next) return true; return false; }

function save(path, body) {
  dirty.delete(path);
  if (!db || S.mode !== 'live') { renderSync(); return; }
  let w = writers.get(path); if (!w) { w = { busy: false, next: null }; writers.set(path, w); }
  w.next = body; if (!w.busy) pump(path, w);
  renderSync();
}
async function pump(path, w) {
  w.busy = true;
  while (w.next) {
    const body = w.next; w.next = null;
    await slot();
    try {
      for (let attempt = 0; ; attempt++) {
        try { await db.doc(path).set(body); break; }
        catch (e) {
          if ((e.code === 'unavailable' || e.code === 'resource_exhausted') && attempt < 3) { await sleep(700 * (attempt + 1) + Math.random() * 600); continue; }
          if (e.code === 'revoked') { S.mode = 'off'; }
          else if (e.code === 'quota_exceeded') toast('Storage is full. Export a backup from Setup and remove old tests.');
          else toast('A change did not save. Check your connection; it will retry on your next change.');
          break;
        }
      }
    } finally { unslot(); }
  }
  w.busy = false; renderSync();
}
const dirty = new Set();
function pending(path) { const w = writers.get(path); return dirty.has(path) || !!(w && (w.busy || w.next)); }

function setProg(id, patch) {
  const k = 'q' + id; const next = { ...prog(id), ...patch, u: Date.now() };
  S.progress[k] = next; save('progress/' + k, next); bump();
}
function setDoc(coll, key, body) { S[coll][key] = body; save(coll + '/' + key, body); }

let actTimer = null;
function bump() {
  const k = today(); const cur = S.activity[k] || { n: 0 };
  S.activity[k] = { n: (cur.n || 0) + 1 };
  dirty.add('activity/' + k);
  clearTimeout(actTimer); actTimer = setTimeout(() => save('activity/' + k, S.activity[k]), 1500);
}

function subscribe() {
  const colls = ['progress', 'tests', 'checkins', 'meta', 'activity'];
  for (const name of colls) {
    db.collection(name).onSnapshot(snap => {
      let changed = !S.loaded.has(name);
      for (const ch of snap.docChanges()) {
        const id = ch.doc.id; const path = name + '/' + id;
        if (pending(path)) continue;
        if (ch.type === 'removed') { if (S[name][id]) { delete S[name][id]; changed = true; } continue; }
        const d = ch.doc.data();
        if (stable(d) !== stable(S[name][id])) { S[name][id] = JSON.parse(JSON.stringify(d)); changed = true; }
      }
      S.loaded.add(name);
      if (changed) softRender();
      renderSync();
    }, e => {
      S.mode = e.code === 'revoked' ? 'off' : 'error'; renderSync();
    });
  }
}
const ready = () => S.mode !== 'live' || S.loaded.size >= 5;

async function initCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') { S.mode = 'off'; renderSync(); render(); return; }
  window.claude.use('sample').then(s => { sample = s; softRender(); }).catch(() => {});
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { S.mode = 'off'; renderSync(); render(); return; }
  S.mode = 'live'; renderSync(); subscribe();
}

/* ---------- Plan math ---------- */
function plan() {
  const st = settings().startDate;
  const start = st ? parseD(st) : parseD(today());
  const dayIdx = Math.round((sod() - start.getTime()) / DAY);
  const week = clamp(Math.floor(dayIdx / 7) + 1, 1, 8);
  const dow = clamp(dayIdx - (week - 1) * 7, 0, 6);
  return { start, dayIdx, week, dow, set: !!st, done: dayIdx >= 56, before: dayIdx < 0 };
}
const weekRange = (p, w) => `${fmt(addDays(p.start, (w - 1) * 7))} – ${fmt(addDays(p.start, w * 7 - 1))}`;
function levelCounts(ids) { const c = [0, 0, 0, 0]; ids.forEach(id => c[clamp(prog(id).m || 0, 0, 3)]++); return c; }
function barHTML(ids) {
  const c = levelCounts(ids), n = ids.length || 1;
  return `<div class="bar" aria-label="${c[1] + c[2] + c[3]} of ${ids.length} started"><i class="b3" style="width:${c[3] / n * 100}%"></i><i class="b2" style="width:${c[2] / n * 100}%"></i><i class="b1" style="width:${c[1] / n * 100}%"></i></div>`;
}
const dueIds = () => ALL.filter(id => { const p = prog(id); return (p.m || 0) >= 1 && p.srs && p.srs.due <= Date.now(); }).sort((a, b) => prog(a).srs.due - prog(b).srs.due);
function drillStats(ids) { let s = 0, r = 0; ids.forEach(id => { const d = prog(id).dr; if (d) { s += d.s || 0; r += d.r || 0; } }); return { s, r }; }
function bestTest(kind, week) { const ts = Object.values(S.tests).filter(t => t.kind === kind && (kind === 'final' || t.week === week)); return ts.length ? { best: Math.max(...ts.map(t => t.score)), n: ts.length } : null; }
function streak() {
  let n = 0; let d = new Date();
  if (!(S.activity[dstr(d)]?.n)) d = addDays(d, -1);
  while (S.activity[dstr(d)]?.n) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- Spaced repetition (SM-2, capped at 30 days for an 8-week course) ---------- */
function schedule(srs, r) {
  let { iv = 0, ef = 2.5, n = 0, lp = 0 } = srs || {};
  if (r === 0) return { iv: 0, ef: Math.max(1.3, +(ef - 0.2).toFixed(2)), n: 0, lp: lp + 1, due: Date.now() + 10 * 60e3 };
  if (r === 1) { iv = Math.max(1, Math.round((iv || 1) * 1.2)); ef = Math.max(1.3, ef - 0.15); }
  else if (r === 2) { iv = n === 0 ? 1 : n === 1 ? 3 : Math.round(Math.max(iv, 1) * ef); }
  else { iv = n === 0 ? 3 : n === 1 ? 5 : Math.round(Math.max(iv, 1) * ef * 1.3); ef += 0.15; }
  iv = Math.min(iv, 30);
  return { iv, ef: +ef.toFixed(2), n: n + 1, lp, due: sod() + iv * DAY };
}
const ivLabel = s => s.iv === 0 ? '10m' : s.iv + 'd';

function setMastery(id, m) {
  const p = prog(id); const patch = { m };
  if (m >= 1 && !p.readAt) patch.readAt = today();
  if (m >= 1 && !p.srs) patch.srs = { iv: 0, ef: 2.5, n: 0, lp: 0, due: Date.now() };
  if (m === 0) { patch.srs = null; patch.readAt = null; }
  setProg(id, patch);
}

/* ---------- Claude in the page ---------- */
function sampleErr(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared') return 'Claude is not allowed on this page. Use the page menu’s Permissions to allow it.';
  if (c === 'rate_limited') return 'You have reached a usage limit. Try again in a little while.';
  if (c === 'session_expired') return 'Your claude.ai session expired. Sign in again and retry.';
  if (c === 'cancelled') return '';
  if (c === 'prompt_too_large') return 'That answer is too long to grade. Shorten it and try again.';
  return 'Claude could not answer just now. Try again.';
}
function refBlock(id) {
  const Q = q(id), a = Q.a, p = prog(id);
  let s = `QUESTION (Q${id}): ${Q.t}\n\n`;
  if (a) s += `REFERENCE NOTES (drafted ${a.lastVerified || ''}, confidence ${a.confidence || 'n/a'}; figures may be approximate):\nSummary: ${a.summary}\nKey points:\n${(a.keyPoints || []).map(k => '- ' + k).join('\n')}\nFull answer:\n${a.answer}\n`;
  if (p.my) s += `\nTHE BROKER'S OWN EDITED VERSION (treat as more current than the reference where they conflict):\n${p.my}\n`;
  if (p.note) s += `\nTHE BROKER'S NOTES:\n${p.note}\n`;
  return s;
}
async function grade(id, answer) {
  const prompt = `You are a senior multifamily investment sales broker in Ventura County, California, coaching a broker who is building expertise in this market. Grade their answer to a client-style question against the reference notes. Judge substance, accuracy, Ventura County specificity, and whether it would satisfy a sophisticated property owner or investor. Do not penalize brevity or casual wording when the substance is there. If their answer contradicts the reference on a fact, list it as a correction, noting that the reference itself may be dated.

${refBlock(id)}
BROKER'S ANSWER:
${answer}

Reply with only JSON in this shape:
{"score": 0-100 integer, "verdict": "Strong" | "Solid" | "Partial" | "Weak", "hits": ["up to 4 short points they got right"], "misses": ["up to 4 short important points missing"], "corrections": ["factual errors, empty if none"], "model": "a 2-4 sentence answer you would say to the client"}`;
  const r = await sample.json(prompt, { modelTier: 'default' });

const LF = { text: '', sec: 0, status: 'all' };
function libIds() {
  const t = LF.text.trim().toLowerCase(); const p = plan();
  return ALL.filter(id => {
    const Q = q(id), pr = prog(id), m = pr.m || 0;
    if (LF.sec && Q.s !== LF.sec) return false;
    switch (LF.status) {
      case 'new': if (m !== 0) return false; break;
      case 'read': if (m !== 1) return false; break;
      case 'explain': if (m !== 2) return false; break;
      case 'mastered': if (m !== 3) return false; break;
      case 'verify': if (!Q.a || pr.ver || Q.a.confidence === 'high') return false; break;
      case 'notes': if (!pr.note && !pr.my) return false; break;
      case 'missed': if (!pr.dr || pr.dr.s === pr.dr.r) return false; break;
      case 'behind': if (m >= 1 || !WEEKS.slice(0, p.week - 1).some(w => w.sections.includes(Q.s))) return false; break;
    }
    if (t) { const hay = (Q.t + ' ' + (Q.a ? Q.a.summary + ' ' + Q.a.answer + ' ' + (Q.a.keyPoints || []).join(' ') : '') + ' ' + (pr.note || '') + ' ' + (pr.my || '')).toLowerCase(); if (!(hay.includes(t) || ('q' + id) === t)) return false; }
    return true;
  });
}

/* Quiz */
const QZ = { scope: 'week', sec: 1, count: 10, items: null, i: 0, picked: null, right: 0 };
function poolIds(scope, sec) {
  const p = plan();

    : scope === 'weak' ? ALL.filter(id => { const d = prog(id).dr; return d && d.s && d.r / d.s < 0.75; })
    : scope === 'sec' ? SEC[sec].ids : ALL;

}
function mkItem(id, d) {

}
function buildItems(ids, n) {

  const pick = id => { const ds = q(id).a.drills; const free = ds.map((d, k) => k).filter(k => !used.has(id + ':' + k)); if (!free.length) return null; const k = free[Math.floor(Math.random() * free.length)]; used.add(id + ':' + k); return mkItem(id, ds[k]); };
  for (const id of shuffle(ids)) { if (items.length >= n) break; const it = pick(id); if (it) items.push(it); }
  let guard = 0; while (items.length < n && ids.length && guard++ < 500) { const it = pick(ids[Math.floor(Math.random() * ids.length)]); if (it) items.push(it); }
  return shuffle(items);
}

}

async function submitTest() {
  const t = TS;

      const f = t.frs[k];
      if (!f.text.trim()) { f.g = { score: 0, verdict: 'Weak', hits: [], misses: ['No answer given'], corrections: [], model: q(f.id).a.summary }; continue; }
      t.status = `Claude is grading client answer ${k + 1} of ${t.frs.length}…`; render();
      try { f.g = await grade(f.id, f.text); }
      catch (e) { toast(sampleErr(e) || 'Grading stopped.'); t.phase = 'self'; render(); return; }

function finishTest() {
  const t = TS;
  const right = t.items.filter((it, k) => t.picks[k] === it.a).length;
  t.items.forEach((it, k) => recordDrill(it.id, t.picks[k] === it.a));
  const frs = t.frs.map(f => ({ qid: f.id, score: f.g ? f.g.score : f.self, verdict: f.g ? f.g.verdict : '' }));
  const graded = frs.filter(f => f.score != null);
  const mcqPct = pct(right, t.items.length);
  const score = graded.length ? Math.round(mcqPct * 0.7 + graded.reduce((s, f) => s + f.score, 0) / graded.length * 0.3) : mcqPct;
  const missed = [...new Set(t.items.filter((it, k) => t.picks[k] !== it.a).map(it => it.id))];
  t.result = { kind: t.kind, week: t.week, startedAt: t.startedAt, finishedAt: Date.now(), mcq: [right, t.items.length], fr: frs, score, missed };
  setDoc('tests', 't' + t.startedAt, t.result);
  t.frs.forEach(f => { if (f.g) setProg(f.id, { fr: { s: f.g.score, d: today() } }); });
  t.phase = 'done'; render(); window.scrollTo(0, 0);
}

    </div>
    <label class="field">What clicked this week<textarea id="ck-clear" data-in="ck" data-f="clear">${esc(d.clear)}</textarea></label>
    <label class="field">What is still fuzzy<textarea id="ck-fuzzy" data-in="ck" data-f="fuzzy">${esc(d.fuzzy)}</textarea></label>
    <label class="field">People I met or called <span class="muted">Owners, buyers, brokers, lenders, attorneys</span><textarea id="ck-people" data-in="ck" data-f="people">${esc(d.people)}</textarea></label>
    <label class="field">Goals for next week<textarea id="ck-next" data-in="ck" data-f="next">${esc(d.next)}</textarea></label>
    <div class="row"><button class="btn primary" data-act="ckSave" data-w="${w}">Save check-in</button>${sample ? `<button class="btn" data-act="ckCoach" data-w="${w}" ${d.coachBusy ? 'disabled' : ''}>Get Claude’s read on my week</button>` : ''}</div>
  </div>
  <div class="prose" id="ck-coach">${d.coachBusy && !d.coach ? '<p class="thinking">Claude is looking at your week…</p>' : md(d.coach || saved.coach || '')}</div>
  </div>`;
}
function coachPrompt(w) {
  const wk = WEEKS[w - 1], d = CKD[w];
  const secLines = SECTIONS.map(s => { const c = levelCounts(s.ids), ds = drillStats(s.ids); return `${pad(s.n)} ${s.title}: ${c[1] + c[2] + c[3]}/${s.ids.length} read, ${c[2] + c[3]} can explain, quiz ${ds.s ? pct(ds.r, ds.s) + '% of ' + ds.s : 'n/a'}`; }).join('\n');
  const tests = Object.values(S.tests).sort((a, b) => a.finishedAt - b.finishedAt).map(t => `${t.kind === 'final' ? 'Final' : 'Week ' + t.week}: ${t.score}% (missed ${t.missed.map(x => 'Q' + x).join(', ') || 'none'})`).join('\n') || 'none yet';
  const missed = ALL.filter(id => { const x = prog(id).dr; return x && x.s && x.r / x.s < 0.6; }).slice(0, 15).map(id => `Q${id}: ${q(id).t}`).join('\n') || 'none';
  return `You are a study coach for a commercial real estate broker spending 8 weeks mastering the Ventura County, California multifamily market (220 questions across 17 topics). They just finished week ${w}: "${wk.title}". Give a short, direct read on their week: what is going well, the 2-3 specific gaps to close (name question numbers), and a concrete plan for next week (week ${Math.min(w + 1, 8)}: "${WEEKS[Math.min(w, 7)].title}"). Include one market-building action (a call, meeting, or data pull) tied to what they studied. Under 250 words, Markdown bullets, no preamble.

PROGRESS BY TOPIC:
${secLines}

TEST HISTORY:
${tests}

WEAKEST QUIZ ITEMS:
${missed}

THEIR CHECK-IN:
Confidence (1-5): ${wk.sections.map(s => `${SEC[s].title} ${d.conf[s] || '?'}`).join('; ')}
Hours: ${d.hours || '?'}
Clicked: ${d.clear || '-'}
Fuzzy: ${d.fuzzy || '-'}
People met: ${d.people || '-'}
Goals: ${d.next || '-'}`;
}

/* Glossary */
let GQ = '';
function vGlossary() {
  const t = GQ.toLowerCase();
  const items = GLOSSARY.filter(g => !t || (g.term + ' ' + g.def).toLowerCase().includes(t));
  return `<div class="stack-lg">${mhead()}<div class="stack"><span class="eyebrow">${GLOSSARY.length} terms</span><h1>Glossary</h1></div>
  <input type="search" id="gl-text" placeholder="Search terms" value="${esc(GQ)}" data-in="glText" aria-label="Search terms">
  <dl class="gl" id="gl-list">${glList(items)}</dl></div>`;
}
const glList = items => items.length ? items.map(g => `<dt>${esc(g.term)}</dt><dd>${inl(g.def)}${(g.see || []).length ? ` <span class="small muted">See ${g.see.map(n => `<a class="qref mono" href="#q${n}">Q${n}</a>`).join(', ')}</span>` : ''}</dd>`).join('') : '<p class="muted">No terms match.</p>';

/* Setup */
let IMP = null;
function vSetup() {
  const st = settings(); const answered = ALL.filter(hasA).length;
  const low = ALL.filter(id => hasA(id) && q(id).a.confidence === 'low').length;
  const dates = ALL.filter(hasA).map(id => q(id).a.lastVerified).filter(Boolean).sort();
  return `<div class="stack-lg">${mhead()}<div class="stack"><span class="eyebrow">Your plan and your data</span><h1>Setup and backup</h1></div>
  <section class="panel stack"><h2>Plan start date</h2><p class="small muted">Weeks and test dates are counted from this day.</p>
    <div class="row"><input type="date" id="setup-start" value="${esc(st.startDate || today())}" style="max-width:200px"><button class="btn primary" data-act="setStartSetup">Save start date</button></div></section>
  <section class="panel stack"><h2>Where your progress lives</h2>
    <p>${S.mode === 'live' ? 'Every change saves to this page’s private database in your claude.ai account. Open the same link on any device where you are signed in and your progress is there.' : 'This view cannot reach your saved progress. Open the page on claude.ai while signed in.'}</p>
    <p class="small muted">Export a backup now and then. It is a JSON file of every rating, note, test, and check-in.</p>
    <div class="row"><button class="btn" data-act="export" ${downloads ? '' : 'disabled'}>Export backup</button>
      <label class="btn" for="import-file">Import backup</label><input type="file" id="import-file" accept=".json,application/json" data-ch="importFile" hidden></div>
    ${IMP ? `<div class="notice stack"><span>This backup has ${Object.keys(IMP.progress || {}).length} question records, ${Object.keys(IMP.tests || {}).length} tests, and ${Object.keys(IMP.checkins || {}).length} check-ins. Importing replaces matching records here.</span><div class="row"><button class="btn primary sm" data-act="importYes">Import</button><button class="btn sm" data-act="importNo">Cancel</button></div></div>` : ''}
  </section>
  <section class="panel stack"><h2>About the answers</h2>
    <p>${answered} of 220 questions have a drafted answer with sources${dates.length ? `, researched ${esc(dates[0])}${dates[0] !== dates[dates.length - 1] ? ' to ' + esc(dates[dates.length - 1]) : ''}` : ''}. ${low} are marked low confidence; filter for “Needs verifying” in Questions to work through them.</p>
    <p class="small muted">Market figures (rents, cap rates, comps, rates) move. Treat drafts as a starting point and confirm in CoStar, FlexMLS, or with lenders before quoting a client. Your edits in “Your version” take priority when Claude grades you.</p></section>
  <section class="panel stack"><h2>Keyboard</h2><p class="small">Flashcards: <span class="kbd">Space</span> show, <span class="kbd">1</span>–<span class="kbd">4</span> rate. Quiz: <span class="kbd">1</span>–<span class="kbd">4</span> answer, <span class="kbd">Enter</span> next.</p></section>
  </div>`;
}

/* ---------- Router and render ---------- */
const VIEWS = { today: vToday, plan: vPlan, library: vLibrary, review: vReview, quiz: vQuiz, drill: vDrill, tests: vTests, checkins: vCheckins, glossary: vGlossary, setup: vSetup };
function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^q(\d+)$/); if (m) return { name: 'q', id: +m[1] };
  return { name: VIEWS[h] ? h : 'today' };
}
let lastRoute = '';
function render() {
  const r = route(); const key = r.name + (r.id || '');
  const y = key === lastRoute ? window.scrollY : 0;
  $('view').innerHTML = r.name === 'q' ? vQuestion(r.id) : VIEWS[r.name]();
  renderNav(r.name); renderSync();
  if (key === lastRoute) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastRoute = key; deferred = false;
}
let deferred = false, rafPending = false;
function typing() { const a = document.activeElement; return a && $('view').contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'button')); }
function softRender() {
  if (typing()) { deferred = true; return; }
  if (rafPending) return; rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}
document.addEventListener('focusout', () => setTimeout(() => { if (deferred && !typing()) render(); }, 250));
window.addEventListener('hashchange', () => { $('sheet').hidden = true; render(); });

/* ---------- Actions ---------- */
const debounces = {};
const later = (k, fn, ms = 700) => { clearTimeout(debounces[k]); debounces[k] = setTimeout(fn, ms); };
const ACT = {
  menu() { const sh = $('sheet'); sh.hidden = !sh.hidden; if (!sh.hidden) sh.innerHTML = `<nav class="nav">${navHTML(route().name)}</nav>`; },
  setStart() { const v = $('start-date').value || today(); setDoc('meta', 'settings', { ...settings(), startDate: v }); toast('Plan started'); render(); },
  setStartSetup() { const v = $('setup-start').value; if (!v) return; setDoc('meta', 'settings', { ...settings(), startDate: v }); toast('Start date saved'); render(); },
  filterSec(el) { LF.sec = +el.dataset.s; LF.status = 'all'; LF.text = ''; location.hash = 'library'; render(); },
  filterBehind() { LF.sec = 0; LF.status = 'behind'; LF.text = ''; location.hash = 'library'; render(); },
  libClear() { LF.sec = 0; LF.status = 'all'; LF.text = ''; render(); },
  mastery(el) { const id = +el.dataset.id, m = +el.dataset.m; setMastery(id, m); render(); toast(m ? `Marked ${LEVELS[m].toLowerCase()}` : 'Reset to not started'); },
  readNext(el, e) { const id = +el.dataset.id; if (!(prog(id).m >= 1)) setMastery(id, 1); location.hash = el.getAttribute('href').slice(1); },
  verify(el) { const id = +el.dataset.id; setProg(id, { ver: prog(id).ver ? null : today() }); render(); },
  qdrill(el) { const id = +el.dataset.id, k = +el.dataset.k, j = +el.dataset.j; const key = id + ':' + k; if (QD[key] != null) return; QD[key] = j; recordDrill(id, j === q(id).a.drills[k].a); render(); },
  async gradeQ(el) {
    const id = +el.dataset.id; const f = FR[id] || (FR[id] = {});
    if (!f.text || !f.text.trim()) { toast('Write an answer first'); return; }
    f.busy = true; f.err = ''; render();
    try { f.result = await grade(id, f.text); const patch = { fr: { s: f.result.score, d: today() } }; if (f.result.score >= 80 && (prog(id).m || 0) < 2) { patch.m = 2; if (!prog(id).srs) patch.srs = { iv: 0, ef: 2.5, n: 0, lp: 0, due: Date.now() }; if (!prog(id).readAt) patch.readAt = today(); } setProg(id, patch); }
    catch (e) { f.err = sampleErr(e); }
    f.busy = false; render();
  },
  async ask(el) {
    const id = +el.dataset.id; const a = AK[id] || (AK[id] = {});
    if (!a.q || !a.q.trim() || a.busy) return;
    a.busy = true; a.text = ''; render();
    const prompt = `You are an experienced multifamily investment broker in Ventura County, California. A broker studying the market asks a follow-up about one study question. Answer in under 200 words using Markdown bullets where useful. Be specific to Ventura County. If the answer depends on current figures, laws, or rates, say what to verify and where; you cannot browse the web.\n\n${refBlock(id)}\nFOLLOW-UP QUESTION:\n${a.q}`;
    try { const r = await sample(prompt, { cache: false, onText: ({ text }) => { a.text = text; const o = $('ask-out-' + id); if (o) o.innerHTML = md(text); } }); a.text = r.text; }
    catch (e) { a.text = e.text || ''; toast(sampleErr(e) || 'Stopped'); }
    a.busy = false; render();
  },
  rvStart() { RV.queue = dueIds().slice(0, 60); RV.i = 0; RV.shown = false; RV.done = 0; render(); },
  rvCram() { const p = plan(); RV.queue = shuffle(weekIds(p.week).filter(id => prog(id).m >= 1)); if (!RV.queue.length) RV.queue = shuffle(ALL.filter(id => prog(id).m >= 1)).slice(0, 30); RV.i = 0; RV.shown = false; RV.done = 0; render(); },
  rvShow() { RV.shown = true; render(); },
  rate(el) {
    const r = +el.dataset.r, id = RV.queue[RV.i]; const p = prog(id);
    setProg(id, { srs: schedule(p.srs, r) }); RV.done++;
    if (r === 0) RV.queue.push(id);
    RV.i++; RV.shown = false; render();
  },
  qzStart() { QZ.items = buildItems(poolIds(QZ.scope, QZ.sec), QZ.count); QZ.i = 0; QZ.picked = null; QZ.right = 0; render(); },
  qzReset() { QZ.items = null; render(); },
  qzPick(el) { if (QZ.picked != null) return; const it = QZ.items[QZ.i]; QZ.picked = +el.dataset.j; const ok = QZ.picked === it.a; if (ok) QZ.right++; recordDrill(it.id, ok); render(); },
  qzNext() { QZ.i++; QZ.picked = null; render(); },
  drNext() { DR.id = null; DR.text = ''; DR.result = null; DR.err = ''; DR.ref = false; render(); },
  drRef() { DR.ref = !DR.ref; render(); },
  async drGrade() {
    if (!DR.text.trim() || DR.busy) return;
    DR.busy = true; DR.err = ''; render();
    try { DR.result = await grade(DR.id, DR.text); setProg(DR.id, { fr: { s: DR.result.score, d: today() } }); }
    catch (e) { DR.err = sampleErr(e); }
    DR.busy = false; render();
  },
  startTest(el) {
    const kind = el.dataset.kind, w = +el.dataset.w;
    if (TS && TS.phase !== 'done') { location.hash = 'tests'; render(); toast('Finish or quit the test in progress first'); return; }
    TS = buildTest(kind, w);
    if (!TS.items.length) { TS = null; toast('No questions available for this test yet'); return; }
    location.hash = 'tests'; render();
  },
  tsPick(el) { TS.picks[TS.i] = +el.dataset.j; render(); },
  tsPrev() { TS.i = Math.max(0, TS.i - 1); render(); },
  tsNext() { if (TS.i + 1 < TS.items.length) TS.i++; else TS.phase = 'fr'; render(); },
  tsBack() { TS.phase = 'mcq'; TS.i = TS.items.length - 1; render(); },
  tsSubmit() { submitTest(); },
  tsSelf(el) { TS.frs[+el.dataset.k].self = +el.dataset.v; render(); },
  tsFinish() { finishTest(); },
  tsQuit() { TS.quitAsk = true; render(); },
  tsQuitNo() { TS.quitAsk = false; render(); },
  tsQuitYes() { TS = null; render(); },
  tsClose() { TS = null; render(); },
  ckWeek(el) { CKW = +el.dataset.w; if (location.hash !== '#checkins') location.hash = 'checkins'; else render(); },
  ckConf(el) { const w = CKW || plan().week; CKD[w].conf[+el.dataset.s] = +el.dataset.v; CKD[w].dirty = true; render(); },
  ckSave(el) {
    const w = +el.dataset.w, d = CKD[w];
    const body = { conf: d.conf, hours: d.hours, clear: d.clear, fuzzy: d.fuzzy, people: d.people, next: d.next, coach: d.coach || (S.checkins['w' + w] || {}).coach || '', savedAt: Date.now() };
    setDoc('checkins', 'w' + w, body); d.dirty = false; d.savedAt = body.savedAt; bump(); toast('Check-in saved'); render();
  },
  async ckCoach(el) {
    const w = +el.dataset.w, d = CKD[w]; d.coachBusy = true; d.coach = ''; render();
    try {
      const r = await sample(coachPrompt(w), { cache: false, onText: ({ text }) => { d.coach = text; const o = $('ck-coach'); if (o) o.innerHTML = md(text); } });
      d.coach = r.text; const saved = S.checkins['w' + w];
      if (saved) { setDoc('checkins', 'w' + w, { ...saved, coach: r.text }); }
    } catch (e) { d.coach = e.text || ''; toast(sampleErr(e) || 'Stopped'); }
    d.coachBusy = false; render();
  },
  async export() {
    if (!downloads) return;
    const data = JSON.stringify({ app: 'ventura-multifamily-prep', version: 1, exportedAt: new Date().toISOString(), progress: S.progress, tests: S.tests, checkins: S.checkins, meta: S.meta, activity: S.activity }, null, 1);
    try { await downloads.save({ filename: `ventura-study-backup-${today()}.json`, data }); toast('Backup saved'); }
    catch (e) { if (e && e.code !== 'declined') toast('Could not save the file here.'); }
  },
  async importYes() {
    const data = IMP; IMP = null;
    let n = 0;
    for (const coll of ['progress', 'tests', 'checkins', 'meta', 'activity']) {
      for (const [k, v] of Object.entries(data[coll] || {})) { if (v && typeof v === 'object' && /^[\w.~:@+-]+$/.test(k)) { setDoc(coll, k, v); n++; } }
    }
    toast(`Imported ${n} records`); render();
  },
  importNo() { IMP = null; render(); },
};
const IN = {
  libText(el) { LF.text = el.value; later('lib', () => { const ids = libIds(); const groups = SECTIONS.map(s => ({ s, ids: ids.filter(id => q(id).s === s.n) })).filter(g => g.ids.length); $('lib-results').innerHTML = libResults(groups); }, 150); },
  glText(el) { GQ = el.value; const t = GQ.toLowerCase(); $('gl-list').innerHTML = glList(GLOSSARY.filter(g => !t || (g.term + ' ' + g.def).toLowerCase().includes(t))); },
  my(el) { const id = +el.dataset.id; const k = 'q' + id; S.progress[k] = { ...prog(id), my: el.value, u: Date.now() }; dirty.add('progress/' + k); later('my' + id, () => { save('progress/' + k, S.progress[k]); bump(); }); },
  note(el) { const id = +el.dataset.id; const k = 'q' + id; S.progress[k] = { ...prog(id), note: el.value, u: Date.now() }; dirty.add('progress/' + k); later('note' + id, () => { save('progress/' + k, S.progress[k]); bump(); }); },
  fr(el) { const id = +el.dataset.id; (FR[id] || (FR[id] = {})).text = el.value; },
  ask(el) { const id = +el.dataset.id; (AK[id] || (AK[id] = {})).q = el.value; },
  drText(el) { DR.text = el.value; const b = document.querySelector('[data-act="drGrade"]'); if (b) b.disabled = !sample || DR.busy || !DR.text.trim(); },
  tsFr(el) { TS.frs[+el.dataset.k].text = el.value; },
  ck(el) { const w = CKW || plan().week; CKD[w][el.dataset.f] = el.value; CKD[w].dirty = true; },
};
const CH = {
  libSec(el) { LF.sec = +el.value; render(); },
  libStatus(el) { LF.status = el.value; render(); },
  qzScope(el) { QZ.scope = el.value; render(); },
  qzSec(el) { QZ.sec = +el.value; render(); },
  qzCount(el) { QZ.count = +el.value; },
  drScope(el) { DR.scope = el.value; ACT.drNext(); },
  importFile(el) {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (d.app !== 'ventura-multifamily-prep') throw 0; IMP = d; } catch (e) { toast('That file is not a backup from this page.'); } el.value = ''; render(); };
    rd.readAsText(f);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && el.dataset.act && ACT[el.dataset.act]) {
    if (el.tagName === 'A') e.preventDefault();
    ACT[el.dataset.act](el, e); return;
  }
  if (e.target === $('sheet')) $('sheet').hidden = true;
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('keydown', e => {
  if (typing() || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = route().name;
  if (r === 'review' && RV.queue && RV.i < RV.queue.length) {
    if (!RV.shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ACT.rvShow(); }
    else if (RV.shown && /^[1-4]$/.test(e.key)) ACT.rate({ dataset: { r: String(+e.key - 1) } });
  } else if (r === 'quiz' && QZ.items && QZ.i < QZ.items.length) {
    if (QZ.picked == null && /^[1-4]$/.test(e.key) && +e.key <= QZ.items[QZ.i].c.length) ACT.qzPick({ dataset: { j: String(+e.key - 1) } });
    else if (QZ.picked != null && e.key === 'Enter') ACT.qzNext();
  }
});

render();
initCaps();
})();
</script>
