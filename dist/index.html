<title>Ventura Multifamily Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: study-desk app shell. Left rail on desktop, bottom tab bar on phones; one working column of content. */
:root {
  --bg: #eef3f2;
  --surface: #ffffff;
  --surface-2: #e3ebe9;
  --ink: #10252a;
  --ink-2: #4b5f63;
  --ink-3: #75898c;
  --line: #cfdcd9;
  --accent: #0c5a61;
  --accent-ink: #ffffff;
  --accent-soft: #d4e8e7;
  --lemon: #d9a91c;
  --lemon-soft: #f6ead0;
  --good: #23764a;
  --good-soft: #d9efe1;
  --warn: #a8670f;
  --warn-soft: #f6e6cc;
  --bad: #ad3434;
  --bad-soft: #f6dcdc;
  --heat-0: #e3ebe9;
  --heat-1: #a9d0cc;
  --heat-2: #4f9e9a;
  --heat-3: #0c5a61;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1618; --surface: #132124; --surface-2: #1a2c30; --ink: #e1ebe9; --ink-2: #a2b5b6; --ink-3: #75898b;
    --line: #26393d; --accent: #5cbcb6; --accent-ink: #062024; --accent-soft: #163a3c; --lemon: #e7bf4c; --lemon-soft: #3a3118;
    --good: #62c48e; --good-soft: #173528; --warn: #e2a64c; --warn-soft: #3a2b15; --bad: #e57a7a; --bad-soft: #3d1d1d;
    --heat-0: #1a2c30; --heat-1: #1f4f50; --heat-2: #2f8580; --heat-3: #5cbcb6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1618; --surface: #132124; --surface-2: #1a2c30; --ink: #e1ebe9; --ink-2: #a2b5b6; --ink-3: #75898b;
  --line: #26393d; --accent: #5cbcb6; --accent-ink: #062024; --accent-soft: #163a3c; --lemon: #e7bf4c; --lemon-soft: #3a3118;
  --good: #62c48e; --good-soft: #173528; --warn: #e2a64c; --warn-soft: #3a2b15; --bad: #e57a7a; --bad-soft: #3d1d1d;
  --heat-0: #1a2c30; --heat-1: #1f4f50; --heat-2: #2f8580; --heat-3: #5cbcb6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; }
h2 { font-size: 20px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

/* Shell */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; padding-block: 28px; display: flex; flex-direction: column; gap: 22px; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font: 750 19px/1.1 var(--display); letter-spacing: -0.01em; }
.brand span { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--ink); }
.nav .grp { margin-top: 10px; padding: 0 10px 4px; }
.badge { font: 500 11px/1 var(--mono); padding: 4px 6px; border-radius: 999px; background: var(--lemon-soft); color: var(--ink); }
.sync { margin-top: auto; font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; line-height: 1.4; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; margin-top: 4px; }
.dot.live { background: var(--good); }
.dot.busy { background: var(--lemon); }
.dot.off { background: var(--bad); }
.view { padding-block: 32px 80px; min-width: 0; }
.view > .stack-lg { max-width: 860px; }
.tabbar { display: none; }
.mhead { display: none; }
.sheet { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; align-items: flex-end; }
.sheet .nav { background: var(--surface); width: 100%; border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rail { display: none; }
  .view { padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .mhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 14px; }
  .mhead b { font: 750 17px/1.1 var(--display); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); text-decoration: none; background: none; border: 0; border-radius: 8px; }
  .tabbar .on { color: var(--accent); background: var(--accent-soft); }
  .tabbar svg { width: 20px; height: 20px; }
}

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }
label.field > span.muted { font-weight: 400; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.panel.tint { background: var(--accent-soft); border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/1 var(--mono); padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.m1 { background: var(--accent-soft); color: var(--ink); }
.chip.m2 { background: var(--heat-2); color: var(--accent-ink); }
.chip.m3 { background: var(--accent); color: var(--accent-ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 8px 12px; color: var(--ink-2); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a.on { color: var(--ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* Bars and heat */
.bar { display: flex; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .b1 { background: var(--heat-1); }
.bar .b2 { background: var(--heat-2); }
.bar .b3 { background: var(--heat-3); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tide { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.tide .wk { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tide .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.tide .d { aspect-ratio: 1; max-width: 100%; border-radius: 3px; background: var(--heat-0); }
.tide .d.l1 { background: var(--heat-1); } .tide .d.l2 { background: var(--heat-2); } .tide .d.l3 { background: var(--heat-3); }
.tide .d.fut { background: transparent; border: 1px dashed var(--line); }
.tide .d.today { outline: 2px solid var(--lemon); outline-offset: 1px; }
.tide .wk .eyebrow { font-size: 10px; }
.tide .wk.cur .eyebrow { color: var(--ink); }
@media (max-width: 560px) { .tide { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 12px; } }

/* Stats */
.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.stat b { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat.hot b { color: var(--lemon); }
a.stat:hover { border-color: var(--accent); }

/* Lists */
.qlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.qrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 14px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.qrow:first-child { border-top: 0; }
.qrow:hover { background: var(--surface-2); }
.qrow .id { font: 500 13px/1.5 var(--mono); color: var(--accent); }
.qrow .meta { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .qrow { grid-template-columns: 44px minmax(0, 1fr); } .qrow .meta { grid-column: 2; justify-content: flex-start; } }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 6px; }
.secrow { display: grid; grid-template-columns: minmax(0, 1fr) 140px 54px; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.secrow:first-child { border-top: 0; }
.secrow .n { font: 500 12px var(--mono); color: var(--ink-3); margin-right: 6px; }
@media (max-width: 560px) { .secrow { grid-template-columns: minmax(0, 1fr) 80px 44px; font-size: 14px; } }

/* Prose */
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; }
.prose h3, .prose h4 { margin-top: 8px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.prose code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.prose a.qref { font-family: var(--mono); font-size: 13px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface-2); border-top: 0; font-weight: 650; }
.summary { font-size: 17px; line-height: 1.5; padding: 16px 18px; border-radius: var(--radius); background: var(--accent-soft); max-width: 68ch; }
.kp { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.kp li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.kp li::before { content: "▸"; color: var(--accent); font-weight: 700; }
.sources { margin: 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.verify { border-left: 3px solid var(--warn); padding: 10px 14px; background: var(--warn-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.verify.ok { border-left-color: var(--good); background: var(--good-soft); }

/* Practice */
.flash { min-height: 260px; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.flash .qtext { font: 600 21px/1.35 var(--display); text-wrap: pretty; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 10px 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 650; }
.rate button small { font: 400 11px var(--mono); color: var(--ink-2); }
.rate .r0 { border-color: var(--bad); } .rate .r3 { border-color: var(--good); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; text-align: left; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.45; }
.choice .k { font: 500 12px/1.6 var(--mono); color: var(--ink-3); }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.ok { border-color: var(--good); background: var(--good-soft); }
.choice.no { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; color: var(--ink); }
.explain { font-size: 14px; padding: 10px 14px; border-radius: 8px; background: var(--surface-2); }
.client { font: 500 19px/1.4 var(--display); padding: 18px 20px; border-radius: 14px 14px 14px 4px; background: var(--surface); border: 1px solid var(--line); max-width: 60ch; }
.grade { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; align-items: start; }
.score { font: 750 44px/1 var(--display); font-variant-numeric: tabular-nums; }
.score small { font: 500 12px var(--mono); display: block; color: var(--ink-2); margin-top: 6px; letter-spacing: .04em; text-transform: uppercase; }
@media (max-width: 560px) { .grade { grid-template-columns: 1fr; gap: 10px; } }
.progress-line { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.progress-line i { display: block; height: 100%; background: var(--accent); }
.thinking { color: var(--ink-2); font-style: italic; }
.out { white-space: normal; }

/* Weeks */
.week { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.week.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.week .wn { font: 750 40px/1 var(--display); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.week.cur .wn { color: var(--accent); }
@media (max-width: 560px) { .week { grid-template-columns: 1fr; gap: 8px; } .week .wn { font-size: 28px; } }

table.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.hist th, table.hist td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); }
table.hist th { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-top: 0; }

.notice { padding: 12px 14px; border-radius: 9px; background: var(--lemon-soft); font-size: 14px; }
.empty { padding: 28px 20px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); display: flex; flex-direction: column; gap: 12px; align-items: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); }
@media (min-width: 901px) { #toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
.gl dt { font: 650 15px var(--display); }
.gl dd { margin: 2px 0 14px; color: var(--ink); max-width: 68ch; }
.kbd { font: 500 11px var(--mono); padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  .view > * { animation: rise .22s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="brand"><b>Ventura Multifamily</b><span>8-week study plan</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sync" id="sync"><span class="dot"></span><span>Connecting to your saved progress…</span></div>
  </aside>
  <main class="view" id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

t was total dollar volume?","a":null},"67":{"id":67,"s":5,"t":"What were the 10 largest multifamily sales in the last 24 months, and who were the buyers and sellers?","a":null},"68":{"id":68,"s":5,"t":"What are the most relevant recent comps in each city for 5 to 20 unit buildings?","a":null},"69":{"id":69,"s":5,"t":"What's the premium for properties with no deferred maintenance versus value-add product?","a":null},"70":{"id":70,"s":5,"t":"What's the discount for properties with below-market rents and long-term tenants?","a":null},"71":{"id":71,"s":5,"t":"How do pricing and buyer appetite differ between 2 to 4 unit properties (residential financing) and 5+ units (commercial financing)?","a":null},"72":{"id":72,"s":5,"t":"How are off-market deals priced compared to marketed deals?","a":null},"73":{"id":73,"s":5,"t":"What percentage of sales are off-market versus listed on MLS or CoStar/LoopNet?","a":null},"74":{"id":74,"s":5,"t":"What does a realistic 12-month price outlook look like, and what drives it?","a":null},"75":{"id":75,"s":6,"t":"Who are the 20 most active multifamily buyers in the county over the last three years?","a":null},"76":{"id":76,"s":6,"t":"What share of buyers are individuals, families, or small partnerships versus institutions?","a":null},"77":{"id":77,"s":6,"t":"What share of buyers are local versus out of area, and where are out-of-area buyers based?","a":null},"78":{"id":78,"s":6,"t":"How much capital is coming from Los Angeles, and what's pushing it (rent control, Measure ULA transfer tax, pricing)?","a":null},"79":{"id":79,"s":6,"t":"How active are Bay Area, Orange County, and out-of-state buyers?","a":null},"80":{"id":80,"s":6,"t":"Are there international buyers active in the market, and from where?","a":null},"81":{"id":81,"s":6,"t":"Which buyers focus on small (5 to 20 unit) deals, and which only look at 50+ units?","a":null},"82":{"id":82,"s":6,"t":"Which REITs, private equity funds, and institutional owners hold Ventura County multifamily, and are they buying or selling?","a":null},"83":{"id":83,"s":6,"t":"Which family offices and syndicators are active, and what are their return targets?","a":null},"84":{"id":84,"s":6,"t":"Which local investors repeatedly buy in specific cities, and what are their criteria?","a":null},"85":{"id":85,"s":6,"t":"What percentage of buyers are completing 1031 exchanges, and what are they typically exchanging out of?","a":null},"86":{"id":86,"s":6,"t":"What's driving buyers to Ventura County versus Santa Barbara, LA, or out of state?","a":null},"87":{"id":87,"s":6,"t":"Which buyers will take on rent-controlled or tenant-protected properties, and how do they underwrite them?","a":null},"88":{"id":88,"s":6,"t":"Who buys value-add properties versus stabilized properties?","a":null},"89":{"id":89,"s":6,"t":"Who are the affordable housing buyers (nonprofits, housing authorities, LIHTC syndicators), and what do they pay?","a":null},"90":{"id":90,"s":6,"t":"Are there buyers converting multifamily to other uses, or other uses to multifamily?","a":null},"91":{"id":91,"s":6,"t":"What are buyers' current return expectations (cash-on-cash, IRR, equity multiple)?","a":null},"92":{"id":92,"s":6,"t":"How much leverage are buyers using right now, and how many are buying all cash?","a":null},"93":{"id":93,"s":6,"t":"Which buyers can close fastest, and who has a reputation for retrading?","a":null},"94":{"id":94,"s":6,"t":"Which buyers have I personally met, and which do I need to meet?","a":null},"95":{"id":95,"s":7,"t":"Who are the largest multifamily owners in the county by unit count?","a":null},"96":{"id":96,"s":7,"t":"What's the typical hold period for current owners?","a":null},"97":{"id":97,"s":7,"t":"What share of properties are owned by long-term owners (20+ years) with low tax basis?","a":null},"98":{"id":98,"s":7,"t":"How many owners are aging and facing estate or succession decisions?","a":null},"99":{"id":99,"s":7,"t":"Which owners hold properties in trusts, and who are the trustees and heirs?","a":null},"100":{"id":100,"s":7,"t":"What motivates sellers right now (rates, regulation, fatigue, estate planning, loan maturities)?","a":null},"101":{"id":101,"s":7,"t":"Which owners have loans maturing in the next 24 months?","a":null},"102":{"id":102,"s":7,"t":"Which properties are in distress (defaults, code violations, deferred maintenance)?","a":null},"103":{"id":103,"s":7,"t":"Who owns the most units in each city, and how do I reach them?","a":null},"104":{"id":104,"s":7,"t":"What are the typical objections sellers raise right now, and how do I answer each?","a":null},"105":{"id":105,"s":8,"t":"What are current agency (Fannie Mae / Freddie Mac) rates and terms for small balance multifamily?","a":{"summary":"Agency small-loan money is pricing roughly 6.4% to 7.1% on a 10-year fixed as of late October 2026, depending on leverage. That's about 1.5 to 2.2 points over a 10-year Treasury sitting near 5%. Fannie Small covers $1M to $9M. In April 2026 Freddie replaced its SBL program with Conventional Small, which runs $2M to $10M.","answer":"### Where rates are\nGreystone's August 11, 2026 sheet priced **Fannie Mae Small** 10-year fixed loans at spreads of **176–216 bps** at 80% LTV/1.25x, **156–196** at 65%/1.35x and **146–176** at 55%/1.55x. The 10-year Treasury was 4.69% that day. It then climbed to about 5.1–5.2% in mid-October and was **4.96% on Oct. 22, 2026**. The same spreads on today's index work out to roughly:\n\n| Leverage tier | 10-yr fixed, est. late Oct 2026 |\n|---|---|\n| 80% / 1.25x | ~6.7%–7.1% |\n| 65% / 1.35x | ~6.5%–6.9% |\n| 55% / 1.55x | ~6.4%–6.7% |\n\nFreddie small pricing on the same August sheet was similar: **6.40%–7.05%** for a 10-year fixed at 80%. These are estimates. Spreads move weekly, so get a live quote.\n\n### Program terms\n| | Fannie Mae Small | Freddie Optigo Conventional Small |\n|---|---|---|\n| Loan size | $1M–$9M | Generally $2M–$10M |\n| Property | 5+ units | 5–50 units, mostly market-rate |\n| Terms | 5–30 yr fixed | 5, 7, 10, 12, 15 yr |\n| Amortization | 30 yr | 30 yr max |\n| Max LTV / min DSCR | 80% (75% cash-out) / 1.25x | tiers; ~80%/1.25x top tier |\n| Prepay | Yield maintenance or step-down | YM, then 2-yr lockout, then defeasance; step-down costs extra |\n| Recourse | Non-recourse w/ carve-outs | Non-recourse w/ carve-outs |\n\nFreddie's **Conventional Small replaced the Small Balance Loan (SBL) program on April 15, 2026**. Liquidity is not the problem: FHFA set 2026 caps at **$88B per agency**, and workforce-housing loans don't count against them.\n\n### So what\nPrice is driven by size. Fannie's larger *conventional* loans priced about 50 bps tighter on spread than Small loans (10-yr spread 112–142 at 80% on Sept. 1). For most Ventura County 5–40 unit deals, the binding limit is DSCR, not LTV (see Q108).","keyPoints":["Fannie Small: $1M–$9M, 5+ units, up to 80% LTV (75% cash-out), 1.25x min DSCR, non-recourse","Freddie replaced SBL with Optigo Conventional Small on 4/15/2026: generally $2M–$10M, 5–50 units","Aug 11, 2026 Fannie Small 10-yr spread: 176–216 bps at 80%/1.25x over the 10-yr Treasury","10-yr Treasury: 4.69% (Aug 11) to ~4.96% (Oct 22, 2026); implied 10-yr agency small rate ~6.4%–7.1%","FHFA 2026 caps: $88B per agency, workforce housing excluded"],"sources":[{"title":"Greystone - Small Loan Rates (Fannie Mae Small / Freddie Mac small), rates updated 08/11/2026","url":"https://www.greystone.com/wp-content/uploads/2026/08/Small-Rates_2026.08.11.pdf","date":"2026-08"},{"title":"Greystone - Conventional Today's Pricing, rates updated 09/01/2026","url":"https://www.greystone.com/wp-content/uploads/2026/09/Conventional_TodaysPricing_090126.pdf","date":"2026-09"},{"title":"Greystone - Fannie Mae Small Mortgage Loans term sheet","url":"https://www.greystone.com/wp-content/uploads/2024/04/Greystone-Fannie-Mae-Small-Mortgage-Loans-Term-Sheet.pdf","date":"2025-03"},{"title":"Freddie Mac Multifamily - Optigo Conventional Small product sheet","url":"https://mf.freddiemac.com/docs/conventional_small.pdf","date":"2026-04"},{"title":"Freddie Mac - Multifamily announces launch of integrated Conventional Small product","url":"https://freddiemac.gcs-web.com/news-releases/news-release-details/freddie-mac-multifamily-announces-launch-integrated-conventional","date":"2026-04"},{"title":"Fannie Mae - Expands rental supply with nearly $74 billion in 2025 volume (small loan definition footnote)","url":"https://www.fanniemae.com/newsroom/fannie-mae-news/fannie-mae-expands-rental-supply-nearly-74-billion-volume-2025","date":"2026-02"},{"title":"FHFA - 2026 multifamily loan purchase caps for Fannie Mae and Freddie Mac","url":"https://www.fhfa.gov/news/news-release/u.s.-federal-housing-announces-2026-multifamily-loan-purchase-caps-for-fannie-mae-and-freddie-mac","date":"2025-11"},{"title":"CrowdfundedWealth - Treasury par yields, October 22, 2026 (citing U.S. Treasury data)","url":"https://www.crowdfundedwealth.com/articles/treasury-tips-ladder-rungs-after-tax-fdic-cd-limit-2026","date":"2026-10"},{"title":"FRED (St. Louis Fed) - 10-Year Treasury Constant Maturity (DGS10)","url":"https://fred.stlouisfed.org/graph/?g=1q06w","date":"2026-10"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The late-October rates are estimates: August 2026 spreads applied to the Oct. 22 Treasury. Before quoting a client, pull a current sheet from Greystone or another Fannie Small or Freddie Optigo lender, and check the 10-year on FRED (DGS10) or Treasury's daily par yield curve. Ventura County's 'market designation' (standard vs. strong) moves the spread.","drills":[{"q":"Which Freddie Mac product replaced the Small Balance Loan (SBL) program in April 2026?","c":["Targeted Affordable Small","Freddie Mac Bridge Lite","Optigo Conventional Small","Freddie Mac SBL 2.0"],"a":2,"x":"Freddie folded small-balance lending into its core platform as Optigo Conventional Small (generally $2M–$10M) on April 15, 2026."},{"q":"What is the maximum Fannie Mae Small loan amount nationwide?","c":["$10 million","$6 million","$7.5 million","$9 million"],"a":3,"x":"Fannie defines Small Mortgage Loans as $9M or less nationwide. It raised the cap from $6M in 2023."},{"q":"In August 2026, Fannie Small 10-year spreads at 80%/1.25x were 176–216 bps. If the 10-year Treasury is 4.96%, the all-in rate is roughly:","c":["5.7%–6.1%","6.7%–7.1%","7.5%–7.9%","4.96% flat"],"a":1,"x":"4.96% + 1.76% = 6.72% and 4.96% + 2.16% = 7.12%, so about 6.7%–7.1%."}]}},"106":{"id":106,"s":8,"t":"Which local and regional banks lend on multifamily in Ventura County, and what are their terms?","a":{"summary":"I couldn't confirm a deep bench of local banks with posted multifamily terms. The confirmed names are American Riviera Bank, which opened a Ventura lending center in January 2026 and has a 5+ unit multifamily book, and Mechanics Bank, which runs a California multifamily lending group. Expect relationship-driven terms: deposits, often recourse, and lower leverage than agency loans.","answer":"### Who is confirmed active\n- **American Riviera Bank** (Santa Barbara-based). Opened a **Ventura Lending Center at 1280 S. Victoria Ave.** in January 2026, focused on CRE, construction and real estate investors. It later bought the adjacent 1220 S. Victoria property for a full-service branch. Call-report data shows **$89.5M of 5+ unit multifamily loans, 8.2% of its loan book**, as of 3/31/2026. That figure is bank-wide.\n- **Mechanics Bank** (Walnut Creek). Lists multifamily lending and has expanded its multifamily lending team. In December 2025 it agreed to **sell its Fannie Mae DUS business to Fifth Third**, so for agency execution ask Fifth Third. Mechanics itself now lends from its own balance sheet.\n- **Chase** runs a dedicated multifamily lending program and is a long-standing small-apartment lender in California.\n- **Community West Bank** has Ventura County branches and merged with Central Valley Community Bank in April 2024. I found no confirmation of its current multifamily appetite. Call before putting it on a list.\n- **Montecito Bank & Trust**: no evidence found of Ventura County multifamily lending.\n\n### Typical bank terms (verify per lender)\nIndustry sources describe 2026 banks as **selective and relationship-driven**. They compete hard when the sponsor brings deposits. Compared with agency loans, bank loans usually mean:\n- **Recourse** (full or partial) and a **larger down payment**\n- Hybrid fixed periods (often 5–10 years) on 25–30 year amortization\n- Lighter third-party reports, faster close, and more flexible prepayment, often step-downs\n- Pricing at or slightly above agency, with relationship discounts\n\n### So what\nFor a $1M–$3M loan, a local bank or credit union often beats the agencies on cost and speed. Fannie Small starts at $1M, and Freddie's floor is $2M. Keep a short list of lenders you've closed with. Banks change their appetite every quarter.","keyPoints":["American Riviera Bank opened a Ventura Lending Center (1280 S. Victoria Ave.) in January 2026","ARB had $89.5M in 5+ unit multifamily loans (8.2% of loans) at 3/31/2026","Mechanics Bank sold its Fannie DUS business line to Fifth Third (announced Dec 2025)","Banks in 2026 are selective and relationship-driven: expect deposits, recourse and lower leverage than agency"],"sources":[{"title":"American Riviera Bank - Expands with Ventura Lending Center","url":"https://americanriviera.bank/blog/american-riviera-bank-expands-with-ventura-lending-center","date":"2025-12"},{"title":"Visbanking - American Riviera Bank call report loan mix (Q1 2026)","url":"https://visbanking.com/call-report/american-riviera-bank-reports-3388482/loans","date":"2026-03"},{"title":"Stock Titan - Mechanics Bank agrees to sell Fannie Mae DUS business to Fifth Third","url":"https://www.stocktitan.net/news/FITB/mechanics-bank-agrees-to-sell-fannie-mae-delegated-underwriting-and-bbnkz7vmtfuz.html","date":"2025-12"},{"title":"RE Capital News - Mechanics Bank hires five to boost California multifamily business","url":"https://recapitalnews.com/norcal-mechanics-bank-snags-top-notch-lenders-aims-for-regional-multifamily","date":""},{"title":"Chase - Multifamily lending","url":"https://www.chase.com/mfl","date":""},{"title":"Business Wire - Central Valley Community Bancorp and Community West Bancshares to merge","url":"https://www.businesswire.com/news/home/20231010680330/en/Central-Valley-Community-Bancorp-and-Community-West-Bancshares-to-Merge","date":"2023-10"},{"title":"ConnectCRE - 2026 Multifamily Capital Markets Map: Where Liquidity Is and Isn't Flowing","url":"https://www.connectcre.com/stories/2026-multifamily-capital-markets-map-where-liquidity-is-and-isnt-flowing/","date":"2026-01"},{"title":"Multifamily.loans - Multifamily loans in Ventura, California (lender-type guide)","url":"https://www.multifamily.loans/guides/california/ventura/","date":""}],"lastVerified":"2026-10-27","confidence":"low","verify":"I found no posted multifamily rate sheets for local banks. Call American Riviera Bank's Ventura lending center, Mechanics Bank, Community West Bank, Montecito Bank & Trust and Chase Multifamily for current 5+ unit terms: max LTV, DSCR, fixed periods, recourse, prepay and deposit requirements. Also check the FDIC call-report loan mix for any bank you're vetting.","drills":[{"q":"Where did American Riviera Bank open its first Ventura County lending center in early 2026?","c":["S. Victoria Ave., Ventura","Thousand Oaks Blvd.","Main St., Santa Paula","Oxnard Blvd., Oxnard"],"a":0,"x":"The lending center is at 1280 S. Victoria Avenue in Ventura. The bank later bought the adjacent 1220 S. Victoria property for a branch."},{"q":"Compared with agency loans, bank multifamily loans typically involve:","c":["Mandatory 40-year amortization","Non-recourse and higher leverage","Recourse and a larger down payment","No prepayment flexibility at all"],"a":2,"x":"Lender guides note that bank and credit union loans often require recourse and a larger down payment than agency loans."}]}},"107":{"id":107,"s":8,"t":"Which credit unions are active multifamily lenders?","a":{"summary":"CU SoCal is the clearest confirmed credit union lender. It finances multifamily apartment buildings across Southern California, with up to 30-year amortization and interest-only options. Logix FCU also lists multifamily. Watch the geography, though: Orange County's CU, for example, only lends in OC, LA, Riverside and San Bernardino counties.","answer":"### Confirmed active\n- **CU SoCal (Credit Union of Southern California).** Its investment-property page lists **multifamily apartment buildings**, 2–4 unit properties, mixed-use and other CRE in Southern California. Terms: **up to 30-year amortization, up to 15-year term**, interest-only on multifamily, no points, funding in as little as **45 days**. Its posted rates (effective 10/27/2026) were **5/1 ARM 4.85% APR, 7/1 ARM 4.99%, 10-year fixed 5.125%**. Those sit below where agency debt prices, so expect relationship, leverage or credit conditions. Confirm before you quote them.\n- **Logix FCU** (Burbank area). Its CRE program lists **multifamily** among eligible property types and advertises up to **70% financing** on investment CRE. 1–4 unit investor loans run through its mortgage side.\n\n### Check geography first\n**Orange County's Credit Union** runs a defined 5+ unit program: **$500K–$7.5M, 1.20–1.25x DSCR, 680 FICO, full recourse, no prepayment penalty**. It is **limited to Orange, LA, Riverside and San Bernardino counties**, so it doesn't reach Ventura. Many CUs work this way, which is why you should always ask \"do you lend in Ventura County?\"\n\n**Ventura County Credit Union** is a licensed local CU (Ventura). I found no published 5+ unit multifamily program, so call before listing it.\n\n### How CU loans differ\n- Usually **portfolio loans**: recourse, shorter fixed periods, and often light or no prepayment penalties\n- Business lending is limited by regulatory caps, so large loans may be shared as participations\n- Fast, simple execution for $500K–$5M loans. That makes CUs a good fit for 5–20 unit Ventura buildings and for 2–4 unit blanket loans\n\n### So what\nFor a seller with a small building and a buyer who wants flexibility, such as no prepay penalty or interest-only, a CU quote is worth getting next to the Fannie Small quote.","keyPoints":["CU SoCal finances multifamily in SoCal: up to 30-yr amortization, up to 15-yr term, IO available, ~45-day funding","CU SoCal posted (10/27/2026): 5/1 ARM 4.85% APR, 7/1 4.99%, 10-yr fixed 5.125%; verify conditions","Logix FCU lists multifamily in its CRE program, up to 70% financing","Orange County's CU 5+ program ($500K–$7.5M, 1.20–1.25x, full recourse, no prepay) excludes Ventura County","CU loans are typically portfolio, recourse loans with flexible or no prepayment penalties"],"sources":[{"title":"CU SoCal - Investment property loans (posted rates effective 10/27/2026)","url":"https://www.cusocal.org/loans/investment-property-loans/","date":"2026-10"},{"title":"Logix Federal Credit Union - Commercial real estate loans","url":"https://www.logixbanking.com/business/commercial-real-estate","date":""},{"title":"Orange County's Credit Union - Multifamily financing","url":"https://prod.orangecountyscu.org/products/business-services/commercial-real-estate-lending/Multifamily-Financing","date":""},{"title":"California DFPI - Ventura County Credit Union license record","url":"https://dfpi.ca.gov/regulated_entity/ventura-county-credit-union/","date":""},{"title":"Multifamily.loans - Multifamily loans in Ventura, California (lender-type guide)","url":"https://www.multifamily.loans/guides/california/ventura/","date":""}],"lastVerified":"2026-10-27","confidence":"medium","verify":"CU SoCal's posted rates are below agency pricing and below the 5-year Treasury (4.78% on Oct 22), which looks odd. Call CU SoCal commercial lending to confirm LTV, loan size, prepay, membership and deposit requirements, and that it lends in Ventura County. Ask Ventura County CU and Logix whether they do 5+ unit loans in Ventura County.","drills":[{"q":"Why can't a Ventura County apartment owner use Orange County's Credit Union multifamily program?","c":["It only does owner-occupied loans","It requires 1.75x DSCR","Its minimum loan is $10 million","It only lends in Orange, LA, Riverside and San Bernardino counties"],"a":3,"x":"OCCU's multifamily page limits eligible properties to Orange, Los Angeles, Riverside and San Bernardino counties."},{"q":"Which feature is CU SoCal's investment property program advertised to offer on multifamily loans?","c":["90% LTV","Interest-only periods","Non-recourse with defeasance","40-year fixed rate"],"a":1,"x":"CU SoCal says interest-only periods are available on its Multifamily and 1–4 Unit Blanket loans."}]}},"108":{"id":108,"s":8,"t":"What are typical LTVs and DSCR requirements right now?","a":{"summary":"On paper the agencies go to 80% LTV at 1.25x DSCR. In Ventura County, cap rates sit below loan rates, so DSCR limits the loan first and most buyers end up at roughly 50% to 60% LTV. Banks and credit unions typically want 1.20x to 1.25x and 60% to 70% leverage.","answer":"### Headline limits (2026)\n| Lender type | Max LTV | Min DSCR |\n|---|---|---|\n| Fannie Small | 80% (75% cash-out) | 1.25x |\n| Freddie Conventional Small | tiered (80%/1.25x top tier on lender grids) | 1.25x+ |\n| Freddie Conventional (large) | 65%/1.25x, 60%/1.30x, 55%/1.35x tiers | |\n| Banks / CUs | ~60%–75% | 1.20x–1.25x (e.g., OCCU) |\n| DSCR loans (1–4 units) | ~70%–75% | ~1.0x; 1.20x+ prices better |\n\nLender grids also price by tier. On Greystone's August 2026 small sheet, dropping from **80%/1.25x to 55%/1.55x** cut the rate by about **30 bps**.\n\n### Why DSCR limits the loan before LTV\nMax LTV under a DSCR test = cap rate ÷ (DSCR × loan constant).\n\nAt a **5.25% cap**, **6.75% rate** and 30-year amortization (loan constant **7.78%**), a 1.25x test gives:\n\n5.25 ÷ (1.25 × 7.78) = **about 54% LTV**\n\nSo the \"80% loan\" turns into a 54% loan. The buyer brings about 46% equity, or negotiates price. Interest-only periods and lower-leverage pricing tiers help a little.\n\nLenders also use **their own underwritten NOI**, not the broker's pro forma: in-place rents (Q109), a vacancy factor, actual insurance quotes (Q111), and replacement reserves. Underwritten NOI is often several percent below the seller's number.\n\n### So what\n- Ask for a lender sizing early. Make the OM's NOI match how a lender will underwrite it.\n- Buyers needing high leverage (1031 replacement debt, thin equity) may need a bank with recourse, seller carry (Q113) or mezzanine debt.\n- A cap rate below the loan rate is **negative leverage**: each dollar of debt lowers the cash-on-cash return.","keyPoints":["Agency small: 80% max LTV (75% cash-out), 1.25x min DSCR","Max LTV under DSCR = cap rate ÷ (DSCR × loan constant)","5.25% cap, 6.75% rate, 30-yr amortization (7.78% constant), 1.25x: about 54% LTV","Lenders size on underwritten in-place NOI with vacancy, actual insurance and reserves","Banks/CUs commonly 1.20x–1.25x DSCR"],"sources":[{"title":"Greystone - Small Loan Rates (Fannie Mae Small / Freddie Mac small), rates updated 08/11/2026","url":"https://www.greystone.com/wp-content/uploads/2026/08/Small-Rates_2026.08.11.pdf","date":"2026-08"},{"title":"Greystone - Fannie Mae Small Mortgage Loans term sheet","url":"https://www.greystone.com/wp-content/uploads/2024/04/Greystone-Fannie-Mae-Small-Mortgage-Loans-Term-Sheet.pdf","date":"2025-03"},{"title":"Greystone - Conventional Today's Pricing, rates updated 09/01/2026","url":"https://www.greystone.com/wp-content/uploads/2026/09/Conventional_TodaysPricing_090126.pdf","date":"2026-09"},{"title":"Orange County's Credit Union - Multifamily financing","url":"https://prod.orangecountyscu.org/products/business-services/commercial-real-estate-lending/Multifamily-Financing","date":""},{"title":"Mortgage-Info - DSCR loan requirements 2026 (verified against published lender guidelines)","url":"https://mortgage-info.com/blog/dscr-loan-requirements-2026-real-estate-investor-guide","date":"2026-05"},{"title":"ConnectCRE - 2026 Multifamily Capital Markets Map: Where Liquidity Is and Isn't Flowing","url":"https://www.connectcre.com/stories/2026-multifamily-capital-markets-map-where-liquidity-is-and-isnt-flowing/","date":"2026-01"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Ventura County cap rates move. Check current comps (see Section 5) and redo the DSCR math with a live loan quote. Confirm each bank's max LTV and DSCR directly.","drills":[{"q":"A building trades at a 5.25% cap. The loan rate is 6.75% on a 30-year amortization (7.78% constant) and the lender requires 1.25x. Roughly what LTV can the buyer get?","c":["54%","40%","80%","70%"],"a":0,"x":"5.25 ÷ (1.25 × 7.78) ≈ 0.54, so about 54%. DSCR caps the loan before the 80% LTV limit is reached."},{"q":"What is the Fannie Mae Small maximum LTV on a cash-out refinance?","c":["90%","65%","75%","80%"],"a":2,"x":"The term sheet shows 75% max LTV for cash-out refis and up to 80% for qualifying loans, including acquisitions."},{"q":"A cap rate below the mortgage rate is called:","c":["Yield maintenance","Defeasance","Positive leverage","Negative leverage"],"a":3,"x":"When the debt costs more than the property yields, adding leverage lowers the cash-on-cash return. That is negative leverage."}]}},"109":{"id":109,"s":8,"t":"Which lenders will finance properties with below-market rents or rent restrictions?","a":{"summary":"Nearly every lender will finance buildings with below-market or restricted rents, but they size the loan on in-place rents, not on rents you hope to reach. For deed-restricted or affordable properties, agency affordable programs and FHA often give the best terms, and some reach 90% LTV on LIHTC deals.","answer":"### The core rule\nLenders **underwrite current in-place rental income**, with no trending or credit for future rent bumps. That matters a lot in Ventura County:\n- **AB 1482** caps most covered units at 5% + CPI, max 10% a year.\n- **Oxnard's rent stabilization ordinance** (adopted 2022) caps many annual increases at **4%** and **sunsets 12/31/2030**.\n- Long-term tenants in older buildings are often 20%–40% under market.\n\nSo a building with low in-place rents gets a smaller loan, whatever the upside.\n\n### Who to call, by situation\n| Situation | Best fit |\n|---|---|\n| Stabilized, rents under market, no recorded restrictions | Fannie Small / Freddie Conventional Small, banks, CUs, all sized on in-place NOI |\n| Value-add, heavy turnover planned | Bank or CU (recourse) or debt-fund bridge; sized on in-place, with the business plan judged on how fast rents can legally reset |\n| Recorded affordability (LIHTC, regulatory agreement) | Fannie/Freddie affordable and preservation executions, FHA 223(f) |\n| Section 8 HAP contract | Fannie or FHA. *Freddie Conventional Small lists HAP contracts as ineligible* |\n\n### Affordable pricing (Greystone, Aug 11, 2026; loans over $6M–$10M)\n- Fannie **Preservation** 10-yr: about **6.03%**, 80% LTV, **1.20x**\n- Fannie/Freddie **9% LIHTC**: about 6.3%–6.5%, up to **90% LTV, 1.15x**, up to 40-yr amortization\n- **FHA 223(f)**: 5.75%–6.22% net of MIP (over $7.5M)\n\nThe agencies have a policy reason to like these deals. FHFA requires **at least 50%** of agency multifamily volume to be mission-driven, and **workforce-housing loans are excluded from the 2026 caps**.\n\n### So what\nFor a seller with a rent-controlled building, the buyer's loan, and so the price, depends on **current rents**. Show a rent roll that makes clear which units are at market and how fast units turn over. For restricted or affordable assets, steer buyers to an affordable specialist, not a generalist bank.","keyPoints":["Lenders size on in-place rents, not projected rent increases","Oxnard RSO caps many increases at 4% and sunsets 12/31/2030; AB 1482 caps at 5% + CPI (max 10%)","Fannie Preservation 10-yr was about 6.03% at 80%/1.20x (Aug 2026); 9% LIHTC up to 90% LTV/1.15x","Freddie Conventional Small treats HAP contracts as ineligible","FHFA: at least 50% of agency volume must be mission-driven; workforce housing excluded from 2026 caps"],"sources":[{"title":"Oregon Legislature - public testimony (lender: underwrite to in-place rents)","url":"https://apps.oregonlegislature.gov/liz/2025R1/Downloads/PublicTestimonyDocument/121231","date":"2025"},{"title":"City of Oxnard - Rent Stabilization and Tenant Protections","url":"https://www.oxnard.gov/?p=641","date":""},{"title":"Greystone - Affordable Rates, updated 08/11/2026","url":"https://www.greystone.com/wp-content/uploads/2026/08/Affordable-Rates_2026.08.11.pdf","date":"2026-08"},{"title":"Freddie Mac Multifamily - Optigo Conventional Small product sheet","url":"https://mf.freddiemac.com/docs/conventional_small.pdf","date":"2026-04"},{"title":"FHFA - 2026 multifamily loan purchase caps for Fannie Mae and Freddie Mac","url":"https://www.fhfa.gov/news/news-release/u.s.-federal-housing-announces-2026-multifamily-loan-purchase-caps-for-fannie-mae-and-freddie-mac","date":"2025-11"},{"title":"Greystone - Small Loan Rates (Fannie Mae Small / Freddie Mac small), rates updated 08/11/2026","url":"https://www.greystone.com/wp-content/uploads/2026/08/Small-Rates_2026.08.11.pdf","date":"2026-08"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Before advising on a specific property, confirm the current terms of Oxnard's RSO and any other local ordinances (see Section 10). The affordable pricing is for larger loans (over $6M at Fannie, $10M+ at Freddie), so ask an affordable lender about small-balance affordable options.","drills":[{"q":"How do most lenders treat a building whose rents are 30% below market?","c":["They underwrite to market rents","They underwrite to in-place rents","They refuse to lend","They average in-place and market rents"],"a":1,"x":"Lenders underwrite current in-place income without trending or relying on future rents."},{"q":"Which agency program lists Section 8 HAP-contract properties as ineligible?","c":["Freddie Mac Conventional Small","Fannie Mae Preservation","Fannie Mae Small","FHA 223(f)"],"a":0,"x":"Freddie's Conventional Small product sheet lists HAP contracts among its ineligible characteristics."},{"q":"When does Oxnard's rent stabilization ordinance sunset?","c":["12/31/2026","12/31/2028","12/31/2030","It has no sunset"],"a":2,"x":"Oxnard's rent stabilization and just-cause ordinances both sunset on 12/31/2030."}]}},"110":{"id":110,"s":8,"t":"Are life insurance companies or debt funds active here?","a":{"summary":"Both are active in California multifamily, but they rarely play in Ventura County's typical small-building deal. Life companies want large, stabilized, low-leverage assets. Debt funds, with 275+ platforms in 2026, fill the transitional and value-add niche at higher cost.","answer":"### Life insurance companies\n- In 2026 they are **highly selective but active**, with allocations aimed at **high-quality, stabilized multifamily**, durable cash flow and **conservative leverage**.\n- Some are shifting toward **shorter-duration** loans to match their annuity business.\n- California example: in **July 2026** Slatt Capital placed a life-company loan with **PPM America** on a Novato apartment refinance: **10-year term, 30-year amortization**.\n- **Ventura County fit**: the newer, larger, institutional apartment communities in Thousand Oaks, Camarillo, Oxnard, Simi Valley and Ventura that trade to institutions. They are rarely a fit for a 1960s 12-unit building.\n\n### Debt funds and bridge lenders\n- Over **275 active platforms**. They are the main source of **transitional** money: lease-ups, value-add, recapitalizations and loans bought from other lenders.\n- They underwrite **downside protection and basis**, not aggressive rent growth. Floating rates and higher spreads than agency are typical.\n- **Bridge-to-bridge** refinancing is now common.\n- **Ventura County fit**: value-add repositions, buildings with high vacancy or deferred maintenance that agencies won't take yet, and short-fuse deals such as a 1031 buyer who must close fast.\n\n### Others in the mix\n- **CMBS** issuance rose 21% in 2025 to **$125.6B**. Good for stabilized, older-vintage assets, but underwriting is rigid and prepayment is inflexible.\n- **Banks** and **agencies** still carry most small multifamily volume (Q105–Q107).\n\n### So what\nFor a typical **5–50 unit** Ventura County listing, plan on agency, bank or CU financing. Bring in a debt-fund quote when the buyer's plan needs speed or a renovation budget. Bring in life-company money for larger, newer, low-leverage deals, where it can offer the lowest rate.","keyPoints":["Life companies: selective, stabilized assets, conservative leverage; example 10-yr/30-yr amortization loan in Novato (July 2026)","Debt funds: 275+ platforms; the main source of transitional and value-add capital","CMBS issuance rose 21% in 2025 to $125.6B","Typical Ventura County 5–50 unit deals go agency, bank or CU, not life company"],"sources":[{"title":"ConnectCRE - 2026 Multifamily Capital Markets Map: Where Liquidity Is and Isn't Flowing","url":"https://www.connectcre.com/stories/2026-multifamily-capital-markets-map-where-liquidity-is-and-isnt-flowing/","date":"2026-01"},{"title":"ApartmentBuildings.com - Slatt Capital arranges life company loan for Novato multifamily","url":"https://www.apartmentbuildings.com/?p=1569244","date":"2026-07"},{"title":"REBusiness - InterFace: Multifamily finance pros on where capital providers are placing bets in 2026","url":"https://rebusinessonline.com/interface-multifamily-finance-pros-explain-where-capital-providers-are-placing-their-bets-in-2026/","date":"2026"}],"lastVerified":"2026-10-27","confidence":"low","verify":"I found no Ventura County-specific life-company or debt-fund loan data. Ask two or three Southern California mortgage brokers which life companies (and minimum loan sizes) and which bridge lenders have closed Ventura County multifamily in 2025–2026. CoStar or county-recorder deed-of-trust searches can show the lender on recent sales.","drills":[{"q":"Which lender type is described as the main source of transitional capital for lease-ups and value-add in 2026?","c":["Fannie Mae Small","Credit unions","Life insurance companies","Debt funds"],"a":3,"x":"ConnectCRE's 2026 map says debt funds (275+ platforms) are the primary source of transitional capital."},{"q":"Life company lenders generally favor:","c":["High-leverage value-add deals","Stabilized assets at conservative leverage","Ground-up construction in fire zones","Loans under $1 million"],"a":1,"x":"Life companies are selective and favor high-quality, stabilized assets at conservative leverage."}]}},"111":{"id":111,"s":8,"t":"How do lenders treat properties in fire zones or with insurance challenges?","a":{"summary":"Lenders still lend in fire zones, but the loan is sized on the actual insurance premium, so a premium spike cuts DSCR and loan proceeds. They need coverage that meets their replacement-cost and carrier standards, often a California FAIR Plan fire policy plus a DIC wrap. Insurance quotes have become a gating item in due diligence.","answer":"### What lenders require\n- **Hazard coverage at replacement cost** (or at least the loan amount) from acceptable carriers, plus the lender's limits on deductibles.\n- When standard carriers decline, the common fix is a **California FAIR Plan fire-only policy plus a Difference-in-Conditions (DIC) wrap** for the other perils. Lenders generally accept this if the FAIR Plan limit meets their replacement-cost or loan-amount test. Some lenders have stricter overlays for extreme-risk properties.\n- Agency multifamily loans follow detailed insurance chapters in the Fannie and Freddie guides. Check them for deductibles and seismic rules on specific deals.\n\n### How insurance hits underwriting\nInsurance is an operating expense, so **every premium dollar comes off NOI and loan proceeds**.\n- One broker-newsletter example (not a lender policy): premiums went from **$1,900 to $4,900** and **DSCR fell from 1.17 to 1.06**.\n- Some lenders **stress premiums by about +20%**.\n- The FAIR Plan has grown fast: residential policies up **151% since Sept 2022**, exposure up **234% to about $700B** (July 2026). Carriers have pulled back in wildfire areas, and owners shouldn't treat the FAIR Plan as a long-term fix.\n\n### Ventura County context\nFoothill and wildland-urban interface areas carry the most risk: Ojai, parts of Ventura's hillsides, Santa Paula, Fillmore, Camarillo/Somis, Thousand Oaks, Simi Valley and Moorpark. The 2017 Thomas Fire and the 2024 Mountain Fire near Camarillo are why buyers ask.\n\n### So what\n- **Before listing**, get the current policy, the premium history and a fresh quote. Put the actual number in the OM.\n- A buyer's lender will use a real quote. A surprise premium late in escrow can shrink the loan by a large amount and blow up the deal.\n- Hardening work, such as defensible space, Class A roofing and ember-resistant vents, can widen the carrier market.","keyPoints":["Lenders need replacement-cost coverage from acceptable carriers; FAIR Plan fire-only plus a DIC wrap is a common accepted structure","Insurance comes straight off NOI, so a premium spike shrinks the loan","Example: premium $1,900 to $4,900 cut DSCR from 1.17 to 1.06; some lenders stress premiums +20%","FAIR Plan exposure up 234% to about $700B; residential policies up 151% since Sept 2022 (July 2026)"],"sources":[{"title":"Latent Insure - California homeowners, mortgages and wildfire zones (FAIR Plan + DIC)","url":"https://www.latentinsure.com/blog/california-homeowners-mortgage-wildfire-zone","date":""},{"title":"LoanFunders newsletter - Insurance shock waves and DSCR underwriting","url":"https://loanfunders.beehiiv.com/p/insurance-shock-waves-how-florida-california-premium-spikes-impact-dscr-underwriting-e710","date":""},{"title":"The Norris Group - California real estate update: FAIR Plan wildfire exposure hits $700 billion","url":"https://www.thenorrisgroup.com/post/fair-plan-wildfire-exposure-hits-700-billion","date":"2026-07"},{"title":"Multi-Housing News - Safeguarding multifamily amid California's catastrophic weather","url":"https://www.multihousingnews.com/safeguarding-multifamily-housing-amid-californias-catastrophic-weather/","date":""},{"title":"Scotsman Guide - Wildfire risk an escalating crisis for lenders","url":"https://www.scotsmanguide.com/news/wildfire-risk-an-escalating-crisis-for-lenders/","date":""}],"lastVerified":"2026-10-27","confidence":"medium","verify":"I did not find multifamily-specific Fannie or Freddie text on FAIR Plan or wildfire acceptance. Check the current Fannie Mae Multifamily Guide (property insurance chapter) and Freddie Seller/Servicer Guide, or ask the lender's insurance reviewer. Also confirm seismic or earthquake insurance triggers, and use CAL FIRE Fire Hazard Severity Zone maps for any specific property.","drills":[{"q":"Which structure do lenders commonly accept when standard carriers decline a fire-zone property?","c":["California FAIR Plan fire policy plus a DIC wrap","Self-insurance by the borrower","Flood insurance only","Earthquake-only policy"],"a":0,"x":"A FAIR Plan fire-only policy combined with a Difference-in-Conditions wrap is generally accepted if the limits meet lender requirements."},{"q":"Why does a late-escrow insurance quote spike threaten a deal?","c":["It voids the 1031 exchange","It changes the cap rate the county uses for property tax","It lowers NOI, which lowers DSCR and the maximum loan","It triggers yield maintenance"],"a":2,"x":"Insurance is an operating expense, so a higher premium lowers underwritten NOI and the DSCR-limited loan."}]}},"112":{"id":112,"s":8,"t":"What do 2 to 4 unit buyers face with residential financing (DTI, rate, down payment)?","a":{"summary":"2–4 unit buyers use residential financing. In Ventura County the 2026 conforming limits run up to $1,990,450 for a fourplex. Investors need about 25% down for conventional loans, 25% to 30% for DSCR loans, and pay rates in the 6s to 7s. Owner-occupants can put far less down, but must qualify on DTI with only part of the rents counted.","answer":"### Loan limits (Ventura County, 2026 conforming)\n| Units | Limit |\n|---|---|\n| 1 | $1,035,000 |\n| 2 | $1,325,000 |\n| 3 | $1,601,600 |\n| 4 | $1,990,450 |\n\nLoans above these limits are jumbo or portfolio loans.\n\n### Rates (late Oct 2026)\n- Freddie Mac's PMMS 30-year fixed averaged **7.32% on Oct. 22, 2026** (7.40% the week before; 6.19% a year earlier). That is the owner-occupied benchmark. Investment properties price higher.\n- **DSCR loans** (qualify on the property, not personal income): roughly **6.1%–7.75%** in mid-to-late 2026 lender grids. 2–4 units cost an extra 0.125–0.375 points.\n\n### Down payment and qualifying\n| Buyer | Typical down payment | Qualifying |\n|---|---|---|\n| Owner-occupant, conventional or FHA | low down payment options exist for 2–4 unit primary residences | Personal DTI; lenders count only part of the rents |\n| Investor, conventional | **~25% minimum** | Personal DTI and reserves |\n| Investor, DSCR loan | **~25%–30%** for 2–4 units | Property DSCR ~1.0x+; 1.20–1.25x prices better; credit floor ~620–680 |\n\n### The math problem\nA **$1.6M fourplex**, 25% down, **$1.2M loan at 7.5%** = about **$8,390/month** principal and interest. Add about $1,470/month of property tax at ~1.1%, plus insurance and repairs. Ventura County fourplex rents often don't cover that, so DSCR loans fall short and conventional loans lean on the borrower's income.\n\n### So what\nThe 2–4 unit market is driven by **owner-users** (house hacking with low down payments), **1031 buyers with big equity**, and **cash buyers**. When pricing a fourplex, figure out which of those buyers you're targeting. A pure investor using a DSCR loan at 7%+ usually can't pay a cap rate in the 4s.","keyPoints":["2026 Ventura County conforming limits: $1,035,000 (1 unit), $1,325,000 (2), $1,601,600 (3), $1,990,450 (4)","Freddie PMMS 30-yr fixed: 7.32% on Oct 22, 2026","Investor conventional 2–4 units: about 25% down; DSCR loans: 25%–30% down, rates ~6.1%–7.75%","$1.2M at 7.5% over 30 years = about $8,390/month P&I"],"sources":[{"title":"Community First Mortgage - Ventura County conforming loan limits 2026","url":"https://communityfirstmortgage.com/ventura-county-conforming-loan-limits-2026/","date":"2025-11"},{"title":"Freddie Mac - Primary Mortgage Market Survey","url":"https://www.freddiemac.com/pmms?intcmp=CWS-HP","date":"2026-10"},{"title":"Mortgage-Info - DSCR loan requirements 2026 (verified against published lender guidelines)","url":"https://mortgage-info.com/blog/dscr-loan-requirements-2026-real-estate-investor-guide","date":"2026-05"},{"title":"Ridge Street Capital - DSCR loan rates (2026 guide)","url":"https://ridgestreetcap.com/blog/dscr-loan-rates","date":"2026"},{"title":"Logix Federal Credit Union - Investment property (1-4 unit) mortgages","url":"https://www.logixbanking.com/loans/mortgages/investment-properties","date":""}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Before advising buyers, confirm current owner-occupied 2–4 unit minimum down payments (Fannie/Freddie selling guides, FHA), the share of rents counted for qualifying, and max DTI. Confirm the 2026 Ventura County limits on FHFA's conforming loan limit map. Get live investor and DSCR quotes; the figures above are lender-blog ranges.","drills":[{"q":"What is the 2026 conforming loan limit for a 4-unit property in Ventura County?","c":["$1,035,000","$1,325,000","$1,601,600","$1,990,450"],"a":3,"x":"The 2026 Ventura County limit for 4 units is $1,990,450."},{"q":"What is the typical minimum down payment for an investor buying a 2–4 unit property with a conventional loan?","c":["10%","25%","50%","3.5%"],"a":1,"x":"Conventional investor loans on 2–4 units commonly require about 25% down."},{"q":"What did Freddie Mac's PMMS 30-year fixed average on Oct. 22, 2026?","c":["7.32%","8.10%","6.19%","6.75%"],"a":0,"x":"PMMS showed 7.32% on Oct. 22, 2026, down from 7.40% the prior week. A year earlier it was 6.19%."}]}},"113":{"id":113,"s":8,"t":"How common is seller financing right now?","a":{"summary":"Seller financing is still a minority tool, but it is used more when rates are high and the seller owns free and clear, which describes many long-time Ventura County owners. It works best on small buildings: the seller earns interest and spreads the gain over time, and the buyer gets financing that banks won't match.","answer":"### Where it shows up\n- **Free-and-clear, long-held** small buildings (2–20 units), where the owner wants income more than cash today\n- Deals where **DSCR limits the bank loan** (Q108) and the buyer needs a **seller second** to fill the gap. Agency loans generally **don't allow hard subordinate debt**, so seller seconds pair with bank or CU loans, if the lender allows them\n- Buildings that are hard to finance: deferred maintenance, fire-zone insurance problems, unpermitted units, or low in-place rents\n\n### Typical structures (negotiated; not standardized)\n- Meaningful buyer down payment (often 20%–35%) so the buyer has real money at risk\n- Interest-only or 25–30 year amortization with a **5–10 year balloon**\n- Rate at or near market, often below the bank rate as a selling point\n- Deed of trust with acceleration on sale, insurance and tax impounds, and personal guaranties\n\n### Seller benefits and risks\n- **Tax**: an installment sale reports gain **as principal is received**, which spreads the capital gain over several years (Q174). Depreciation recapture taxed as ordinary income doesn't defer. Interest must meet IRS **applicable federal rate (AFR)** minimums.\n- **Risk**: if the buyer defaults, the seller may have to foreclose and take back a property in worse shape. Underwrite the buyer like a lender would.\n\n### Frequency\nI found **no current data** on seller-carry share in Ventura County. Treat it as uncommon but growing: commercial debt is still expensive versus 2021, and banks remain selective.\n\n### So what\nFor a free-and-clear owner who doesn't need all the cash, a carryback can **widen the buyer pool and support price**. Bring in the client's CPA and a real estate attorney early. Consumer lending rules can apply if the buyer is an owner-occupant of a 1–4 unit property.","keyPoints":["Most common with free-and-clear, long-held small buildings","Installment sale: gain taxed as principal is received; ordinary-income recapture doesn't defer; interest must meet AFR","Agency loans generally prohibit hard subordinate debt, so seller seconds pair with bank or CU loans","Typical structure: 20%–35% down, 5–10 year balloon (negotiated)"],"sources":[{"title":"Taft Law - Seller financing: another option for commercial real estate","url":"https://www.taftlaw.com/news-events/law-bulletins/seller-financing-another-option-for-commercial-real-estate/","date":""},{"title":"Crexi - What is owner financing for commercial property","url":"https://www.crexi.com/insights/what-is-owner-financing-for-commercial-property","date":""},{"title":"Wiss - Commercial real estate financing that fits your deal","url":"https://wiss.com/commercial-real-estate-financing/","date":"2026-01"},{"title":"IRS - Topic no. 705, Installment sales","url":"https://www.irs.gov/taxtopics/tc705","date":"2026"},{"title":"Freddie Mac Multifamily - Optigo Conventional Small product sheet","url":"https://mf.freddiemac.com/docs/conventional_small.pdf","date":"2026-04"}],"lastVerified":"2026-10-27","confidence":"low","verify":"There's no published Ventura County seller-financing frequency. Ask local escrow officers and title reps how many recent multifamily closings had seller carrybacks, or search recorded second deeds of trust in favor of sellers. Confirm Dodd-Frank/SAFE Act rules with counsel for any 1–4 unit owner-occupied buyer. Tax treatment is educational only; the client should confirm with a CPA.","drills":[{"q":"Why do seller second loans rarely pair with Fannie or Freddie first mortgages?","c":["Agencies require 100% LTV","Agencies don't lend on buildings over 10 units","Agency programs generally prohibit hard subordinate debt","Seller seconds are illegal in California"],"a":2,"x":"Freddie's Conventional Small sheet, for example, states that hard subordinate debt is not permitted."},{"q":"Under an installment sale, when does the seller generally report capital gain?","c":["Only when the balloon is paid","Never, if the buyer pays interest","All in the year of sale","As principal payments are received"],"a":3,"x":"IRS Topic 705: gain is reported as payments are received. Ordinary-income recapture is reported in the year of sale."}]}},"114":{"id":114,"s":8,"t":"What are prepayment penalty structures, and how do they affect sellers' timing?","a":{"summary":"Agency loans carry yield maintenance or defeasance by default, with step-downs available for extra cost. Banks and credit unions tend to use step-downs or no penalty at all. The penalty is largest when today's rates are below the loan's note rate, so owners who financed in 2023–2024 at 6.5% to 7% may face six-figure exit costs. Selling with an assumption can avoid that.","answer":"### The structures\n| Structure | How it works | Where you see it |\n|---|---|---|\n| **Yield maintenance (YM)** | Lender is paid the present value of the interest it loses (note rate minus Treasury yield) through the term | Fannie Small default; Freddie before securitization |\n| **Defeasance** | Borrower buys Treasuries that replace the loan's cash flows | Freddie Conventional Small after the 2-year lockout; CMBS |\n| **Step-down** | Fixed percentage of balance that declines each year, e.g., 5-4-3-2-1 | Agency at extra cost; common at banks |\n| **None** | No penalty | Some CUs (e.g., OCCU) |\n\nFreddie Conventional Small: YM until securitized, then a **2-year lockout**, then defeasance, with **no premium in the final 90 days**. Fannie Small offers YM or step-down and is **assumable for a 1% fee** plus costs.\n\n### Why timing matters\nYM costs more when rates **fall** below the note rate.\n- **2021 loan at ~3.5%** with Treasuries now near 4.8%–5%: the YM formula gives about zero, and the seller usually pays only the minimum premium. That's a cheap exit.\n- **2023 loan at 6.75%**, $3M balance, 7 years left, Treasury ~4.9%: rough YM is about 1.85% × $3M a year, discounted over 7 years, or **about $320,000 (~11%)**.\n\n### Seller playbook\n- Pull the **note's prepayment rider** before you price a listing. Calculate the exit cost.\n- **Time the sale** to a step-down date, the open window (Freddie's last 90 days), or a point where YM has dropped.\n- **Market the loan assumption**. A below-market assumable rate is worth real money to buyers, and the 1% fee is cheap compared with YM.\n- Research on Fannie small loans shows **prepayments spike when penalties expire**. Expect more listings around those dates.\n\n### So what\nTwo identical buildings can need very different prices. The difference is often the seller's prepay, so build it into the net-sheet conversation on day one.","keyPoints":["Fannie Small: YM or step-down; assumable for a 1% fee","Freddie Conventional Small: YM until securitized, then 2-yr lockout, then defeasance; open the final 90 days","YM grows when market rates fall below the note rate","Example: $3M at 6.75%, 7 years left, Treasury ~4.9%: YM about $320K (~11%)","Prepayments spike when penalty periods expire"],"sources":[{"title":"Greystone - Fannie Mae Small Mortgage Loans term sheet","url":"https://www.greystone.com/wp-content/uploads/2024/04/Greystone-Fannie-Mae-Small-Mortgage-Loans-Term-Sheet.pdf","date":"2025-03"},{"title":"Freddie Mac Multifamily - Optigo Conventional Small product sheet","url":"https://mf.freddiemac.com/docs/conventional_small.pdf","date":"2026-04"},{"title":"Orange County's Credit Union - Multifamily financing","url":"https://prod.orangecountyscu.org/products/business-services/commercial-real-estate-lending/Multifamily-Financing","date":""},{"title":"Multifamily.loans - What is defeasance and how does it work","url":"https://www.multifamily.loans/apartment-finance-blog/what-is-defeasance-and-how-does-it-work/","date":""},{"title":"Real Estate Economics (2020) - Early termination of small loans in the multifamily mortgage market","url":"https://ideas.repec.org/a/bla/reesec/v48y2020i4p1198-1233.html","date":"2020"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The YM example is a simplified estimate. Real YM uses the specific note's formula, discount rate, and any minimum (often 1%). Get a payoff quote from the servicer for any listing.","drills":[{"q":"In which case is yield maintenance expensive?","c":["Current Treasury yields are well above the note rate","Current Treasury yields are well below the note rate","The loan is in its open period","The loan is assumed by the buyer"],"a":1,"x":"YM pays the lender the interest it loses. When market rates are below the note rate, that loss and the penalty are large."},{"q":"What is the standard Freddie Conventional Small prepayment structure?","c":["YM until securitized, then 2-year lockout, then defeasance","Flat 3% fee","5-4-3-2-1 step-down","No penalty ever"],"a":0,"x":"Per Freddie's product sheet: YM until securitized, then a 2-year lockout, then defeasance, open the final 90 days."},{"q":"What does a Fannie Small loan assumption typically cost?","c":["5% of the balance","Nothing","A 1% fee plus legal and processing costs","Full yield maintenance"],"a":2,"x":"The Greystone term sheet says loans are assumable with lender consent and a 1% fee plus costs."}]}},"115":{"id":115,"s":8,"t":"What would a 50 basis point rate drop or rise do to pricing in this market?","a":{"summary":"A 50 bp move in loan rates changes how much a DSCR-limited buyer can borrow by about 5%, which moves what they can pay by about 3%. On a $5.7M building that is roughly $150K to $170K either way, before any change in cap rates. In practice, cap rates follow rates only partly and with a lag.","answer":"### Worked example (illustrative assumptions)\n- NOI **$300,000**, priced at a **5.25% cap** = **$5,714,000**\n- Loan: 30-yr amortization, **1.25x** DSCR test, base rate **6.75%** (about where 10-yr agency small debt prices with the 10-yr Treasury near 5%)\n- Buyer's equity is fixed at what the base case needs\n\n| Rate | Loan constant | Max loan (NOI ÷ 1.25 ÷ constant) | LTV at base price | Price buyer can pay |\n|---|---|---|---|---|\n| 6.25% (−50) | 7.39% | $3,248,000 | 56.8% | **$5,879,000 (+2.9%)** |\n| 6.75% (base) | 7.78% | $3,084,000 | 54.0% | $5,714,000 |\n| 7.25% (+50) | 8.19% | $2,932,000 | 51.3% | **$5,563,000 (−2.7%)** |\n\n### Cap-rate view\nIf buyers pass rate changes into cap rates:\n- **+25 bps** (5.25% to 5.50%): $300K NOI is worth $5,455,000 (**−4.5%**)\n- **−25 bps** (to 5.00%): worth $6,000,000 (**+5.0%**)\n\nCap rates usually move **less than** the full rate change and more slowly. Nationally, small multifamily cap rates averaged about **6.0% in Q2 2026** with rates near these levels. Spreads have been squeezed and negative leverage is common.\n\n### Reality check for 2026\nThe 10-year Treasury went from 4.69% (Aug 11) to around 5.1%–5.2% in mid-October, then 4.96% (Oct 22). That is a 30–50 bp swing in a few weeks. Rate locks and timing matter.\n\n### So what\n- Tell sellers: **+50 bps ≈ about 3% off what a leveraged buyer can pay**. It's more if cap rates also widen.\n- Cash and 1031 buyers with heavy equity are **less rate-sensitive**. They set the price when rates spike.\n- Suggest buyers lock early (agency **Index Lock**, rate lock at application) when markets are volatile.","keyPoints":["DSCR-limited loan sizing: ±50 bps changes max loan by about ±5%","At fixed equity, that moves the price a buyer can pay by about ±3% (about ±$150–170K on $5.7M)","±25 bps on a 5.25% cap moves value about −4.5% / +5.0%","Cap rates usually follow interest rates only partly and with a lag","10-yr UST swung 4.69% (Aug 11) to ~5.2% (mid-Oct) to 4.96% (Oct 22, 2026)"],"sources":[{"title":"Greystone - Small Loan Rates (Fannie Mae Small / Freddie Mac small), rates updated 08/11/2026","url":"https://www.greystone.com/wp-content/uploads/2026/08/Small-Rates_2026.08.11.pdf","date":"2026-08"},{"title":"CrowdfundedWealth - Treasury par yields, October 22, 2026 (citing U.S. Treasury data)","url":"https://www.crowdfundedwealth.com/articles/treasury-tips-ladder-rungs-after-tax-fdic-cd-limit-2026","date":"2026-10"},{"title":"FRED (St. Louis Fed) - 10-Year Treasury Constant Maturity (DGS10)","url":"https://fred.stlouisfed.org/graph/?g=1q06w","date":"2026-10"},{"title":"Arbor - Small Multifamily Investment Report Q3 2026","url":"https://arbor.com/research/reports/small-multifamily-investment-report-q3-2026/?acc=y","date":"2026-09"},{"title":"Freddie Mac Multifamily - Optigo Conventional Small product sheet","url":"https://mf.freddiemac.com/docs/conventional_small.pdf","date":"2026-04"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The example uses assumed NOI, cap rate and loan terms. Replace them with current Ventura County cap-rate comps (Section 5) and a live lender quote. The Arbor 6.0% figure is national small multifamily, not Ventura County.","drills":[{"q":"In the worked example, roughly what does a 50 bp rate increase do to the price a DSCR-limited buyer with fixed equity can pay?","c":["About −10%","−50%","−0.5%","About −3%"],"a":3,"x":"The max loan falls about 5% ($3.08M to $2.93M). With equity fixed, price falls about 2.7%, roughly 3%."},{"q":"$300,000 NOI at a 5.50% cap is worth about:","c":["$6,250,000","$5,455,000","$5,714,000","$6,000,000"],"a":1,"x":"$300,000 ÷ 0.055 = $5,454,545."},{"q":"Which buyers are least sensitive to a rate spike?","c":["Cash and 1031 buyers with heavy equity","First-time owner-occupants","Bridge borrowers","DSCR-loan investors at max leverage"],"a":0,"x":"Buyers using little debt are less affected by loan-rate changes."}]}},"116":{"id":116,"s":9,"t":"What does AB 1482 (Tenant Protection Act) require for rent caps and just-cause eviction, and which properties are exempt?","a":null},"117":{"id":117,"s":9,"t":"What is the current AB 1482 maximum allowable rent increase for Ventura County, and when does it reset?","a":null},"118":{"id":118,"s":9,"t":"How did SB 567 change just-cause eviction rules, especially for substantial remodel and owner move-in?","a":null},"119":{"id":119,"s":9,"t":"What does Costa-Hawkins allow and prohibit for local rent control?","a":null},"120":{"id":120,"s":9,"t":"How does the Ellis Act apply, and what are the relocation obligations?","a":null},"121":{"id":121,"s":9,"t":"What are the current security deposit limits under AB 12, and what's the small landlord exception?","a":null},"122":{"id":122,"s":9,"t":"What are the rules on application fees, tenant screening, and source-of-income discrimination?","a":null},"123":{"id":123,"s":9,"t":"What are the notice requirements for rent increases of various sizes?","a":null},"124":{"id":124,"s":9,"t":"What does a 3-day notice require, and what are the current eviction timelines in Ventura County courts?","a":null},"125":{"id":125,"s":9,"t":"What are landlords' obligations under habitability law?","a":null},"126":{"id":126,"s":9,"t":"What are the SB 721 balcony and exterior elevated element inspection requirements and deadlines?","a":null},"127":{"id":127,"s":9,"t":"What are California's lead paint, mold, smoke and CO detector, and water heater strapping requirements for rentals?","a":null},"128":{"id":128,"s":9,"t":"What do Prop 13 and Prop 19 mean for property tax reassessment and inheritance?","a":null},"129":{"id":129,"s":9,"t":"W
