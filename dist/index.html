ly homes or condos with proper notice) | Market, subject to notice rules |\n\n**Why 8.6%:** AB 1482 allows 5% plus CPI, or 10%, whichever is lower. Counties outside the four BLS metro areas (LA, Riverside, San Diego, SF) use the statewide California CPI. The April 2025 to April 2026 change in that index was **3.6%** (DIR). Last year's cap was 7.7%.\n\n### What to say about strategy\n- The cap is a **ceiling, not a target**. Ventura County rents rose only about 1.2% year over year (Matthews), and several East County submarkets are flat to negative. Pushing to the cap can raise turnover costs.\n- Notice rules: 30 days for increases up to 10%, 90 days above that (Q123).\n- Unused increases don't carry over: the cap applies to any 12-month period.\n- Oxnard landlords must also **register units** and pay annual program fees. FY 2026-27 proposals were $140 per fully covered unit and $70 per partially covered unit.\n\n### Ask back\n- Address and year built\n- Ownership entity (affects exemptions)\n- Date of each tenant's last increase\n- Current rent vs. market\n\n### Follow-up\n\"Send me the rent roll and I'll mark each unit's legal maximum and the market rent so you can see your real loss-to-lease.\" See Q116, Q117, Q132 and Q133.","keyPoints":["AB 1482 cap for Ventura County, Aug 1, 2026 – Jul 31, 2027: 8.6% (5% + 3.6% statewide California CPI)","Oxnard (pre-Feb 1995 multifamily) and Ojai cap increases at 4%","Exemptions include buildings within 15 years of their certificate of occupancy and qualifying single-family homes or condos with notice","Market rent growth (about 1.2%) is usually the real constraint","Notice: 30 days for increases up to 10%, 90 days above 10%"],"sources":[{"title":"California Department of Industrial Relations - Consumer Price Index California, percent change 2025-2026","url":"https://www.dir.ca.gov/OPRL/CPI/PresentCCPIchange.PDF","date":"2026-10"},{"title":"California Apartment Association - All CPI figures for 2026 AB 1482 rent increases now available","url":"https://caanet.org/?p=106638","date":"2026-06"},{"title":"City of Oxnard - Rent Stabilization and Just Cause Eviction Program: Proposed Annual Program Fee and Study (community meeting presentation)","url":"https://www.oxnard.gov/wp-content/uploads/pdfs/departments/housing/oxnard-fee-study-community-meeting-presentation-july-2026.pdf","date":"2026-07"},{"title":"AAGLA - News Alert: Oxnard Adopts New Fees for ALL Rental Properties","url":"https://members.aagla.org/news/news-alert-oxnard-adopts-new-fees-for-all-rental-properties","date":"2025-05"},{"title":"City of Ojai - Rent Stabilization","url":"https://ojai.ca.gov/582/Rent-Stabilization","date":"n.d."},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"}],"lastVerified":"2026-10-27","confidence":"high","verify":"The 8.6% figure is derived from the DIR California CPI (April 2026 vs. April 2025 = 3.6%) and the CAA statement that counties outside the four BLS metro areas use the statewide CPI. Confirm with the CAA county CPI calculator. Confirm Oxnard's current fee amounts and any 2026 ordinance amendments with the city's Rent Stabilization Division.","drills":[{"q":"What is the maximum AB 1482 annual rent increase for a covered Ventura County unit for increases effective Aug 1, 2026 – Jul 31, 2027?","c":["10%","8.6%","7.7%","8.7%"],"a":1,"x":"Ventura County uses the statewide California CPI (3.6%), so the cap is 5% + 3.6% = 8.6%. 8.7% is the LA-area figure, and 7.7% was last year's cap."},{"q":"A client owns a 1978 fourplex in Oxnard. What annual cap applies?","c":["No cap, because it has fewer than five units","8.6% under AB 1482","4% under Oxnard's Rent Stabilization Ordinance","3% under Santa Barbara's new ordinance"],"a":2,"x":"Oxnard's ordinance covers multifamily with a certificate of occupancy on or before Feb 1, 1995 and caps increases at 4%."}]}},"207":{"id":207,"s":17,"t":"\"Can I evict a problem tenant, and how long will it take?\"","a":{"summary":"Yes, if you have a legal 'just cause' and do every step by the book. A clean nonpayment case can take roughly one to two months, while a contested case can run several months. Before you serve anything, let's get a landlord-tenant attorney involved, because one defective notice restarts the clock.","answer":"### On the spot\nDon't promise a timeline or give legal advice. Explain the framework and the risks, then refer to an eviction attorney.\n\n### Framework\n1. **Just cause is required** for most tenants of 12+ months under AB 1482 and for covered units in Oxnard and Ojai. *At-fault* causes include nonpayment and material lease breach. *No-fault* causes include owner move-in, withdrawal (Ellis Act) and substantial remodel, which was narrowed by SB 567 (Q118, Q120).\n2. **Notice:** for example, a 3-day notice to pay or quit (court days exclude weekends and judicial holidays), or a notice to cure (Q124).\n3. **Unlawful detainer filing.** Since Jan 1, 2025 (AB 2347), the tenant has **10 court days** to respond, up from 5.\n4. **Trial and judgment, then a sheriff lockout.**\n\n### Timeline expectations\n- *Uncontested nonpayment:* commonly estimated at about 1–2 months from notice to lockout.\n- *Contested, or a jury demand:* several months or longer.\n\nThese are rough industry estimates, not Ventura Superior Court data. Confirm current calendaring with a local UD attorney.\n\n### Costs to flag\n- **No-fault relocation:** one month's rent under AB 1482. In Oxnard it is the **greater of two months' rent or $5,000**.\n- Lost rent and legal fees.\n- Retaliation and harassment exposure. Ventura is drafting an anti-harassment ordinance.\n\n### Practical alternatives\n- A negotiated move-out (\"cash for keys\") with a written agreement\n- Lease-violation documentation, to build an at-fault case\n- Selling the problem as part of the buyer's value-add story, priced in\n\n### Ask back\n- Tenancy length\n- City and building age\n- What exactly the tenant did, with documentation\n- Any prior notices served\n\n### Follow-up\n\"I'll introduce you to two Ventura County landlord attorneys. If you're thinking of selling, I'll show you how buyers price this tenancy.\" See Q116, Q124 and Q134.","keyPoints":["Just cause is required for most 12+ month tenancies (AB 1482; Oxnard and Ojai local rules)","Since 2025 (AB 2347), tenants get 10 court days to answer an unlawful detainer, up from 5","Uncontested is roughly 1–2 months; contested can be several months (estimates; verify locally)","No-fault relocation: one month's rent under AB 1482; in Oxnard the greater of two months or $5,000","Refer to a landlord-tenant attorney; consider cash-for-keys"],"sources":[{"title":"Hanson Bridgett - AB 2347 Gives Defendants More Time to Respond to Eviction Lawsuits","url":"https://www.hansonbridgett.com/publication/240926-8551-ab2347-gives-defendants-more-time-respond-eviction-lawsuits","date":"2024-09"},{"title":"City of Oxnard - Rent Stabilization and Just Cause Eviction Program: Proposed Annual Program Fee and Study (community meeting presentation)","url":"https://www.oxnard.gov/wp-content/uploads/pdfs/departments/housing/oxnard-fee-study-community-meeting-presentation-july-2026.pdf","date":"2026-07"},{"title":"California Apartment Association - Ventura rejects rent control, rent registry proposal","url":"https://caanet.org/ventura-rejects-rent-control-rent-registry-proposal/","date":"2025-05"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The 1–2 month and several-month timelines are general estimates from secondary landlord guides, not Ventura County Superior Court statistics. Confirm current UD calendaring with a local eviction attorney. Check whether Ventura's anti-harassment ordinance (Planning Commission hearing January 2026) has been adopted.","drills":[{"q":"Under AB 2347 (effective Jan 1, 2025), how long does a California tenant have to respond to an unlawful detainer summons?","c":["5 calendar days","3 court days","30 days","10 court days"],"a":3,"x":"AB 2347 raised the response deadline from 5 to 10 court days, excluding weekends and judicial holidays."},{"q":"An Oxnard owner wants a no-fault eviction of a tenant paying $1,800/month. What minimum relocation payment does Oxnard's ordinance require?","c":["$1,800","$3,600","Nothing","$5,000"],"a":3,"x":"Oxnard requires the greater of two months' rent ($3,600) or $5,000, so $5,000."}]}},"208":{"id":208,"s":17,"t":"\"Is rent control coming to my city?\"","a":{"summary":"It depends on the city. Oxnard and Ojai already have local rent caps of 4%, the City of Ventura considered rent control in 2025 and declined, and Thousand Oaks, Port Hueneme and the unincorporated county rely on state law for apartments. The momentum to watch is regional: Santa Barbara adopted rent stabilization in October 2026.","answer":"### On the spot\nAnswer for the client's city, then give the regional trend. Don't predict votes; describe status and signals.\n\n### Status by jurisdiction (verify before quoting)\n| Jurisdiction | Apartments today |\n|---|---|\n| **Oxnard** | Local rent stabilization since June 2022: 4% cap for multifamily with a certificate of occupancy on or before Feb 1, 1995; just cause for all rentals; registry fees |\n| **Ojai** | 4% cap and local just cause (Ordinance 937, 2023) |\n| **City of Ventura** | Council declined rent control and a rental registry in May 2025 and directed staff to an anti-harassment ordinance instead |\n| **Thousand Oaks** | Legacy ordinance focused mainly on mobile home parks; apartment coverage limited to old tenancies (Tenants Together says post-1987 tenancies are exempt) |\n| **Port Hueneme, Camarillo, Simi Valley, Moorpark** | No local apartment rent control found; AB 1482 applies |\n| **Unincorporated county** | Mobile home park rent control only; AB 1482 for apartments |\n\n### Guardrails that limit local rent control (Costa-Hawkins, Q119)\n- Cities cannot cap rents on units built after Feb 1, 1995, or on most single-family homes and condos.\n- They must allow **vacancy decontrol**: rent resets on turnover.\n\nThat is why Oxnard's cutoff is Feb 1, 1995.\n\n### Signals to watch\n- **Santa Barbara** passed an ordinance 4-3 on Oct 6, 2026 (cap of 60% of CPI or 3%, whichever is lower). A landlord-backed referendum may send it to voters.\n- Ventura's tenant-protection workstream.\n- New state bills (Q157, Q162).\n\nStatewide rent-control measures have failed repeatedly (Q160). I found no confirmed statewide rent control measure on the November 2026 ballot (check Q159).\n\n### Ask back\n- Which city, and the building's certificate-of-occupancy date?\n- Are you deciding whether to buy, hold or sell because of this?\n\n### Follow-up\n\"I'll send you a one-page regulatory brief for your city and flag any council agenda items on tenant protections.\" See Q132, Q133, Q138 and Q163.","keyPoints":["Oxnard (4% cap, pre-Feb 1995 multifamily) and Ojai (4%) already have local caps","City of Ventura declined rent control and a registry in May 2025; an anti-harassment ordinance is in progress","Costa-Hawkins bars local caps on post-Feb 1995 units and requires vacancy decontrol","Santa Barbara adopted rent stabilization Oct 6, 2026 (lesser of 60% of CPI or 3%); a referendum is possible","Answer by jurisdiction and offer a regulatory brief"],"sources":[{"title":"City of Oxnard - Rent Stabilization and Just Cause Eviction Program: Proposed Annual Program Fee and Study (community meeting presentation)","url":"https://www.oxnard.gov/wp-content/uploads/pdfs/departments/housing/oxnard-fee-study-community-meeting-presentation-july-2026.pdf","date":"2026-07"},{"title":"AAGLA - News Alert: Oxnard Adopts New Fees for ALL Rental Properties","url":"https://members.aagla.org/news/news-alert-oxnard-adopts-new-fees-for-all-rental-properties","date":"2025-05"},{"title":"City of Ojai - Rent Stabilization","url":"https://ojai.ca.gov/582/Rent-Stabilization","date":"n.d."},{"title":"California Apartment Association - Ventura rejects rent control, rent registry proposal","url":"https://caanet.org/ventura-rejects-rent-control-rent-registry-proposal/","date":"2025-05"},{"title":"Tenants Together - City of Thousand Oaks rent control summary","url":"https://tenantstogether.org/?p=741","date":"n.d."},{"title":"County of Ventura RMA - Mobile Home Park Rent Control Program","url":"https://rma.venturacounty.gov/en/mobile-home-park-rent-control-program","date":"n.d."},{"title":"Santa Barbara Independent - The Long Road to Santa Barbara's Rent Stabilization Ordinance","url":"https://www.independent.com/2026/10/14/the-long-road-to-santa-barbaras-rent-stabilization-ordinance/","date":"2026-10"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Thousand Oaks apartment coverage comes from an advocacy summary; read the ordinance text (Thousand Oaks Municipal Code, Rent Adjustment Commission). Confirm whether Ventura adopted its anti-harassment ordinance, whether Santa Barbara's referendum qualified, and whether any city in the county placed a rent measure on the November 2026 ballot (county elections office). No statewide 2026 rent control measure was confirmed in research.","drills":[{"q":"Why does Oxnard's rent cap apply only to multifamily buildings with a certificate of occupancy on or before Feb 1, 1995?","c":["Costa-Hawkins bars local rent caps on units built after Feb 1, 1995","Oxnard chose that date to match AB 1482","Prop 19 sets that cutoff","The cutoff matches the Coastal Zone boundary"],"a":0,"x":"Costa-Hawkins exempts newer construction (post-Feb 1, 1995) from local rent control."},{"q":"What did the City of Ventura's council decide in May 2025?","c":["Adopted a 4% rent cap","Placed rent control on the ballot","Declined rent control and a registry, focusing on an anti-harassment ordinance","Adopted Santa Barbara's ordinance"],"a":2,"x":"The council declined rent control and a rental registry and directed staff toward landlord-tenant resources and an anti-harassment ordinance."}]}},"209":{"id":209,"s":17,"t":"\"What happens to my property taxes if I pass this to my kids?\"","a":{"summary":"Under Prop 19, a rental building passed to your kids is generally reassessed to market value, so their property tax bill could jump many times over. Only a family home they move into gets a partial break. Inherited property does usually get a stepped-up basis for income tax, so the plan needs an estate attorney and CPA working together.","answer":"### On the spot\nThis is a high-stakes tax and legal question. Explain the concept clearly, run a hypothetical, and refer to professionals.\n\n### Framework\n- **Prop 13** keeps your assessed value near your purchase price plus at most 2% a year (Q128).\n- **Prop 19** (Feb 16, 2021) repealed the old Prop 58/193 parent-child exclusion, which used to cover up to $1M of non-home property. The BOE is explicit: *there is no exclusion for any other type of real property* than a family home or family farm.\n- **Apartments are reassessed** at market value when they pass to children.\n- The **family home** exclusion requires the child to use it as their principal residence. It is capped at the existing taxable value plus an inflation-adjusted amount, reported in secondary legal guides as $1,044,586 for Feb 16, 2025 – Feb 15, 2027.\n\n### Hypothetical impact\n| | Before transfer | After transfer |\n|---|---|---|\n| Assessed value | $600,000 | $4,000,000 |\n| Tax at about 1.1% (hypothetical rate) | about $6,600 | about $44,000 |\n\nThat is about **$37,400 more per year**. A buyer would also pay this, so it hits the heirs' cash flow more than the building's market value.\n\n### Separate issue: income tax\nHeirs generally receive a **stepped-up basis** at death, which can erase built-up capital gain and depreciation recapture (Q177). A sale today gives that up. This is why many older owners hold.\n\n### Planning levers (attorney territory)\n- Holding title in entities, where legal-entity change-in-ownership rules apply\n- Trusts\n- Timing a sale vs. holding until death\n- Gifting\n\nFlag these; don't advise on them.\n\n### Ask back\n- How is title held (trust, LLC, partnership)?\n- Current assessed value\n- Heirs' plans: hold, sell or split?\n\n### Follow-up\n\"I'll give you a market value and the projected reassessed tax bill so your estate attorney and CPA can model the options.\" See Q98, Q99 and Q177.","keyPoints":["Prop 19 eliminated the parent-child exclusion for rental property; apartments are reassessed at market value","Only a family home used as the child's principal residence gets a capped exclusion","Show the property tax jump with a hypothetical (about $37K/yr more in the example)","Stepped-up basis at death is a separate income tax benefit that favors holding","Refer entity, trust and timing strategies to an estate attorney and CPA"],"sources":[{"title":"California State Board of Equalization - LTA 2021/008, Proposition 19 Intergenerational Transfer Exclusion Guidance","url":"https://boe.ca.gov/proptaxes/pdf/lta21008.pdf","date":"2021-02"}],"lastVerified":"2026-10-27","confidence":"high","verify":"Confirm the current inflation-adjusted family-home exclusion amount ($1,044,586 per secondary sources for Feb 2025 – Feb 2027) with the BOE or the Ventura County Assessor. Use the client's actual tax rate area for the rate. Legal-entity transfer rules (R&T Code 64) need attorney review.","drills":[{"q":"Under Prop 19, what happens to the assessed value of a fourplex a parent leaves to a child who keeps renting it out?","c":["It keeps the parent's base year value","Up to $1 million of value is excluded","It is exempt if held in a trust","It is reassessed to market value"],"a":3,"x":"Prop 19 has no exclusion for property other than a family home or family farm, so a rental is reassessed."},{"q":"Which statement about stepped-up basis is correct?","c":["It is a property tax rule under Prop 19","It prevents reassessment","It only applies to 1031 exchanges","It generally resets income tax basis at death, which can favor holding over selling"],"a":3,"x":"Step-up is an income tax concept (Q177), separate from Prop 19 property tax reassessment."}]}},"210":{"id":210,"s":17,"t":"\"Who would buy my building, and where are they from?\"","a":{"summary":"Your buyer pool depends mostly on size. A 2–4 unit building draws local owner-users and small investors on residential loans; 5–50 units draw private investors and 1031 exchangers from Ventura, LA and Orange County; and large newer assets draw institutions. I'd target all three channels and let the offers tell us.","answer":"### On the spot\nShow you know the buyer pool by segment, using real recent buyers, not generic claims.\n\n### Buyer pool by size\n| Segment | Typical buyers | Financing |\n|---|---|---|\n| 2–4 units | Owner-occupants, local first-time investors | Residential (Q71, Q112) |\n| 5–50 units | Private investors, families, syndicators, 1031 exchangers | Agency, bank, credit union |\n| 100+ units, newer | REITs, funds, national operators | Agency or institutional |\n\n### Recent Ventura County evidence\n- **Monte Vista, Ventura (52 units, July 2026):** bought by Red Tail Acquisitions, an **Orange County** private investment firm. Four offers; the seller was an estate.\n- **Tempo Riverpark, Oxnard (235 units, Q1 2026):** bought by **Hines**, about $446,809/unit (CBRE/RCA).\n- **AMLI Camarillo (213 units):** about $110.15M (NAI 2025 select sales).\n- Matthews estimates institutional/REIT buyers at about **30% of acquisition volume** over five years. It says investor demand concentrates in well-located value-add deals in **Oxnard, Camarillo and Ventura**.\n\n### What drives out-of-area capital\n- Ventura County is a high-cost, supply-constrained renter market. USC Lusk puts rents about 13% above LA County.\n- Outside Oxnard and Ojai, it has no local rent control.\n- Brokers often cite LA owners exchanging out of LA's regulatory and transfer-tax environment (Q78). Validate that with your own buyer logs rather than asserting it.\n\n### What this means for the client\n- Rent-controlled Oxnard product narrows the pool to buyers who underwrite slow rent growth (Q87).\n- Clean, renovated product with upside attracts the most bidders.\n\n### Ask back\n- Unit count, condition, and rent upside\n- Is speed and certainty worth more to you than top price (Q93)?\n- Will you consider seller financing (Q113)?\n\n### Follow-up\n\"I'll show you our buyer list for buildings like yours: who's bought in the last 24 months and from where.\" See Q75–Q85.","keyPoints":["Segment buyers by size: 2–4 units (owner-users, residential loans), 5–50 (private and 1031), 100+ (institutions)","Real buyers: Red Tail Acquisitions (OC) for Monte Vista; Hines for Tempo Riverpark","Matthews: about 30% institutional share; demand concentrated in value-add in Oxnard, Camarillo and Ventura","Rent control status and condition shape the depth of the pool","Offer a buyer list from recent comparable trades"],"sources":[{"title":"Radius Commercial Real Estate - Monte Vista Townhomes Sells for $12.325M in Ventura's Largest Commercial Real Estate Sale of 2026","url":"https://www.radiusgroup.com/news-alert-monte-vista-townhomes-sells-for-12-325m-in-venturas-largest-commercial-real-estate-sale-of-2026/","date":"2026-07"},{"title":"CBRE Research - Ventura Multifamily Figures Q1 2026","url":"https://mktgdocs.cbre.com/2299/ab862b9f-1e9a-44f0-a3ad-58310f164d96-224289790/Ventura_Multifamily_Snapshot_Q.pdf","date":"2026"},{"title":"NAI Capital - Multifamily Market Outlook, Ventura County Q4 2025","url":"https://www2.naicapital.com/wp-content/uploads/sites/2/VC-Mulifamily-Market-Outlook-Q4_2025.pdf","date":"2026"},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"},{"title":"The Registry / USC Lusk Center - Southern California Multifamily Rents to Rise Through 2027 as Housing Shortage Deepens","url":"https://lusk.usc.edu/node/12402","date":"2025-12"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The share of buyers from LA and the role of Measure ULA in pushing capital to Ventura County were not confirmed with data. Build that from CoStar buyer-origin fields and your own deal log (Q77-Q78).","drills":[{"q":"Who bought the 52-unit Monte Vista Townhomes in Ventura in July 2026?","c":["Hines","A Los Angeles REIT","Red Tail Acquisitions, an Orange County private firm","The Area Housing Authority"],"a":2,"x":"Radius reported the buyer as Red Tail Acquisitions, an Orange County-based private real estate investment firm."},{"q":"What is the typical buyer for a 2–4 unit Ventura County property?","c":["Owner-occupants and small local investors using residential financing","Institutional REITs","Life insurance companies","LIHTC syndicators"],"a":0,"x":"2–4 unit properties qualify for residential financing and attract owner-users and small investors."}]}},"211":{"id":211,"s":17,"t":"\"Should I renovate before selling or sell as-is?\"","a":{"summary":"Usually fix what would kill or retrade the deal, turn any vacant units, and leave the big repositioning to the buyer. Buyers pay for in-place income and a clean inspection, not for capital you spent that they can't yet see in rents.","answer":"### On the spot\nSeparate three buckets of spending and test each with simple math.\n\n### Three buckets\n1. **Deal-killers (do these):**\n   - SB 721 balcony and elevated-element inspection compliance (Q126)\n   - Active roof leaks\n   - Problem electrical panels or plumbing (Q184)\n   - Life-safety items\n   - Permit issues you can cure (Q185)\n\n   These show up in inspections and become retrades (Q186).\n2. **Vacant-unit turns (usually do):** a renovated vacant unit leases at today's market rent, which proves the upside to buyers.\n3. **Full repositioning of occupied units (usually don't):** under AB 1482 and SB 567 (Q118), you can't move tenants out just to renovate unless the work qualifies as a *substantial remodel*. Rent increases are also capped, so the buyer's value-add story is often worth more than your execution.\n\n### Simple test (hypothetical)\nRenovate a **vacant** unit for $40,000 and raise rent $300/month:\n- Added NOI: $3,600/yr\n- Value created at a 5.5% cap: **about $65,000**, more than the cost, so do it.\n\nThe same spend on an occupied unit creates nothing until it turns over.\n\n### Ventura County proof point\nMonte Vista (52 units, Ventura) had **37 of 52 units renovated since 2020**, about 98% occupancy at launch, and in-place rents about 8% below market. It drew **four offers** and sold at a 5.78% in-place cap. Buyers paid for the renovation story *and* the remaining upside.\n\n### Ask back\n- Which units are vacant now or soon?\n- Your inspection history and any SB 721 report\n- Your timeline; renovations add months\n- Your appetite for construction risk\n\n### Follow-up\n\"Let me walk the building with a contractor and give you a **pre-sale punch list** ranked by return.\" See Q54 and Q69.","keyPoints":["Fix deal-killers (SB 721, roof, panels, permits) before listing","Turn vacant units to prove market rent","Rarely reposition occupied units pre-sale: AB 1482 and SB 567 limit rent capture and relocation","Test each spend: added NOI / cap rate vs. cost","Monte Vista: 37 of 52 units renovated, four offers, 5.78% in-place cap"],"sources":[{"title":"Radius Commercial Real Estate - Monte Vista Townhomes Sells for $12.325M in Ventura's Largest Commercial Real Estate Sale of 2026","url":"https://www.radiusgroup.com/news-alert-monte-vista-townhomes-sells-for-12-325m-in-venturas-largest-commercial-real-estate-sale-of-2026/","date":"2026-07"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Renovation costs and rent premiums in the example are hypothetical. Get local contractor bids and premiums by submarket (Q53-Q54). Confirm SB 567 substantial-remodel requirements with an attorney before any tenant displacement.","drills":[{"q":"A $40,000 renovation of a vacant unit raises rent $300/month. At a 5.5% cap rate, roughly how much value does it create?","c":["$3,600","$40,000","$65,000","$300,000"],"a":2,"x":"$300 x 12 = $3,600 of added NOI; $3,600 / 0.055 is about $65,000."},{"q":"Which pre-sale spending is most clearly worth doing?","c":["Curing SB 721 balcony issues and other inspection deal-killers","Adding a pool","Fully renovating all occupied units","Raising all rents to the AB 1482 maximum right before listing"],"a":0,"x":"Deal-killer items surface in due diligence and lead to retrades or failed escrows."}]}},"212":{"id":212,"s":17,"t":"\"What's my 1031 replacement property going to look like?\"","a":{"summary":"It depends on what you want your money to do: more units in Ventura County at a mid-5% cap, a newer and easier building at a lower yield, a net-leased property with almost no management, or a DST. The non-negotiables are 45 days to identify and 180 days to close, and you need to replace both your equity and your debt to defer all the tax.","answer":"### On the spot\nStart with goals, not listings. Then explain the rules so they plan the identification before they list.\n\n### Rules to state (confirm with a qualified intermediary and CPA)\n- **45 days** from the sale to identify replacement property in writing.\n- **180 days** to close, or by the tax return due date if earlier. No extensions except presidentially declared disasters.\n- Never touch the proceeds; use a **qualified intermediary**.\n- To defer fully, buy equal or greater value, reinvest all net equity, and replace debt. Cash or debt relief (*boot*) is taxable.\n- All U.S. real property held for investment is like-kind to other U.S. investment real property.\n\n### Common replacement paths\n| Path | Trade-off |\n|---|---|\n| Bigger or better Ventura County multifamily | Mid-5% average caps; still management-intensive; AB 1482 or local caps |\n| Newer product (built within 15 years) | Exempt from AB 1482's cap, fewer capex surprises, often a lower yield |\n| Out-of-state multifamily | Higher yields, less regulation; unfamiliar market |\n| Net-leased retail or industrial | Minimal management; tenant credit risk |\n| DST interests (Q173) | Passive and fractional; illiquid, sponsor fees |\n\n### Market reality\nInventory is thin. CBRE/RCA recorded no qualifying Ventura County multifamily sales in Q2 2026. Start looking for replacements **before** going into escrow, and consider a reverse exchange or a longer close.\n\n### Ask back\n- Do you want less management, more cash flow, or appreciation?\n- How much debt are you willing to carry?\n- Any location preference?\n- Heirs' plans, since step-up at death can end the deferral chain (Q177)?\n\n### Follow-up\n\"I'll build a **replacement-property shortlist**: three local and three out-of-area options with cap rates and management load, before we list yours.\" See Q85, Q172, Q173 and Q174.","keyPoints":["45-day identification and 180-day close; use a qualified intermediary; no extensions except federal disasters","Full deferral: equal or greater value, all equity reinvested, debt replaced; boot is taxable","Paths: larger local multifamily, newer AB 1482-exempt product, out-of-state, net lease, DST","Thin local inventory, so line up replacements before listing","Start from the client's goals (management, income, legacy)"],"sources":[{"title":"IRS - 2025 Instructions for Form 8824, Like-Kind Exchanges","url":"https://www.irs.gov/pub/irs-pdf/i8824.pdf","date":"2025"},{"title":"IRS - FS-2008-18, Like-Kind Exchanges Under IRC Section 1031","url":"https://www.irs.gov/pub/irs-news/fs-08-18.pdf","date":"2008-02"},{"title":"CBRE Research - Ventura Multifamily Figures Q2 2026","url":"https://mktgdocs.cbre.com/2299/dec75ad2-1739-499f-b76f-559255509b56-27776285/Ventura_Multifamily_Snapshot_Q.pdf","date":"2026"},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"}],"lastVerified":"2026-10-27","confidence":"high","verify":"Identification rules (e.g., the three-property rule) and reverse-exchange mechanics should be confirmed with the client's qualified intermediary and CPA. Tax treatment is educational, not advice.","drills":[{"q":"How many days does a 1031 exchanger have to identify replacement property in writing?","c":["30","45","90","180"],"a":1,"x":"Identification must happen within 45 days of the sale; closing must happen within 180 days."},{"q":"A client sells with a $1M loan and buys replacement property with only a $600K loan and no added cash. What is the tax consequence?","c":["No consequence if the price is higher","The $400K net debt relief can be taxable boot","The exchange is void","Only state tax applies"],"a":1,"x":"To defer fully, debt must be replaced with new debt or added cash. Net debt relief is treated as boot."}]}},"213":{"id":213,"s":17,"t":"\"Why should I list with you instead of the broker who sold the building next door?\"","a":{"summary":"The broker next door sold one building; the question is who will get you the most money with the fewest surprises. I'll show you my marketing reach across Ventura, Santa Barbara, LA and Orange County buyers, my pricing logic in writing, and how I'll keep your escrow from falling apart.","answer":"### On the spot\n**Never criticize the other broker.** Acknowledge the comp, then compete on process, reach and accountability.\n\n### Framework: the three things a seller is really buying\n1. **Price discovery.** A defensible broker opinion of value built from rent roll, buyer underwriting and comps (Q203, Q205), plus a structured process (call for offers, best-and-final) that creates competition.\n2. **Buyer reach.** Ventura County buyers come from all over. The Monte Vista buyer was an Orange County firm; institutions like Hines buy large assets. A Santa Barbara-based team adds coastal buyer relationships that Ventura-only shops may not have (Q199). Show your database, your marketing channels (CoStar, LoopNet, Crexi, MLS, email; Q197) and recent inquiries.\n3. **Execution.** You:\n   - Pre-clear deal-killers (SB 721, permits, insurance quotes)\n   - Vet buyer financing\n   - Know local rules (Oxnard registry, AB 1482 notices)\n   - Keep escrow on track when rates move\n\n### Proof to bring\n- Your team's closed and active Ventura County deals.\n- Example: Radius's Monte Vista sale (52 units, $12.325M, four offers in a market its brokers called \"not strong\").\n- References from sellers.\n- A sample marketing timeline and weekly reporting format.\n\n### Turn the neighbor's sale into your advantage\n\"Their sale is a great comp. Let's look at what it actually closed at, the terms, and how long it took. Then let's talk about what we'd do differently for your building.\"\n\n### Ask back\n- What mattered most to you the last time you sold?\n- What would make you fire a broker?\n\n### Follow-up\n\"Let me bring you a written marketing plan and BOV side by side with how the comp next door was marketed.\" See Q194–Q197.","keyPoints":["Never disparage the competitor; treat their sale as a comp","Sell on price discovery, buyer reach and execution","Santa Barbara base plus Ventura focus extends buyer reach (Q199)","Bring proof: closed deals, buyer lists, marketing timeline, references","Offer a written marketing plan and BOV"],"sources":[{"title":"Radius Commercial Real Estate - Monte Vista Townhomes Sells for $12.325M in Ventura's Largest Commercial Real Estate Sale of 2026","url":"https://www.radiusgroup.com/news-alert-monte-vista-townhomes-sells-for-12-325m-in-venturas-largest-commercial-real-estate-sale-of-2026/","date":"2026-07"},{"title":"CBRE Research - Ventura Multifamily Figures Q1 2026","url":"https://mktgdocs.cbre.com/2299/ab862b9f-1e9a-44f0-a3ad-58310f164d96-224289790/Ventura_Multifamily_Snapshot_Q.pdf","date":"2026"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Update your proof points with your own closed and active Ventura County deals and buyer counts. Don't cite another team's deal as your own; cite your firm's deals accurately.","drills":[{"q":"What is the best first move when a seller says the broker next door just sold a similar building?","c":["Acknowledge the sale as a useful comp and pivot to your process and reach","Offer a lower commission immediately","Point out mistakes the other broker made","Say that sale was off-market so it doesn't count"],"a":0,"x":"The model answer never disparages competitors. It uses their sale as a comp and competes on process."},{"q":"Which three elements does the model answer say a seller is really buying?","c":["Tax advice, legal advice, lending","Low fees, fast listing, signage","Staging, photography, open houses","Price discovery, buyer reach, execution"],"a":3,"x":"The framework is price discovery, buyer reach and execution."}]}},"214":{"id":214,"s":17,"t":"\"What's the best submarket in Ventura County to buy in right now, and why?\"","a":{"summary":"There's no single best submarket, only the best one for your strategy. For a stable, lightly regulated small multifamily hold, I like the City of Ventura's established neighborhoods; for yield, Oxnard, if you can live with its 4% local cap; and for quality and stability, Thousand Oaks. I'd be cautious where new lease-ups are still pressuring rents, like parts of Camarillo and Moorpark.","answer":"### On the spot\nAsk about strategy first: cash flow, appreciation, value-add, or low management. Then give a view backed by numbers.\n\n### Data snapshot\n| Submarket | Vacancy | Avg rent | Note |\n|---|---|---|---|\n| Ventura (city) | 3.6% (CBRE Q1 '26) | $2,808 | No local rent control; zero Q1 completions |\n| Oxnard | 3.7% | $2,714 | Largest stock (about 13,300 units); 4% local cap on pre-1995 multifamily |\n| Camarillo | 3.8% | $2,769 | 385 units delivered in Q1 2026; Matthews shows 7.4% vacancy |\n| Thousand Oaks | 4.2% | $2,858 | Highest rents, no new completions |\n| Simi Valley/Moorpark | 4.4% | $2,628 | Matthews shows Moorpark vacancy 8.7% |\n| Port Hueneme | 2.4% (Matthews) | lower rents | Navy base demand (Q15, Q191) |\n\n### How to frame it\n- **Ventura (Midtown, East End):** tight vacancy, little new supply, AB 1482 only. Monte Vista's buyer called it a \"clean basis in a supply-constrained submarket.\" Good for long-term holds.\n- **Oxnard:** deepest buyer interest in value-add (Matthews) and often more units per dollar. But pre-1995 buildings are capped at 4% and carry registry fees, so underwrite slower rent growth.\n- **Thousand Oaks and Conejo:** premium rents and tenants; lower yields; little product trades.\n- **Camarillo and Moorpark:** recent deliveries mean concessions and softer rents near term (Q35, Q45).\n\n### Ask back\n- What's your hold period?\n- Leverage, and your management model?\n- Comfort with local rent control?\n- Unit size target: 2–4, 5–20, or larger?\n\n### Follow-up\n\"Let me send a two-page submarket scorecard with current listings and recent trades that fit your criteria.\" See Q1–Q4, Q35, Q44 and Q132.","keyPoints":["Best submarket depends on the client's strategy; ask first","Ventura city: low vacancy (3.6%), no new Q1 supply, AB 1482 only","Oxnard: deepest stock and value-add demand, but a 4% local cap on pre-1995 multifamily","Thousand Oaks: highest rents; Camarillo and Moorpark: lease-up pressure","Back the view with a submarket scorecard"],"sources":[{"title":"CBRE Research - Ventura Multifamily Figures Q1 2026","url":"https://mktgdocs.cbre.com/2299/ab862b9f-1e9a-44f0-a3ad-58310f164d96-224289790/Ventura_Multifamily_Snapshot_Q.pdf","date":"2026"},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"},{"title":"Radius Commercial Real Estate - Monte Vista Townhomes Sells for $12.325M in Ventura's Largest Commercial Real Estate Sale of 2026","url":"https://www.radiusgroup.com/news-alert-monte-vista-townhomes-sells-for-12-325m-in-venturas-largest-commercial-real-estate-sale-of-2026/","date":"2026-07"},{"title":"City of Oxnard - Rent Stabilization and Just Cause Eviction Program: Proposed Annual Program Fee and Study (community meeting presentation)","url":"https://www.oxnard.gov/wp-content/uploads/pdfs/departments/housing/oxnard-fee-study-community-meeting-presentation-july-2026.pdf","date":"2026-07"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Vacancy figures differ by source (CBRE covers larger properties; Matthews uses different submarket lines). Refresh with the latest quarter and add small-property rent comps by neighborhood (Q3, Q4, Q41).","drills":[{"q":"According to CBRE's Q1 2026 figures, which submarket had the most new units delivered that quarter?","c":["Camarillo","Ventura","Thousand Oaks","Oxnard"],"a":0,"x":"Camarillo delivered 385 units in Q1 2026; Ventura, Thousand Oaks and Oxnard had zero completions that quarter."},{"q":"What is the key underwriting caveat for a pre-1995 Oxnard apartment building?","c":["It's exempt from all tenant laws","It must be sold to a nonprofit","It can't be financed","Annual increases are capped at 4% under the local ordinance, and registry fees apply"],"a":3,"x":"Oxnard's Rent Stabilization Ordinance caps increases at 4% for multifamily with a certificate of occupancy on or before Feb 1, 1995."}]}},"215":{"id":215,"s":17,"t":"\"Where are rents headed in the next two years?\"","a":{"summary":"Modestly up. The best forecasts I've seen call for about 1% to 1.5% a year countywide through 2027, with vacancy staying in the 4% range. Supply is limited, but recent lease-ups and a cooler job market are keeping a lid on rent growth for now.","answer":"### On the spot\nGive a range, cite the source, and say what would change it. Never promise rent growth.\n\n### What the data says\n- **USC Lusk forecast (Dec 2025):** Ventura County average rent from about $2,628 (Oct 2025) to about **$2,681 by Oct 2027**, or **about 1.19% a year**, with vacancy easing to about **4.61%**. It calls the county a \"high-cost, low-delivery\" market with rents about 13% above LA County.\n- **Matthews H1 2026:** rent growth **about 1.2% year over year**; vacancy **4.2%**, down 60 bps; more than 15% rent growth over five years; 502 units under construction (only 1.3% of inventory). It expects vacancy to stay stable.\n- **CBRE Q2 2026:** average rent about **$2,769**, occupancy 96.1%, no deliveries in the quarter. Two-bedroom rents were down 1.6% year over year.\n\n### Drivers\n| Upside | Downside |\n|---|---|\n| Thin pipeline, SOAR and land limits (Q144) | Recent lease-ups in Camarillo and Moorpark |\n| High cost of ownership (Q29) | Unemployment about 5.1% (Matthews) |\n| Navy and port employment | Affordability ceiling (Q23) |\n\n### So what for the client\n- At 1–2% market growth, the **8.6% AB 1482 cap isn't binding**. The market is the constraint.\n- The bigger lever is **loss-to-lease** on long-tenured units, captured on turnover (Q46).\n- Underwrite flat to 2% growth; anything higher is an upside case.\n\n### Ask back\n- What rent growth are you assuming in your numbers?\n- How far below market are your current rents?\n\n### Follow-up\n\"I'll send a rent survey for your unit types in your submarket and a three-scenario projection.\" See Q41, Q43, Q31 and Q35.","keyPoints":["USC Lusk: about 1.19%/yr growth to about $2,681 by Oct 2027; vacancy about 4.6%","Matthews H1 2026: about 1.2% YoY rent growth, 4.2% vacancy, small pipeline (1.3% of inventory)","CBRE Q2 2026: about $2,769 average rent; 2BR rents down 1.6% YoY","The market, not the 8.6% AB 1482 cap, is the binding constraint","Underwrite flat to 2%; loss-to-lease capture is the bigger lever"],"sources":[{"title":"The Registry / USC Lusk Center - Southern California Multifamily Rents to Rise Through 2027 as Housing Shortage Deepens","url":"https://lusk.usc.edu/node/12402","date":"2025-12"},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"},{"title":"CBRE Research - Ventura Multifamily Figures Q2 2026","url":"https://mktgdocs.cbre.com/2299/dec75ad2-1739-499f-b76f-559255509b56-27776285/Ventura_Multifamily_Snapshot_Q.pdf","date":"2026"}],"lastVerified":"2026-10-27","confidence":"high","verify":"Forecasts are revised annually; check for the next USC Lusk forecast (typically late in the year) and the latest CBRE and Matthews quarterly data.","drills":[{"q":"What average annual rent growth did the USC Lusk December 2025 forecast project for Ventura County through October 2027?","c":["About 1.19%","About 3.18%","About 5%","About 8.6%"],"a":0,"x":"The December 2025 forecast projected about 1.19% per year. 3.18% was the outdated 2024 forecast, and 8.6% is the AB 1482 cap."},{"q":"Why is the AB 1482 cap usually not the binding constraint on Ventura County rent increases right now?","c":["Ventura County is exempt from AB 1482","Market rent growth (about 1–2%) is well below the 8.6% cap","AB 1482 expired in 2025","Leases prohibit increases"],"a":1,"x":"With market rents growing about 1%, owners can't push increases near the 8.6% legal maximum without losing tenants."}]}},"216":{"id":216,"s":17,"t":"\"Can I add ADUs to my property, and what would they add in value?\"","a":{"summary":"Very likely yes. State law now lets most existing apartment properties add up to eight detached ADUs (no more than your existing unit count) plus conversions of unused space, often without replacing parking. Whether it adds value comes down to simple math: the new rent, capitalized, versus the all-in build cost and time.","answer":"### On the spot\nBe encouraging but precise: state law allows it, local review still applies, and value is a calculation, not a given.\n\n### What state law allows on existing multifamily lots (Q149)\n- **Detached ADUs:** under **SB 1211** (effective 2025), up to **eight**, but **not more than the number of existing units**. Lots with a *proposed* multifamily building stay at two.\n- **Conversions:** ADUs inside non-livable space (storage, garages, basements). The long-standing rule is at least one and up to 25% of existing units.\n- **Parking:** cities can't require replacement of parking removed for an ADU. Sources differ on whether that covers only uncovered spaces, so confirm locally.\n\n### Local overlays to check\n- Coastal Zone review (Q9, Q154)\n- Fire hazard zones (Q178)\n- Utility and water capacity (Q156)\n- Impact fees (Q151)\n- Oxnard treats ADUs as \"just cause only,\" not rent-stabilized\n\n### Value test (hypothetical)\nOne new one-bedroom ADU renting at about **$2,208** (Matthews H1 2026 county average 1BR asking rent):\n- NOI at a 65% margin: about **$17,200/yr**\n- Value at a 5.5% cap: about **$313,000**\n- If the all-in cost (design, permits, fees, construction, utilities) is well below that, and you can finance it, it adds value.\n\nAlso weigh lost parking or amenity value, construction disruption to existing tenants, and lender and appraiser treatment.\n\n### Ask back\n- Lot size and site plan\n- Existing unit count\n- Garages or storage space\n- Coastal or fire zone?\n- Your timeline: building now, or selling the entitlement potential?\n\n### Follow-up\n\"I'll have an ADU designer do a quick feasibility check, then show you the value with and without ADUs, including what a buyer would pay for the *potential* alone.\" See Q37 and Q149.","keyPoints":["SB 1211: up to 8 detached ADUs on existing multifamily lots, capped at the existing unit count","Conversions of non-livable space are also allowed (up to 25% of existing units)","Replacement parking generally can't be required; confirm local interpretation","Value = ADU NOI / cap rate vs. all-in cost; hypothetical about $313K value per 1BR ADU","Check Coastal Zone, fire zone, utilities and Oxnard's treatment"],"sources":[{"title":"California YIMBY - SB 1211","url":"https://cayimby.org/legislation/sb-1211/","date":"2024-09"},{"title":"LA County Planning - ADU memo on 2025 state ADU law changes","url":"https://planning.lacounty.gov/wp-content/uploads/2025/03/ADU_Memo_20241125.pdf","date":"2024-11"},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"},{"title":"AAGLA - News Alert: Oxnard Adopts New Fees for ALL Rental Properties","url":"https://members.aagla.org/news/news-alert-oxnard-adopts-new-fees-for-all-rental-properties","date":"2025-05"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Confirm current Gov. Code 66323 text (SB 1211 detached limit, 25% conversion rule, parking-replacement scope) and the specific city's ADU ordinance. ADU construction cost is not sourced; get local bids. The 65% margin is hypothetical.","drills":[{"q":"Under SB 1211, how many detached ADUs can a lot with an existing 6-unit apartment building add?","c":["2","6","8","Unlimited"],"a":1,"x":"The limit is up to eight, but not more than the number of existing units, so six."},{"q":"A new ADU nets $17,200 a year. At a 5.5% cap rate, what value does it add, roughly?","c":["$313,000","$94,600","$17,200","$1.7 million"],"a":0,"x":"$17,200 / 0.055 is about $313,000. Compare that to the all-in build cost."}]}},"217":{"id":217,"s":17,"t":"\"Will I be able to get insurance on this building?\"","a":{"summary":"Almost certainly yes, but the price and structure depend on location, age and condition. Buildings in high fire-hazard areas or with older systems may end up on the California FAIR Plan plus a wraparound policy. Let's get your broker quoting before we list so buyers and lenders see a real number early.","answer":"### On the spot\nDon't say \"no problem.\" Insurance is now a real deal risk in California. Show you know the moving parts and the fix: early quotes.\n\n### What drives insurability\n- **Fire hazard zone:** CAL FIRE's updated maps (Q178). Hillside and WUI areas such as parts of Ventura, Ojai and the Conejo face the toughest market (Q179).\n- **Building age and systems:** older electrical panels, galvanized plumbing, roof age (Q184).\n- **Claims history and water losses.**\n- **Required limits:** lenders set minimums (Q111).\n\n### The FAIR Plan backstop\n- The FAIR Plan is California's insurer of last resort.\n- In March 2025 the Insurance Commissioner approved raising FAIR Plan **commercial property limits to $20 million per building and $100 million per location** through a \"Commercial High Value\" program. Insurance Journal reported the rollout in July 2025.\n- FAIR Plan coverage is basic. Owners typically add a **difference-in-conditions (DIC)** or wrap policy for liability, water damage and other perils.\n- The Sustainable Insurance Strategy aims to bring admitted carriers back to wildfire areas, but that is still a work in progress.\n\n### Deal impact\n- Premiums feed straight into NOI. A higher quote lowers value at the same cap rate (Q205).\n- Lenders may not close without bound coverage, so a late surprise can kill escrow (Q220).\n\n### Ask back\n- Current carrier, premium and renewal date\n- Any non-renewal notices?\n- Roof age, panel type, plumbing\n- Address, to check the fire zone\n\n### Follow-up\n\"I'll connect you with two commercial insurance brokers who place Ventura County apartments. We'll get a buyer-ready quote and include it in the offering memorandum.\" See Q48 and Q180.","keyPoints":["Insurability depends on fire zone, building systems, claims and lender limits","FAIR Plan commercial limits raised to $20M per building / $100M per location (approved March 2025)","FAIR Plan is basic coverage; pair it with a DIC/wrap policy","Premiums hit NOI and value; a missing binder can kill an escrow","Get buyer-ready quotes before listing"],"sources":[{"title":"California Department of Insurance - Commissioner Lara approves major FAIR Plan expansion (Release 028-2025)","url":"https://www.insurance.ca.gov/0400-news/0100-press-releases/2025/release028-2025.cfm","date":"2025-03"},{"title":"Insurance Journal - California FAIR Plan Rolls Out Commercial High Value Policy","url":"https://amp.insurancejournal.com/news/west/2025/07/25/833310.htm","date":"2025-07"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"Carrier appetite and premium levels for Ventura County multifamily were not confirmed with data; ask two local commercial insurance brokers for current carriers and per-unit premium ranges (Q48, Q180). Confirm FAIR Plan eligibility rules for apartment buildings and the Commercial High Value program sunset date in the current Plan of Operation.","drills":[{"q":"In March 2025, California approved FAIR Plan commercial property limits of up to how much per building?","c":["$3 million","$8.4 million","$20 million","$100 million"],"a":2,"x":"The approved limits are $20 million per building and $100 million per location."},{"q":"What is the best advice to an owner worried about insurance before a sale?","c":["Get buyer-ready quotes before listing and include them in the marketing","Wait until the buyer is in escrow to get quotes","Tell buyers insurance is not a problem","Drop coverage to boost NOI"],"a":0,"x":"Early quotes let buyers and lenders underwrite real numbers and avoid late escrow failures."}]}},"218":{"id":218,"s":17,"t":"\"How much would I net after taxes and fees?\"","a":{"summary":"Let me walk you through the waterfall: sale price, minus selling costs, minus your loan payoff, gives cash at closing; then federal and California taxes on your gain, including depreciation recapture. On a long hold, taxes can be the largest deduction, which is why we should look at a 1031 or other planning with your CPA before we set a price.","answer":"### On the spot\nTeach the waterfall; don't guess the client's taxes. Use clearly labeled hypothetical numbers and send them to their CPA.\n\n### Hypothetical example (not the client's numbers)\n$4.0M sale; bought for $1.2M including improvements; $900K of depreciation taken; $1.0M loan.\n\n| Line | Amount |\n|---|---|\n| Sale price | $4,000,000 |\n| Commission (3%, illustration only; Q198) | -$120,000 |\n| County transfer tax ($1.10 per $1,000) | -$4,400 |\n| Escrow, title, other (hypothetical) | -$20,000 |\n| **Net sale proceeds** | **$3,855,600** |\n| Loan payoff | -$1,000,000 |\n| **Cash before taxes** | **$2,855,600** |\n| Gain (proceeds minus $300K adjusted basis) | $3,555,600 |\n| Federal: recapture $900K at up to 25% | -$225,000 |\n| Federal: remaining gain at 20% | -$531,120 |\n| Federal: 3.8% NIIT | -$135,113 |\n| California at top rate 13.3% (worst case) | -$472,895 |\n| **Approximate after-tax cash** | **about $1.49M** |\n\n### Local cost notes\n- Ventura County custom: the **seller pays the county documentary transfer tax** and the owner's title policy, and **escrow fees are split** (Chicago Title 2026 guide).\n- I found no city transfer taxes for Ventura County cities on the title lists I checked. Confirm with escrow for the specific city.\n\n### Tax notes (educational; refer to CPA)\n- 2026 federal long-term capital gains rates: 20% above $613,700 (married filing jointly).\n- Unrecaptured §1250 gain is taxed at up to **25%**; NIIT is **3.8%**.\n- California has no lower capital-gains rate; gains are taxed as ordinary income.\n- Alternatives: 1031, installment sale, DST or 721 exchange, or holding for step-up (Q172–Q177).\n\n### Ask back\n- Purchase price and date, and capital improvements\n- Depreciation taken (prior returns)\n- Loan payoff and prepayment penalty\n- Filing status\n- Interest in a 1031?\n\n### Follow-up\n\"I'll send this net sheet with your real numbers to your CPA so they can run the tax side precisely.\" See Q171 and Q176.","keyPoints":["Waterfall: price, minus selling costs, minus loan payoff, minus federal and state tax","Ventura County custom: seller pays the $1.10/$1,000 county transfer tax and owner's title policy; escrow is split","Federal: up to 25% on depreciation recapture, 15/20% on remaining gain, plus 3.8% NIIT","California taxes gains as ordinary income; on long holds taxes can exceed all other costs","Use labeled hypotheticals; send the real net sheet to the CPA and consider a 1031"],"sources":[{"title":"Chicago Title - California Customary Practices Guide 2026","url":"https://page.fnf.com/rs/393-REY-847/images/CTT_CA-CustomaryPracticesGuide_2026.pdf?version=1","date":"2026-06"},{"title":"WFG National Title - City Transfer Tax List","url":"https://wfgtitle.com/wp-content/uploads/2021/03/City-Transfer-Tax-List.pdf","date":"2021-03"},{"title":"Bradford Tax Institute - 2026 Capital Gains Rates","url":"https://bradfordtaxinstitute.com/Free_Resources/2026-Capital-Gains-Rates.aspx","date":"2026"},{"title":"IRS - FS-2008-18, Like-Kind Exchanges Under IRC Section 1031","url":"https://www.irs.gov/pub/irs-news/fs-08-18.pdf","date":"2008-02"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The commission, escrow/title amount and 13.3% California rate are illustrative. California brackets are progressive, and the 13.3% top rate (including the 1% mental health surcharge) should be confirmed with FTB or a CPA. Also confirm any California real estate withholding at closing (FTB Form 593) and any city transfer tax with escrow. Federal 2026 thresholds are from a secondary source; confirm against the IRS Revenue Procedure.","drills":[{"q":"What is the Ventura County documentary transfer tax on a $4,000,000 sale, and who customarily pays it?","c":["$4,400, paid by the buyer","$4,400, paid by the seller","$44,000, split","$1,100, paid by the seller"],"a":1,"x":"$1.10 per $1,000 x 4,000 = $4,400. The Chicago Title 2026 guide lists the seller as customary payer in Ventura County."},{"q":"What is the maximum federal rate on unrecaptured Section 1250 gain (depreciation on real property)?","c":["15%","20%","25%","37%"],"a":2,"x":"Unrecaptured Section 1250 gain is capped at 25%, before the 3.8% NIIT and state tax."}]}},"219":{"id":219,"s":17,"t":"\"What did the building down the street sell for?\"","a":{"summary":"I'll pull the recorded sale and tell you the price, date, price per unit and, where I can confirm it, the cap rate. But a neighbor's price only matters after we adjust for unit mix, condition, rents and terms, so let me show you how it compares to your building.","answer":"### On the spot\n- If you know the comp, give the **verified facts** and their source.\n- If you don't, say so and commit to a turnaround: \"I'll have it to you by tomorrow.\"\n- Never guess.\n- Never reveal confidential details from a deal you were involved in beyond what's public or what your client has authorized.\n\n### Where the facts come from (Q202)\n- Recorded deed and county records: date, buyer and seller entities.\n- **Documentary transfer tax** on the deed implies the price. At $1.10 per $1,000, a $4,400 tax suggests about $4.0M. An assumed loan can reduce the taxable amount, so confirm.\n- CoStar, MLS and broker press releases for cap rate, GRM, unit mix and condition.\n\n### How to adjust the comp\n| Factor | Why it matters |\n|---|---|\n| Unit count and mix | Two-bedrooms and larger units command more per unit |\n| Vintage and condition | Renovations, systems, SB 721 status |\n| In-place vs. market rents | Below-market rents lower price per unit and raise the cap rate |\n| Rent control | Oxnard pre-1995 and Ojai vs. AB 1482 only |\n| Terms | 1031 urgency, seller financing, off-market, all-cash |\n\n### Worked example\nMonte Vista in Ventura (52 units, 1972, $12.325M) works out to **$237,019/unit, about $282/sf, a 5.78% in-place cap and a 9.77 GRM**. Rents were about 8% below market.\n\nCompared with the about $306K/unit county average (Matthews H1 2026), the gap is explained by vintage, a one- and two-bedroom mix, and the rent upside the buyer bought. A newer 8-unit building of mostly two-bedrooms at market rents should not be priced off $237K/unit without adjustment.\n\n### Ask back\n- Which building, and what do you think it sold for?\n- How is your building different (size, rents, condition)?\n\n### Follow-up\n\"I'll send you a comp grid with that sale and four others, adjusted to your building, plus my read on where yours would trade.\" See Q60, Q68 and Q171.","keyPoints":["Give verified facts with a source or commit to a fast follow-up; never guess","Transfer tax on the deed implies price: $1.10 per $1,000 (assumed loans can reduce it)","Adjust comps for unit mix, vintage, in-place vs. market rent, rent control and terms","Monte Vista: $237,019/unit, 5.78% in-place cap, 9.77 GRM, rents about 8% below market","Protect confidential deal details; offer an adjusted comp grid"],"sources":[{"title":"Radius Commercial Real Estate - Monte Vista Townhomes Sells for $12.325M in Ventura's Largest Commercial Real Estate Sale of 2026","url":"https://www.radiusgroup.com/news-alert-monte-vista-townhomes-sells-for-12-325m-in-venturas-largest-commercial-real-estate-sale-of-2026/","date":"2026-07"},{"title":"Matthews - Ventura County Multifamily Market Report H1 2026","url":"https://www.matthews.com/insights/ventura-county-multifamily-market-report-h1-2026-rents-vacancy-sales-trends","date":"2026-08"},{"title":"WFG National Title - City Transfer Tax List","url":"https://wfgtitle.com/wp-content/uploads/2021/03/City-Transfer-Tax-List.pdf","date":"2021-03"},{"title":"Chicago Title - California Customary Practices Guide 2026","url":"https://page.fnf.com/rs/393-REY-847/images/CTT_CA-CustomaryPracticesGuide_2026.pdf?version=1","date":"2026-06"}],"lastVerified":"2026-10-27","confidence":"high","verify":"When backing into price from transfer tax, confirm whether any loan was assumed and whether a city tax also applies. Always verify comp details in CoStar or with the listing broker before quoting.","drills":[{"q":"A deed in Ventura County shows $3,300 of county documentary transfer tax with no assumed loan. What is the approximate sale price?","c":["$330,000","$33 million","$3.3 million","$3.0 million"],"a":3,"x":"$3,300 / $1.10 x $1,000 = $3,000,000."},{"q":"Why shouldn't a newer 8-unit building of mostly two-bedrooms be priced directly off Monte Vista's $237K/unit?","c":["Monte Vista was in Oxnard","Monte Vista sold all cash","Comps can't be used across cities","Monte Vista was older, mostly one- and two-bedroom with one bath, and had rents about 8% below market"],"a":3,"x":"Vintage, unit mix and in-place rent differences must be adjusted before using a comp."}]}},"220":{"id":220,"s":17,"t":"\"How long will it take to sell, and what could kill the deal?\"","a":{"summary":"Plan on several months from listing to closing, longer if your buyer needs a loan or is in a 1031. Most deals die over financing, inspection surprises, insurance, or rent roll problems, so we'll clear those up before we go to market.","answer":"### On the spot\nGive a realistic, documented example rather than an optimistic promise. Then name the deal-killers and how you'll prevent each.\n\n### A documented 2026 timeline\n**Monte Vista (Ventura, 52 units):**\n- Launched mid-January\n- Call for offers February 3; four offers\n- Closed **July 28, 2026**\n\nThat is about **six months to close**, in a market its brokers described as thin, with rates rising during escrow.\n\nLiquidity is limited. CBRE/RCA recorded no qualifying county multifamily sales in Q2 2026, and NAI showed 2025 volume down about 50%. Smaller deals with ready buyers can move faster. Check current days-on-market data (Q64).\n\n### Phases\n1. Prep: rent roll, T-12, inspections, insurance quote, BOV\n2. Marketing and call for offers\n3. Negotiation and contract\n4. Due diligence: inspections, estoppels, records\n5. Financing and appraisal, then close. 1031 buyers work against their own 45/180-day clocks.\n\n### What kills deals, and the fix\n| Deal-killer | Prevention |\n|---|---|\n| Financing falls short as rates move (Q108, Q115) | Vet lender pre-approval; price with a debt-service-coverage cushion |\n| Inspection surprises: plumbing, panels, roofs, SB 721 balconies (Q184, Q186) | Pre-listing inspections and disclosures |\n| Unpermitted units (Q185) | Disclose and price them up front |\n| Insurance quote shock (Q217) | Quote before listing |\n| Rent roll or estoppel mismatches; Oxnard registration gaps | Audit leases and registrations early |\n| Buyer retrade or no proof of funds (Q93) | Screen buyers; deposit goes non-refundable after contingencies |\n| Title or estate authority issues (Q99) | Order a preliminary title report and trustee documents early |\n\n### Ask back\n- Any hard deadline (1031 purchase, loan maturity, estate)?\n- Known issues we should disclose up front?\n\n### Follow-up\n\"Let me draft a week-by-week sale calendar and a pre-market checklist so nothing surprises us in escrow.\" See Q63, Q64 and Q186.","keyPoints":["Documented example: Monte Vista launched mid-January and closed July 28, 2026, about six months","Liquidity is thin (no RCA-tracked county sales in Q2 2026; 2025 volume down about 50%)","Top deal-killers: financing, inspections (SB 721, systems), unpermitted units, insurance, rent roll and estoppels, retrades","Prevent them with pre-listing inspections, insurance quotes, lease audits and buyer vetting","Offer a week-by-week sale calendar"],"sources":[{"title":"Radius Commercial Real Estate - Monte Vista Townhomes Sells for $12.325M in Ventura's Largest Commercial Real Estate Sale of 2026","url":"https://www.radiusgroup.com/news-alert-monte-vista-townhomes-sells-for-12-325m-in-venturas-largest-commercial-real-estate-sale-of-2026/","date":"2026-07"},{"title":"CBRE Research - Ventura Multifamily Figures Q2 2026","url":"https://mktgdocs.cbre.com/2299/dec75ad2-1739-499f-b76f-559255509b56-27776285/Ventura_Multifamily_Snapshot_Q.pdf","date":"2026"},{"title":"NAI Capital - Multifamily Market Outlook, Ventura County Q4 2025","url":"https://www2.naicapital.com/wp-content/uploads/sites/2/VC-Mulifamily-Market-Outlook-Q4_2025.pdf","date":"2026"}],"lastVerified":"2026-10-27","confidence":"medium","verify":"The timeline rests on one documented 2026 deal. Pull county-wide average days on market and escrow length for 5-50 unit sales from CoStar or the MLS (Q64) before quoting a typical range.","drills":[{"q":"In the Monte Vista example, about how long was it from marketing launch to closing?","c":["About 3 weeks","About 6 weeks","About 6 months","About 18 months"],"a":2,"x":"Launched mid-January 2026 and closed July 28, 2026, about six months."},{"q":"Which step best prevents a late-escrow insurance surprise?","c":["Waiting for the buyer's lender to order coverage","Getting buyer-ready insurance quotes before listing","Lowering the price","Skipping the property inspection"],"a":1,"x":"Quoting insurance before listing lets buyers and lenders underwrite real premiums early."}]}}},"glossary":[{"term":"Cap rate (capitalization rate)","def":"Net operating income divided by price. A $3,000,000 building with $150,000 NOI trades at a 5.0% cap. Lower cap rate means a higher price for the same income.","see":[59,62,205]},{"term":"NOI (net operating income)","def":"Gross income (rent plus other income, less vacancy and credit loss) minus operating expenses. Excludes debt service, depreciation, and capital expenditures.","see":[47,205]},{"term":"GRM (gross rent multiplier)","def":"Price divided by annual gross scheduled rent. Common shorthand for small apartment buildings where expense data is unreliable. A $2,400,000 price on $160,000 of rent is a 15.0 GRM.","see":[61]},{"term":"Price per unit","def":"Sale price divided by the number of units. The most-quoted pricing metric for multifamily, alongside price per square foot.","see":[60,68]},{"term":"Loss-to-lease","def":"The gap between in-place rents and current market rents. Long-held, rent-capped buildings often carry large loss-to-lease, which buyers value as upside but can only capture at turnover or within allowed increases.","see":[46,70]},{"term":"Concessions","def":"Incentives such as free rent or reduced deposits used to lease units. Effective rent is face rent minus the value of concessions spread across the lease term.","see":[45]},{"term":"Value-add","def":"A strategy of buying underperforming property, renovating or repositioning it, and raising rents or cutting expenses to increase NOI and value.","see":[54,69,88]},{"term":"Class A / B / C","def":"Informal quality tiers. Class A is newer, amenitized product; Class B is older but well kept; Class C is older stock, often pre-1980, with deferred maintenance and lower rents.","see":[42]},{"term":"RUBS (ratio utility billing system)","def":"Allocating a master-metered utility bill to tenants by formula (unit size, occupants). California regulates how it is disclosed and billed.","see":[50]},{"term":"DSCR (debt service coverage ratio)","def":"NOI divided by annual debt service. Lenders typically require 1.20x to 1.35x on multifamily; at high rates, DSCR rather than LTV often caps the loan size.","see":[108]},{"term":"LTV (loan-to-value)","def":"Loan amount divided by property value. Multifamily lenders commonly cap at 55% to 75% depending on lender type and coverage.","see":[108]},{"term":"Agency debt","def":"Loans sold to or guaranteed by Fannie Mae or Freddie Mac. Small balance programs serve 5+ unit properties with fixed-rate terms and prepayment structures.","see":[105]},{"term":"Yield maintenance / step-down prepayment","def":"Prepayment penalty structures. Yield maintenance compensates the lender for lost interest; a step-down declines on a schedule (e.g., 5-4-3-2-1%). Both shape when owners can sell.","see":[114]},{"term":"Bid-ask spread","def":"The gap between what sellers ask and what buyers will pay. A wide spread means low transaction volume until one side moves.","see":[63]},{"term":"Retrade","def":"A buyer renegotiating price or terms after going into contract, usually citing inspection findings. Retrade history is a key factor in choosing among offers.","see":[93,186]},{"term":"1031 exchange","def":"A tax-deferred swap of investment real estate under IRC Section 1031. The investor must identify replacement property within 45 days and close within 180 days, using a qualified intermediary.","see":[85,172,212]},{"term":"DST (Delaware statutory trust)","def":"A passive, fractional ownership vehicle that qualifies as like-kind replacement property for a 1031 exchange. Popular with owners who want to stop managing property.","see":[173]},{"term":"721 exchange (UPREIT)","def":"Contributing property to a REIT's operating partnership in exchange for OP units under IRC Section 721, deferring gain. Often a later step after a DST.","see":[174]},{"term":"Depreciation recapture","def":"Gain attributable to depreciation taken, taxed at up to 25% federally (unrecaptured Section 1250 gain) when the property is sold rather than exchanged.","see":[176]},{"term":"Stepped-up basis","def":"At death, inherited property's tax basis resets to fair market value, erasing deferred gain and recapture. A major reason older owners hold rather than sell.","see":[177,209]},{"term":"Cost segregation","def":"An engineering study that reclassifies parts of a building into shorter depreciation lives (5, 7, 15 years), accelerating deductions, especially when bonus depreciation applies.","see":[175]},{"term":"Prop 13","def":"California's 1978 property tax limit: base tax of 1% of assessed value, with assessed value rising no more than 2% a year until a change in ownership triggers reassessment.","see":[128,170]},{"term":"Prop 19","def":"The 2020 measure that narrowed the parent-child reassessment exclusion (from February 16, 2021, it applies mainly to a family home that the child uses as a primary residence) and expanded base-year transfers for older and disabled homeowners. Rental property passed to children is generally reassessed.","see":[128,209]},{"term":"Documentary transfer tax","def":"A tax on recorded transfers of real property. Ventura County's rate is $1.10 per $1,000 of value; some California cities add their own.","see":[171]},{"term":"AB 1482 (Tenant Protection Act)","def":"California's 2019 statewide rent cap and just-cause law: annual increases limited to 5% plus regional CPI, never more than 10%, with exemptions such as buildings less than 15 years old and qualifying single-family homes and condos with proper notice. Currently set to sunset January 1, 2030.","see":[116,117,206]},{"term":"Just cause","def":"A rule that a landlord may end a tenancy only for listed at-fault reasons (nonpayment, breach, nuisance) or no-fault reasons (owner move-in, withdrawal from market, substantial remodel), with relocation pay for no-fault terminations.","see":[116,118,207]},{"term":"SB 567","def":"A 2023 law, effective April 1, 2024, that tightened AB 1482's no-fault just-cause terminations, especially substantial remodel and owner move-in, and added penalties for violations.","see":[118]},{"term":"Costa-Hawkins Rental Housing Act","def":"A 1995 state law that bars local rent control on single-family homes, condos, and buildings first occupied after February 1, 1995, and requires vacancy decontrol (rents reset to market when a unit turns over).","see":[119,161]},{"term":"Ellis Act","def":"A 1985 state law letting owners exit the rental business by withdrawing all units from the market, subject to notice, relocation, and re-rental restrictions.","see":[120]},{"term":"AB 12 security deposit cap","def":"Since July 1, 2024, most California landlords may collect no more than one month's rent as a security deposit. Small landlords meeting the statute's ownership limits may collect two months.","see":[121]},{"term":"SB 721","def":"California's balcony law requiring periodic inspection of exterior elevated elements (balconies, decks, stairways) on buildings with three or more units.","see":[126]},{"term":"FEHA","def":"California's Fair Employment and Housing Act, which bars housing discrimination on protected characteristics, including source of income (housing vouchers).","see":[122,129]},{"term":"RHNA","def":"Regional Housing Needs Allocation. The state assigns each city a number of homes to plan for by income level for each eight-year housing element cycle. Ventura County is in the SCAG region's 6th cycle (2021–2029).","see":[40,155]},{"term":"Housing element","def":"The part of each city's general plan that shows how it will accommodate its RHNA, including sites rezoned for housing. It must be certified by the state housing department (HCD).","see":[40,155]},{"term":"Builder's remedy","def":"A state Housing Accountability Act provision that limits a city's ability to deny qualifying housing projects while its housing element is out of compliance.","see":[148]},{"term":"Density bonus","def":"State law granting extra units, plus concessions and waivers, to projects that include affordable housing.","see":[147]},{"term":"SB 9","def":"A 2021 law allowing lot splits and up to two units per lot on most single-family parcels, ministerially.","see":[147]},{"term":"SB 35 / SB 423","def":"Streamlined, ministerial approval for qualifying multifamily projects in jurisdictions behind on their RHNA. SB 423 extended and expanded SB 35.","see":[147]},{"term":"ADU / JADU","def":"Accessory dwelling unit / junior accessory dwelling unit. State law requires cities to allow ADUs ministerially, including on existing multifamily lots, where garages, storage areas, and detached space can be converted or added.","see":[37,149,216]},{"term":"SOAR","def":"Save Open-Space and Agricultural Resources: voter initiatives first passed in 1998 and renewed in 2016 through 2050. They require a public vote to convert farmland or open space to urban uses in the county and most of its cities.","see":[144]},{"term":"CURB","def":"City Urban Restriction Boundary: each SOAR city's voter-approved urban growth line. Development outside it generally needs a public vote.","see":[145]},{"term":"Coastal Zone","def":"Land within the California Coastal Act's boundary, where development needs a coastal development permit from the city (under a certified Local Coastal Program) or the Coastal Commission.","see":[9,154]},{"term":"FHSZ (Fire Hazard Severity Zone)","def":"CAL FIRE's maps rating wildfire hazard as moderate, high, or very high. The maps drive building standards, disclosures, and insurance underwriting.","see":[178]},{"term":"FAIR Plan","def":"California's insurer of last resort, offering basic fire coverage when the standard market will not. It is often paired with a 'difference in conditions' policy for other perils.","see":[180,217]},{"term":"Soft-story","def":"Buildings with a weak ground floor, typically tuck-under parking, that are vulnerable to earthquake collapse. Some California cities mandate retrofits.","see":[142,183]},{"term":"LIHTC","def":"Low-Income Housing Tax Credit. The main federal subsidy for affordable rental housing, awarded in California by CTCAC and requiring long-term income and rent restrictions.","see":[188,189]},{"term":"Housing Choice Voucher (Section 8)","def":"A federal rent subsidy administered by local housing authorities. Tenants pay about 30% of income and the voucher covers the rest, up to the payment standard.","see":[57,187]},{"term":"BAH (Basic Allowance for Housing)","def":"A tax-free housing allowance paid to service members, set by ZIP code, rank, and dependency status. It shapes rents near Naval Base Ventura County.","see":[15,191]},{"term":"Measure ULA","def":"The City of Los Angeles transfer tax adopted in 2022 that adds a surcharge on sales above roughly $5 million. It has pushed some LA capital toward Ventura County.","see":[78,164]},{"term":"BOV (broker opinion of value)","def":"A broker's written estimate of a property's market value, based on rent roll, expenses, and comparable sales. It is the standard first deliverable to a prospective seller.","see":[203]}]}</script>
<script>
(() => {
'use strict';

/* ---------- Content ---------- */
const C = JSON.parse(document.getElementById('content').textContent);
const SECTIONS = C.sections;
const SEC = Object.fromEntries(SECTIONS.map(s => [s.n, s]));
const QS = C.q;
const ALL = SECTIONS.flatMap(s => s.ids);
const GLOSSARY = C.glossary || [];
const WEEKS = [
  { n: 1, title: 'The map and the economy', sections: [1, 2] },
  { n: 2, title: 'Supply and operations', sections: [3, 4] },
  { n: 3, title: 'Pricing and debt', sections: [5, 8] },
  { n: 4, title: 'Buyers and sellers', sections: [6, 7] },
  { n: 5, title: 'The rules: state and local', sections: [9, 10] },
  { n: 6, title: 'Land use and what is coming', sections: [11, 12] },
  { n: 7, title: 'Taxes, risk, and affordable housing', sections: [13, 14, 15] },
  { n: 8, title: 'Brokerage and client-ready answers', sections: [16, 17] },
];
const weekIds = w => WEEKS[w - 1].sections.flatMap(s => SEC[s].ids);
const LEVELS = ['Not started', 'Read', 'Can explain', 'Mastered'];
const DAY = 864e5;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const sod = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const q = id => QS[String(id)];
const hasA = id => !!(q(id) && q(id).a);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}

/* Minimal Markdown for drafted answers: headings, lists, tables, links, bold, italic, code, Q-references. */
function inl(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
  h = h.replace(/(^|[\s(;,])Q(\d{1,3})\b/g, (m, pre, n) => QS[n] ? `${pre}<a class="qref" href="#q${n}">Q${n}</a>` : m);
  return h;
}
const isBlockStart = l => /^(#{1,4}\s|\s*\||\s*[-*•]\s+|\s*\d+[.)]\s+)/.test(l);
function md(src) {
  if (!src) return '';
  const L = String(src).replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    let m;
