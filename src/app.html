<style>
/* Layout: study-desk app shell. Left rail on desktop, bottom tab bar on phones; one working column of content. */
:root {
  --bg: #eef3f2;
  --surface: #ffffff;
  --surface-2: #e3ebe9;
  --ink: #10252a;
  --ink-2: #4b5f63;
  --ink-3: #75898c;
  --line: #cfdcd9;
  --accent: #0c5a61;
  --accent-ink: #ffffff;
  --accent-soft: #d4e8e7;
  --lemon: #d9a91c;
  --lemon-soft: #f6ead0;
  --good: #23764a;
  --good-soft: #d9efe1;
  --warn: #a8670f;
  --warn-soft: #f6e6cc;
  --bad: #ad3434;
  --bad-soft: #f6dcdc;
  --heat-0: #e3ebe9;
  --heat-1: #a9d0cc;
  --heat-2: #4f9e9a;
  --heat-3: #0c5a61;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1618; --surface: #132124; --surface-2: #1a2c30; --ink: #e1ebe9; --ink-2: #a2b5b6; --ink-3: #75898b;
    --line: #26393d; --accent: #5cbcb6; --accent-ink: #062024; --accent-soft: #163a3c; --lemon: #e7bf4c; --lemon-soft: #3a3118;
    --good: #62c48e; --good-soft: #173528; --warn: #e2a64c; --warn-soft: #3a2b15; --bad: #e57a7a; --bad-soft: #3d1d1d;
    --heat-0: #1a2c30; --heat-1: #1f4f50; --heat-2: #2f8580; --heat-3: #5cbcb6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1618; --surface: #132124; --surface-2: #1a2c30; --ink: #e1ebe9; --ink-2: #a2b5b6; --ink-3: #75898b;
  --line: #26393d; --accent: #5cbcb6; --accent-ink: #062024; --accent-soft: #163a3c; --lemon: #e7bf4c; --lemon-soft: #3a3118;
  --good: #62c48e; --good-soft: #173528; --warn: #e2a64c; --warn-soft: #3a2b15; --bad: #e57a7a; --bad-soft: #3d1d1d;
  --heat-0: #1a2c30; --heat-1: #1f4f50; --heat-2: #2f8580; --heat-3: #5cbcb6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; }
h2 { font-size: 20px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

/* Shell */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; padding-block: 28px; display: flex; flex-direction: column; gap: 22px; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font: 750 19px/1.1 var(--display); letter-spacing: -0.01em; }
.brand span { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--ink); }
.nav .grp { margin-top: 10px; padding: 0 10px 4px; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; margin-top: 4px; }
.dot.live { background: var(--good); }
.dot.busy { background: var(--lemon); }
.dot.off { background: var(--bad); }
.view { padding-block: 32px 80px; min-width: 0; }
.view > .stack-lg { max-width: 860px; }
.tabbar { display: none; }
.mhead { display: none; }
.sheet { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; align-items: flex-end; }
.sheet .nav { background: var(--surface); width: 100%; border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rail { display: none; }
  .view { padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .mhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 14px; }
  .mhead b { font: 750 17px/1.1 var(--display); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); text-decoration: none; background: none; border: 0; border-radius: 8px; }
  .tabbar .on { color: var(--accent); background: var(--accent-soft); }
  .tabbar svg { width: 20px; height: 20px; }
}

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.panel.tint { background: var(--accent-soft); border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/1 var(--mono); padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.m1 { background: var(--accent-soft); color: var(--ink); }
.chip.m2 { background: var(--heat-2); color: var(--accent-ink); }
.chip.m3 { background: var(--accent); color: var(--accent-ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 8px 12px; color: var(--ink-2); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a.on { color: var(--ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* Bars and heat */
.bar { display: flex; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .b1 { background: var(--heat-1); }
.bar .b2 { background: var(--heat-2); }
.bar .b3 { background: var(--heat-3); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tide { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.tide .wk { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tide .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.tide .d { aspect-ratio: 1; max-width: 100%; border-radius: 3px; background: var(--heat-0); }
.tide .d.l1 { background: var(--heat-1); } .tide .d.l2 { background: var(--heat-2); } .tide .d.l3 { background: var(--heat-3); }
.tide .d.fut { background: transparent; border: 1px dashed var(--line); }
.tide .d.today { outline: 2px solid var(--lemon); outline-offset: 1px; }
.tide .wk .eyebrow { font-size: 10px; }
.tide .wk.cur .eyebrow { color: var(--ink); }
@media (max-width: 560px) { .tide { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 12px; } }

/* Stats */
.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.stat b { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat.hot b { color: var(--lemon); }
a.stat:hover { border-color: var(--accent); }

/* Lists */
.qlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.qrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 14px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.qrow:first-child { border-top: 0; }
.qrow:hover { background: var(--surface-2); }
.qrow .id { font: 500 13px/1.5 var(--mono); color: var(--accent); }
.qrow .meta { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .qrow { grid-template-columns: 44px minmax(0, 1fr); } .qrow .meta { grid-column: 2; justify-content: flex-start; } }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 6px; }
.secrow { display: grid; grid-template-columns: minmax(0, 1fr) 140px 54px; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.secrow:first-child { border-top: 0; }
.secrow .n { font: 500 12px var(--mono); color: var(--ink-3); margin-right: 6px; }
@media (max-width: 560px) { .secrow { grid-template-columns: minmax(0, 1fr) 80px 44px; font-size: 14px; } }

/* Prose */
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; }
.prose h3, .prose h4 { margin-top: 8px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.prose code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.prose a.qref { font-family: var(--mono); font-size: 13px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface-2); border-top: 0; font-weight: 650; }
.summary { font-size: 17px; line-height: 1.5; padding: 16px 18px; border-radius: var(--radius); background: var(--accent-soft); max-width: 68ch; }
.kp { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.kp li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.kp li::before { content: "▸"; color: var(--accent); font-weight: 700; }
.sources { margin: 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.verify { border-left: 3px solid var(--warn); padding: 10px 14px; background: var(--warn-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.verify.ok { border-left-color: var(--good); background: var(--good-soft); }

/* Practice */
.flash { min-height: 260px; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.flash .qtext { font: 600 21px/1.35 var(--display); text-wrap: pretty; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 10px 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 650; }
.rate button small { font: 400 11px var(--mono); color: var(--ink-2); }
.rate .r0 { border-color: var(--bad); } .rate .r3 { border-color: var(--good); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; text-align: left; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.45; }
.choice .k { font: 500 12px/1.6 var(--mono); color: var(--ink-3); }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.ok { border-color: var(--good); background: var(--good-soft); }
.choice.no { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; color: var(--ink); }
.explain { font-size: 14px; padding: 10px 14px; border-radius: 8px; background: var(--surface-2); }
.client { font: 500 19px/1.4 var(--display); padding: 18px 20px; border-radius: 14px 14px 14px 4px; background: var(--surface); border: 1px solid var(--line); max-width: 60ch; }
.grade { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; align-items: start; }
.score { font: 750 44px/1 var(--display); font-variant-numeric: tabular-nums; }
.score small { font: 500 12px var(--mono); display: block; color: var(--ink-2); margin-top: 6px; letter-spacing: .04em; text-transform: uppercase; }
@media (max-width: 560px) { .grade { grid-template-columns: 1fr; gap: 10px; } }
.progress-line { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.progress-line i { display: block; height: 100%; background: var(--accent); }
.thinking { color: var(--ink-2); font-style: italic; }
.out { white-space: normal; }

/* Weeks */
.week { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.week.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.week .wn { font: 750 40px/1 var(--display); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.week.cur .wn { color: var(--accent); }
@media (max-width: 560px) { .week { grid-template-columns: 1fr; gap: 8px; } .week .wn { font-size: 28px; } }

table.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.hist th, table.hist td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); }
table.hist th { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-top: 0; }

.notice { padding: 12px 14px; border-radius: 9px; background: var(--lemon-soft); font-size: 14px; }
.empty { padding: 28px 20px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); display: flex; flex-direction: column; gap: 12px; align-items: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); }
@media (min-width: 901px) { #toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
.gl dt { font: 650 15px var(--display); }
.gl dd { margin: 2px 0 14px; color: var(--ink); max-width: 68ch; }
.kbd { font: 500 11px var(--mono); padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  .view > * { animation: rise .22s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

  <aside class="rail" aria-label="Main">

<script id="content" type="application/json">__CONTENT__</script>
<script>
(() => {
'use strict';

/* ---------- Content ---------- */
const C = JSON.parse(document.getElementById('content').textContent);
const SECTIONS = C.sections;
const SEC = Object.fromEntries(SECTIONS.map(s => [s.n, s]));
const QS = C.q;
const ALL = SECTIONS.flatMap(s => s.ids);
const GLOSSARY = C.glossary || [];
const WEEKS = [
  { n: 1, title: 'The map and the economy', sections: [1, 2] },
  { n: 2, title: 'Supply and operations', sections: [3, 4] },
  { n: 3, title: 'Pricing and debt', sections: [5, 8] },
  { n: 4, title: 'Buyers and sellers', sections: [6, 7] },
  { n: 5, title: 'The rules: state and local', sections: [9, 10] },
  { n: 6, title: 'Land use and what is coming', sections: [11, 12] },
  { n: 7, title: 'Taxes, risk, and affordable housing', sections: [13, 14, 15] },
  { n: 8, title: 'Brokerage and client-ready answers', sections: [16, 17] },
];
const weekIds = w => WEEKS[w - 1].sections.flatMap(s => SEC[s].ids);
const LEVELS = ['Not started', 'Read', 'Can explain', 'Mastered'];
const DAY = 864e5;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const sod = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const q = id => QS[String(id)];
const hasA = id => !!(q(id) && q(id).a);

function toast(msg) {

}

/* Minimal Markdown for drafted answers: headings, lists, tables, links, bold, italic, code, Q-references. */
function inl(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
  h = h.replace(/(^|[\s(;,])Q(\d{1,3})\b/g, (m, pre, n) => QS[n] ? `${pre}<a class="qref" href="#q${n}">Q${n}</a>` : m);
  return h;
}
const isBlockStart = l => /^(#{1,4}\s|\s*\||\s*[-*•]\s+|\s*\d+[.)]\s+)/.test(l);
function md(src) {
  if (!src) return '';
  const L = String(src).replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const lv = m[1].length <= 2 ? 3 : 4; out.push(`<h${lv}>${inl(m[2])}</h${lv}>`); i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      const sep = r => r.every(c => /^:?-{2,}:?$/.test(c));
      let head = null; if (rows.length > 1 && sep(rows[1])) { head = rows[0]; rows.splice(0, 2); }
      const body = rows.filter(r => !sep(r));
      out.push('<div class="tbl"><table>' + (head ? '<thead><tr>' + head.map(c => `<th>${inl(c)}</th>`).join('') + '</tr></thead>' : '') +
        '<tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${inl(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*[-*•]\s+/.test(l)) { const it = []; while (i < L.length && /^\s*[-*•]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/, '')); out.push('<ul>' + it.map(x => `<li>${inl(x)}</li>`).join('') + '</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { const it = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/, '')); out.push('<ol>' + it.map(x => `<li>${inl(x)}</li>`).join('') + '</ol>'); continue; }
    const para = []; while (i < L.length && L[i].trim() && !(para.length && isBlockStart(L[i]))) para.push(L[i++]);
    out.push(`<p>${inl(para.join(' '))}</p>`);
  }
  return out.join('');
}

/* ---------- State and storage ---------- */
const S = { progress: {}, tests: {}, checkins: {}, meta: {}, activity: {}, mode: 'connecting', loaded: new Set() };
let db = null, sample = null, downloads = null;
const settings = () => S.meta.settings || {};
const prog = id => S.progress['q' + id] || {};

const writers = new Map();
let inflight = 0; const waiters = [];
async function slot() { if (inflight < 4) { inflight++; return; } await new Promise(r => waiters.push(r)); inflight++; }
function unslot() { inflight--; const w = waiters.shift(); if (w) w(); }
function busy() { for (const w of writers.values()) if (w.busy || w.next) return true; return false; }

function save(path, body) {
  dirty.delete(path);
  if (!db || S.mode !== 'live') { renderSync(); return; }
  let w = writers.get(path); if (!w) { w = { busy: false, next: null }; writers.set(path, w); }
  w.next = body; if (!w.busy) pump(path, w);
  renderSync();
}
async function pump(path, w) {
  w.busy = true;
  while (w.next) {
    const body = w.next; w.next = null;
    await slot();
    try {
      for (let attempt = 0; ; attempt++) {
        try { await db.doc(path).set(body); break; }
        catch (e) {
          if ((e.code === 'unavailable' || e.code === 'resource_exhausted') && attempt < 3) { await sleep(700 * (attempt + 1) + Math.random() * 600); continue; }
          if (e.code === 'revoked') { S.mode = 'off'; }
          else if (e.code === 'quota_exceeded') toast('Storage is full. Export a backup from Setup and remove old tests.');
          else toast('A change did not save. Check your connection; it will retry on your next change.');
          break;
        }
      }
    } finally { unslot(); }
  }
  w.busy = false; renderSync();
}
const dirty = new Set();
function pending(path) { const w = writers.get(path); return dirty.has(path) || !!(w && (w.busy || w.next)); }

function setProg(id, patch) {
  const k = 'q' + id; const next = { ...prog(id), ...patch, u: Date.now() };
  S.progress[k] = next; save('progress/' + k, next); bump();
}
function setDoc(coll, key, body) { S[coll][key] = body; save(coll + '/' + key, body); }

let actTimer = null;
function bump() {
  const k = today(); const cur = S.activity[k] || { n: 0 };
  S.activity[k] = { n: (cur.n || 0) + 1 };
  dirty.add('activity/' + k);
  clearTimeout(actTimer); actTimer = setTimeout(() => save('activity/' + k, S.activity[k]), 1500);
}

function subscribe() {
  const colls = ['progress', 'tests', 'checkins', 'meta', 'activity'];
  for (const name of colls) {
    db.collection(name).onSnapshot(snap => {
      let changed = !S.loaded.has(name);
      for (const ch of snap.docChanges()) {
        const id = ch.doc.id; const path = name + '/' + id;
        if (pending(path)) continue;
        if (ch.type === 'removed') { if (S[name][id]) { delete S[name][id]; changed = true; } continue; }
        const d = ch.doc.data();
        if (stable(d) !== stable(S[name][id])) { S[name][id] = JSON.parse(JSON.stringify(d)); changed = true; }
      }
      S.loaded.add(name);
      if (changed) softRender();
      renderSync();
    }, e => {
      S.mode = e.code === 'revoked' ? 'off' : 'error'; renderSync();
    });
  }
}
const ready = () => S.mode !== 'live' || S.loaded.size >= 5;

async function initCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') { S.mode = 'off'; renderSync(); render(); return; }
  window.claude.use('sample').then(s => { sample = s; softRender(); }).catch(() => {});
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { S.mode = 'off'; renderSync(); render(); return; }
  S.mode = 'live'; renderSync(); subscribe();
}

/* ---------- Plan math ---------- */
function plan() {
  const st = settings().startDate;
  const start = st ? parseD(st) : parseD(today());
  const dayIdx = Math.round((sod() - start.getTime()) / DAY);
  const week = clamp(Math.floor(dayIdx / 7) + 1, 1, 8);
  const dow = clamp(dayIdx - (week - 1) * 7, 0, 6);
  return { start, dayIdx, week, dow, set: !!st, done: dayIdx >= 56, before: dayIdx < 0 };
}
const weekRange = (p, w) => `${fmt(addDays(p.start, (w - 1) * 7))} – ${fmt(addDays(p.start, w * 7 - 1))}`;
function levelCounts(ids) { const c = [0, 0, 0, 0]; ids.forEach(id => c[clamp(prog(id).m || 0, 0, 3)]++); return c; }
function barHTML(ids) {
  const c = levelCounts(ids), n = ids.length || 1;
  return `<div class="bar" aria-label="${c[1] + c[2] + c[3]} of ${ids.length} started"><i class="b3" style="width:${c[3] / n * 100}%"></i><i class="b2" style="width:${c[2] / n * 100}%"></i><i class="b1" style="width:${c[1] / n * 100}%"></i></div>`;
}
const dueIds = () => ALL.filter(id => { const p = prog(id); return (p.m || 0) >= 1 && p.srs && p.srs.due <= Date.now(); }).sort((a, b) => prog(a).srs.due - prog(b).srs.due);
function drillStats(ids) { let s = 0, r = 0; ids.forEach(id => { const d = prog(id).dr; if (d) { s += d.s || 0; r += d.r || 0; } }); return { s, r }; }
function bestTest(kind, week) { const ts = Object.values(S.tests).filter(t => t.kind === kind && (kind === 'final' || t.week === week)); return ts.length ? { best: Math.max(...ts.map(t => t.score)), n: ts.length } : null; }
function streak() {
  let n = 0; let d = new Date();
  if (!(S.activity[dstr(d)]?.n)) d = addDays(d, -1);
  while (S.activity[dstr(d)]?.n) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- Spaced repetition (SM-2, capped at 30 days for an 8-week course) ---------- */
function schedule(srs, r) {
  let { iv = 0, ef = 2.5, n = 0, lp = 0 } = srs || {};
  if (r === 0) return { iv: 0, ef: Math.max(1.3, +(ef - 0.2).toFixed(2)), n: 0, lp: lp + 1, due: Date.now() + 10 * 60e3 };
  if (r === 1) { iv = Math.max(1, Math.round((iv || 1) * 1.2)); ef = Math.max(1.3, ef - 0.15); }
  else if (r === 2) { iv = n === 0 ? 1 : n === 1 ? 3 : Math.round(Math.max(iv, 1) * ef); }
  else { iv = n === 0 ? 3 : n === 1 ? 5 : Math.round(Math.max(iv, 1) * ef * 1.3); ef += 0.15; }
  iv = Math.min(iv, 30);
  return { iv, ef: +ef.toFixed(2), n: n + 1, lp, due: sod() + iv * DAY };
}
const ivLabel = s => s.iv === 0 ? '10m' : s.iv + 'd';

function setMastery(id, m) {
  const p = prog(id); const patch = { m };
  if (m >= 1 && !p.readAt) patch.readAt = today();
  if (m >= 1 && !p.srs) patch.srs = { iv: 0, ef: 2.5, n: 0, lp: 0, due: Date.now() };
  if (m === 0) { patch.srs = null; patch.readAt = null; }
  setProg(id, patch);
}

/* ---------- Claude in the page ---------- */
function sampleErr(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared') return 'Claude is not allowed on this page. Use the page menu’s Permissions to allow it.';
  if (c === 'rate_limited') return 'You have reached a usage limit. Try again in a little while.';
  if (c === 'session_expired') return 'Your claude.ai session expired. Sign in again and retry.';
  if (c === 'cancelled') return '';
  if (c === 'prompt_too_large') return 'That answer is too long to grade. Shorten it and try again.';
  return 'Claude could not answer just now. Try again.';
}
function refBlock(id) {
  const Q = q(id), a = Q.a, p = prog(id);
  let s = `QUESTION (Q${id}): ${Q.t}\n\n`;
  if (a) s += `REFERENCE NOTES (drafted ${a.lastVerified || ''}, confidence ${a.confidence || 'n/a'}; figures may be approximate):\nSummary: ${a.summary}\nKey points:\n${(a.keyPoints || []).map(k => '- ' + k).join('\n')}\nFull answer:\n${a.answer}\n`;
  if (p.my) s += `\nTHE BROKER'S OWN EDITED VERSION (treat as more current than the reference where they conflict):\n${p.my}\n`;
  if (p.note) s += `\nTHE BROKER'S NOTES:\n${p.note}\n`;
  return s;
}
async function grade(id, answer) {
  const prompt = `You are a senior multifamily investment sales broker in Ventura County, California, coaching a broker who is building expertise in this market. Grade their answer to a client-style question against the reference notes. Judge substance, accuracy, Ventura County specificity, and whether it would satisfy a sophisticated property owner or investor. Do not penalize brevity or casual wording when the substance is there. If their answer contradicts the reference on a fact, list it as a correction, noting that the reference itself may be dated.

${refBlock(id)}
BROKER'S ANSWER:
${answer}

Reply with only JSON in this shape:
{"score": 0-100 integer, "verdict": "Strong" | "Solid" | "Partial" | "Weak", "hits": ["up to 4 short points they got right"], "misses": ["up to 4 short important points missing"], "corrections": ["factual errors, empty if none"], "model": "a 2-4 sentence answer you would say to the client"}`;
  const r = await sample.json(prompt, { modelTier: 'default' });
  return {
    score: clamp(Math.round(Number(r.score) || 0), 0, 100), verdict: String(r.verdict || ''),
    hits: (r.hits || []).map(String).slice(0, 4), misses: (r.misses || []).map(String).slice(0, 4),
    corrections: (r.corrections || []).map(String).slice(0, 4), model: String(r.model || ''),

}
function gradeHTML(g) {
  const cls = g.score >= 80 ? 'good' : g.score >= 60 ? 'warn' : 'bad';
  const li = (arr) => arr.length ? '<ul>' + arr.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : '<p class="muted">None.</p>';
  return `<div class="panel grade"><div class="score">${g.score}<small><span class="chip ${cls}">${esc(g.verdict || '')}</span></small></div>
  <div class="stack prose"><div><h4>What landed</h4>${li(g.hits)}</div><div><h4>What was missing</h4>${li(g.misses)}</div>
  ${g.corrections.length ? `<div><h4>Corrections</h4>${li(g.corrections)}</div>` : ''}
  <div><h4>How a senior broker would say it</h4><p>${esc(g.model)}</p></div></div></div>`;
}

/* Library */
const LF = { text: '', sec: 0, status: 'all' };
function libIds() {
  const t = LF.text.trim().toLowerCase(); const p = plan();
  return ALL.filter(id => {
    const Q = q(id), pr = prog(id), m = pr.m || 0;
    if (LF.sec && Q.s !== LF.sec) return false;
    switch (LF.status) {
      case 'new': if (m !== 0) return false; break;
      case 'read': if (m !== 1) return false; break;
      case 'explain': if (m !== 2) return false; break;
      case 'mastered': if (m !== 3) return false; break;
      case 'verify': if (!Q.a || pr.ver || Q.a.confidence === 'high') return false; break;
      case 'notes': if (!pr.note && !pr.my) return false; break;
      case 'missed': if (!pr.dr || pr.dr.s === pr.dr.r) return false; break;
      case 'behind': if (m >= 1 || !WEEKS.slice(0, p.week - 1).some(w => w.sections.includes(Q.s))) return false; break;
    }
    if (t) { const hay = (Q.t + ' ' + (Q.a ? Q.a.summary + ' ' + Q.a.answer + ' ' + (Q.a.keyPoints || []).join(' ') : '') + ' ' + (pr.note || '') + ' ' + (pr.my || '')).toLowerCase(); if (!(hay.includes(t) || ('q' + id) === t)) return false; }
    return true;
  });
}
function vLibrary() {
  const ids = libIds();
  const opts = [['all', 'All questions'], ['new', 'Not started'], ['read', 'Read'], ['explain', 'Can explain'], ['mastered', 'Mastered'], ['verify', 'Needs verifying'], ['missed', 'Missed in quizzes'], ['notes', 'Has my notes'], ['behind', 'Behind schedule']];

function recordDrill(id, ok) {

/* Quiz */
const QZ = { scope: 'week', sec: 1, count: 10, items: null, i: 0, picked: null, right: 0 };
function poolIds(scope, sec) {
  const p = plan();
  let ids = scope === 'week' ? weekIds(p.week) : scope === 'read' ? ALL.filter(id => prog(id).m >= 1)
    : scope === 'weak' ? ALL.filter(id => { const d = prog(id).dr; return d && d.s && d.r / d.s < 0.75; })
    : scope === 'sec' ? SEC[sec].ids : ALL;
  return ids.filter(id => hasA(id) && q(id).a.drills.length);
}
function mkItem(id, d) {
  const order = shuffle(d.c.map((_, j) => j));
  return { id, q: d.q, c: order.map(j => d.c[j]), a: order.indexOf(d.a), x: d.x };
}
function buildItems(ids, n) {
  const used = new Set(), items = [];
  const pick = id => { const ds = q(id).a.drills; const free = ds.map((d, k) => k).filter(k => !used.has(id + ':' + k)); if (!free.length) return null; const k = free[Math.floor(Math.random() * free.length)]; used.add(id + ':' + k); return mkItem(id, ds[k]); };
  for (const id of shuffle(ids)) { if (items.length >= n) break; const it = pick(id); if (it) items.push(it); }
  let guard = 0; while (items.length < n && ids.length && guard++ < 500) { const it = pick(ids[Math.floor(Math.random() * ids.length)]); if (it) items.push(it); }
  return shuffle(items);
}
function choicesHTML(it, picked, reveal, act) {
  return `<div class="choices">${it.c.map((c, j) => {
    let cls = ''; if (reveal) { if (j === it.a) cls = 'ok'; else if (j === picked) cls = 'no'; } else if (j === picked) cls = 'sel';
    return `<button type="button" class="choice ${cls}" data-act="${act}" data-j="${j}" ${reveal ? 'disabled' : ''}><span class="k">${'ABCD'[j] || j + 1}</span><span>${inl(c)}</span></button>`;
  }).join('')}</div>`;
}
function vQuiz() {

    <div class="progress-line"><i style="width:${pct(QZ.i, QZ.items.length)}%"></i></div>
    <p style="font:600 19px/1.4 var(--display)">${inl(it.q)}</p>${choicesHTML(it, QZ.picked, rev, 'qzPick')}

  }

      t.status = `Claude is grading client answer ${k + 1} of ${t.frs.length}…`; render();

  const graded = frs.filter(f => f.score != null);

    if (!a.q || !a.q.trim() || a.busy) return;
    a.busy = true; a.text = ''; render();
    const prompt = `You are an experienced multifamily investment broker in Ventura County, California. A broker studying the market asks a follow-up about one study question. Answer in under 200 words using Markdown bullets where useful. Be specific to Ventura County. If the answer depends on current figures, laws, or rates, say what to verify and where; you cannot browse the web.\n\n${refBlock(id)}\nFOLLOW-UP QUESTION:\n${a.q}`;
    try { const r = await sample(prompt, { cache: false, onText: ({ text }) => { a.text = text; const o = $('ask-out-' + id); if (o) o.innerHTML = md(text); } }); a.text = r.text; }
    catch (e) { a.text = e.text || ''; toast(sampleErr(e) || 'Stopped'); }
    a.busy = false; render();
  },
  rvStart() { RV.queue = dueIds().slice(0, 60); RV.i = 0; RV.shown = false; RV.done = 0; render(); },
  rvCram() { const p = plan(); RV.queue = shuffle(weekIds(p.week).filter(id => prog(id).m >= 1)); if (!RV.queue.length) RV.queue = shuffle(ALL.filter(id => prog(id).m >= 1)).slice(0, 30); RV.i = 0; RV.shown = false; RV.done = 0; render(); },
  rvShow() { RV.shown = true; render(); },
  rate(el) {
    const r = +el.dataset.r, id = RV.queue[RV.i]; const p = prog(id);
    setProg(id, { srs: schedule(p.srs, r) }); RV.done++;
    if (r === 0) RV.queue.push(id);
    RV.i++; RV.shown = false; render();
  },
  qzStart() { QZ.items = buildItems(poolIds(QZ.scope, QZ.sec), QZ.count); QZ.i = 0; QZ.picked = null; QZ.right = 0; render(); },
  qzReset() { QZ.items = null; render(); },
  qzPick(el) { if (QZ.picked != null) return; const it = QZ.items[QZ.i]; QZ.picked = +el.dataset.j; const ok = QZ.picked === it.a; if (ok) QZ.right++; recordDrill(it.id, ok); render(); },
  qzNext() { QZ.i++; QZ.picked = null; render(); },
  drNext() { DR.id = null; DR.text = ''; DR.result = null; DR.err = ''; DR.ref = false; render(); },
  drRef() { DR.ref = !DR.ref; render(); },
  async drGrade() {
    if (!DR.text.trim() || DR.busy) return;
    DR.busy = true; DR.err = ''; render();
    try { DR.result = await grade(DR.id, DR.text); setProg(DR.id, { fr: { s: DR.result.score, d: today() } }); }
    catch (e) { DR.err = sampleErr(e); }
    DR.busy = false; render();
  },
  startTest(el) {
    const kind = el.dataset.kind, w = +el.dataset.w;
    if (TS && TS.phase !== 'done') { location.hash = 'tests'; render(); toast('Finish or quit the test in progress first'); return; }
    TS = buildTest(kind, w);
    if (!TS.items.length) { TS = null; toast('No questions available for this test yet'); return; }
    location.hash = 'tests'; render();
  },
  tsPick(el) { TS.picks[TS.i] = +el.dataset.j; render(); },
  tsPrev() { TS.i = Math.max(0, TS.i - 1); render(); },
  tsNext() { if (TS.i + 1 < TS.items.length) TS.i++; else TS.phase = 'fr'; render(); },
  tsBack() { TS.phase = 'mcq'; TS.i = TS.items.length - 1; render(); },
  tsSubmit() { submitTest(); },
  tsSelf(el) { TS.frs[+el.dataset.k].self = +el.dataset.v; render(); },
  tsFinish() { finishTest(); },
  tsQuit() { TS.quitAsk = true; render(); },
  tsQuitNo() { TS.quitAsk = false; render(); },
  tsQuitYes() { TS = null; render(); },
  tsClose() { TS = null; render(); },
  ckWeek(el) { CKW = +el.dataset.w; if (location.hash !== '#checkins') location.hash = 'checkins'; else render(); },
  ckConf(el) { const w = CKW || plan().week; CKD[w].conf[+el.dataset.s] = +el.dataset.v; CKD[w].dirty = true; render(); },
  ckSave(el) {
    const w = +el.dataset.w, d = CKD[w];
    const body = { conf: d.conf, hours: d.hours, clear: d.clear, fuzzy: d.fuzzy, people: d.people, next: d.next, coach: d.coach || (S.checkins['w' + w] || {}).coach || '', savedAt: Date.now() };
    setDoc('checkins', 'w' + w, body); d.dirty = false; d.savedAt = body.savedAt; bump(); toast('Check-in saved'); render();
  },
  async ckCoach(el) {
    const w = +el.dataset.w, d = CKD[w]; d.coachBusy = true; d.coach = ''; render();
    try {
      const r = await sample(coachPrompt(w), { cache: false, onText: ({ text }) => { d.coach = text; const o = $('ck-coach'); if (o) o.innerHTML = md(text); } });
      d.coach = r.text; const saved = S.checkins['w' + w];
      if (saved) { setDoc('checkins', 'w' + w, { ...saved, coach: r.text }); }
    } catch (e) { d.coach = e.text || ''; toast(sampleErr(e) || 'Stopped'); }
    d.coachBusy = false; render();
  },
  async export() {
    if (!downloads) return;
    const data = JSON.stringify({ app: 'ventura-multifamily-prep', version: 1, exportedAt: new Date().toISOString(), progress: S.progress, tests: S.tests, checkins: S.checkins, meta: S.meta, activity: S.activity }, null, 1);
    try { await downloads.save({ filename: `ventura-study-backup-${today()}.json`, data }); toast('Backup saved'); }
    catch (e) { if (e && e.code !== 'declined') toast('Could not save the file here.'); }
  },
  async importYes() {
    const data = IMP; IMP = null;
    let n = 0;
    for (const coll of ['progress', 'tests', 'checkins', 'meta', 'activity']) {
      for (const [k, v] of Object.entries(data[coll] || {})) { if (v && typeof v === 'object' && /^[\w.~:@+-]+$/.test(k)) { setDoc(coll, k, v); n++; } }
    }
    toast(`Imported ${n} records`); render();
  },
  importNo() { IMP = null; render(); },
};
const IN = {
  libText(el) { LF.text = el.value; later('lib', () => { const ids = libIds(); const groups = SECTIONS.map(s => ({ s, ids: ids.filter(id => q(id).s === s.n) })).filter(g => g.ids.length); $('lib-results').innerHTML = libResults(groups); }, 150); },
  glText(el) { GQ = el.value; const t = GQ.toLowerCase(); $('gl-list').innerHTML = glList(GLOSSARY.filter(g => !t || (g.term + ' ' + g.def).toLowerCase().includes(t))); },
  my(el) { const id = +el.dataset.id; const k = 'q' + id; S.progress[k] = { ...prog(id), my: el.value, u: Date.now() }; dirty.add('progress/' + k); later('my' + id, () => { save('progress/' + k, S.progress[k]); bump(); }); },
  note(el) { const id = +el.dataset.id; const k = 'q' + id; S.progress[k] = { ...prog(id), note: el.value, u: Date.now() }; dirty.add('progress/' + k); later('note' + id, () => { save('progress/' + k, S.progress[k]); bump(); }); },
  fr(el) { const id = +el.dataset.id; (FR[id] || (FR[id] = {})).text = el.value; },
  ask(el) { const id = +el.dataset.id; (AK[id] || (AK[id] = {})).q = el.value; },
  drText(el) { DR.text = el.value; const b = document.querySelector('[data-act="drGrade"]'); if (b) b.disabled = !sample || DR.busy || !DR.text.trim(); },
  tsFr(el) { TS.frs[+el.dataset.k].text = el.value; },
  ck(el) { const w = CKW || plan().week; CKD[w][el.dataset.f] = el.value; CKD[w].dirty = true; },
};
const CH = {
  libSec(el) { LF.sec = +el.value; render(); },
  libStatus(el) { LF.status = el.value; render(); },
  qzScope(el) { QZ.scope = el.value; render(); },
  qzSec(el) { QZ.sec = +el.value; render(); },
  qzCount(el) { QZ.count = +el.value; },
  drScope(el) { DR.scope = el.value; ACT.drNext(); },
  importFile(el) {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (d.app !== 'ventura-multifamily-prep') throw 0; IMP = d; } catch (e) { toast('That file is not a backup from this page.'); } el.value = ''; render(); };
    rd.readAsText(f);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && el.dataset.act && ACT[el.dataset.act]) {
    if (el.tagName === 'A') e.preventDefault();
    ACT[el.dataset.act](el, e); return;
  }
  if (e.target === $('sheet')) $('sheet').hidden = true;
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('keydown', e => {
  if (typing() || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = route().name;
  if (r === 'review' && RV.queue && RV.i < RV.queue.length) {
    if (!RV.shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ACT.rvShow(); }
    else if (RV.shown && /^[1-4]$/.test(e.key)) ACT.rate({ dataset: { r: String(+e.key - 1) } });
  } else if (r === 'quiz' && QZ.items && QZ.i < QZ.items.length) {
    if (QZ.picked == null && /^[1-4]$/.test(e.key) && +e.key <= QZ.items[QZ.i].c.length) ACT.qzPick({ dataset: { j: String(+e.key - 1) } });
    else if (QZ.picked != null && e.key === 'Enter') ACT.qzNext();
  }
});

render();
initCaps();
})();
</script>
